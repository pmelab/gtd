name: Test

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: npm install

      - name: Lockfile is unchanged by install
        run: git diff --exit-code package-lock.json

      # CI-only on purpose: expiry depends on the date, so loop gates (npm test)
      # must not go red when a flag expires.
      - name: Lint feature flag lifecycle
        run: npx jiti scripts/lint-flags.ts

      # The unit map's rules live in .dependency-cruiser.mjs; this is the
      # picture of what they currently allow.
      - name: Generate the dependency graph
        run: npx depcruise src --include-only "^src/" --output-type archi > unit-map.dot

      - uses: actions/upload-artifact@v4
        with:
          name: unit-map
          path: unit-map.dot

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Configure git for e2e tests
        run: |
          git config --global user.email "ci@gtd.test"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Run all tests
        run: npm test
