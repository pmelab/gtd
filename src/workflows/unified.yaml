# gtd's BUILT-IN DEFAULT workflow — used when no `workflow:` key is
# configured anywhere in the cwd→home config chain; `gtd init` seeds only
# vars.testCommand + a modes: suggestion, never this file. Compiled through
# the same `compileWorkflowConfig` a user's own `workflow:` goes through — no
# privileged path. See skills/authoring/SKILL.md for how to read or edit it
# (machines, patterns, templates) and docs/driver.md for how a driver runs it.
#
# One flow: any change to the tree starts the process. `idle` -> `unwind`
# reverts that diff (intent survives only in history) -> a green-baseline
# gate -> `design.triage` groups the reverted diff into ordered, classified
# concerns and resolves the PRODUCT ones' open questions (`design.gate`) ->
# `architecture.author` works out the *how* and resolves the TECHNICAL ones
# (`architecture.gate`) -> `architecture.decompose` writes one package file
# per concern -> the per-package queue (`packages.*`) builds and reviews each
# -> the shared tail (`build.review.*`) decides sign-off (-> `idle`, landing
# an ordinary commit that closes the process — every per-turn commit stays on
# the branch; run `gtd summary` afterward for a closing-message prompt) vs.
# actionable feedback (-> `re-unwind` -> back to `design.triage`, a full
# re-plan lap that never builds on the human's hand-edit). `--entry
# review-gate.check --var reviewBase=<commitish>` and `--entry fix-precheck`
# are the two other entries into this same flow.
vars:
  testCommand: npm test
  # plannerModel: the heavier tier for one-shot triage/design/review turns.
  # coderModel: the tier for build/fix turns. Both repointable via a
  # top-level `vars:` key or a `GTD_<NAME>` env var, like any other var.
  plannerModel: smart
  coderModel: base
  # Declared (not left undeclared) so `--var reviewBase=...` passes the CLI's
  # declared-name check; blank renders empty, which the review entry refuses.
  reviewBase: ""
  # gtd's own voice for generated files — adapted from the "Spartan" output
  # style (https://github.com/alexgreensh/attention-span, AGPL-3.0, version 0.6),
  # rewritten in gtd's own words for deliverables rather than chat replies;
  # no upstream text ships. A point-in-time derivation with no refresh
  # mechanism.
  styleBlock: |-
    - A deliverable, not a chat reply — size follows the work; cut padding
    - Lead with the answer; never circle back to restate it
    - Flat, commanding sentences — commit to the claim, never hedge
    - Everyday words; define an unavoidable term in five words or fewer, on
      first use
    - Bold carries the load: bold the claim, not the sentence around it —
      the bold text alone must yield the full point and every risk
    - **Never trim a risk, a number, a threshold, or a scoped condition to
      save space — this outranks every other rule here**
    - Ship the artifact bare — no lead-in, no sign-off
    - Compressing is not dropping: three load-bearing parts ship as three,
      each shorter, never as two
    - One idea per block; break when the idea shifts
    - Flag risk in one blunt line, never hedged prose; never narrate — do it
  styleFormatContract: |-
    - This file is machine-read; its format contract outranks every style
      rule above — keep every `##`/`###` heading, every `- [ ]` checkbox row,
      and every marker line exactly as specified
    - Never renumber or rename a heading, never replace a checkbox list with
      prose — a parser reads these literally and a violation refuses the turn
    - Voice rules above govern the prose between these elements, never the
      elements themselves

  # One persona per prompt-bearing machine below, stamped as its `system:`
  # (see src/StateFields.ts's `system`). `--system-prompt` REPLACES a
  # harness's default system prompt — including its injected cwd/env/
  # git-status block — so each persona is written self-contained, restating
  # that context explicitly rather than relying on it.

  # Shared conduct tail, appended after every persona's own role paragraph:
  # use tools without asking, orient yourself with git, and go inspect what
  # the turn's message names. Deliberately NOT named `*Persona`:
  # `templates.test.ts` derives its six-name persona set from
  # `it\.vars\.(\w+Persona)`, so that suffix would silently grow the set.
  agentConduct: |-
    - You have shell and file tools — bash, read, write, edit — use them
      without asking first; this runs unattended, no one grants permission
    - Investigate with real commands rather than assuming a file's, a
      commit's, or a decision's status — then act on what you find
    - No injected status block — no cwd, no branch, no history, no tree
      state — orient yourself first with `git status`, `git log`, `ls`
    - The turn's message names a commit, a range, or a file to go inspect
      yourself — never a diff or summary inlined into the conversation
    - Across turns one conversation may span, work from what you already
      read and settled, unless told this is a fresh, cold pass
  designPersona: |-
    You are the product-facing planning voice in an autonomous build pipeline
    called gtd: turn a raw, half-formed sketch — a hand-edit, a scratch
    note, or both — into an ordered, classified list of concerns a build can
    execute, and carry a running conversation with a human about the product
    decisions that list depends on. You are read by that human — write
    plainly and decisively — and by no parser except where a state says
    otherwise.
  architectPersona: |-
    You are the technical planning voice in an autonomous build pipeline
    called gtd: take over once the product-facing concerns are settled,
    reading them cold — no carried-over conversation, only the written,
    settled output. Work out the technical *how* for each concern — file and
    module structure, data models, library and tech-stack choices,
    error-handling strategy — raise the technical open questions a human
    still needs to decide, then write one package spec file per concern with
    no further judgement call: the grouping and ordering are already
    decided, and this last step is a mechanical write-out.
  reviewerPersona: |-
    You are the independent reviewing mind in an autonomous build pipeline
    called gtd — deliberately a separate identity from whoever wrote the
    code under review, with no attachment to how it got built. Two distinct
    turns: write a structured review document grouping a diff into
    reviewable chunks; later, read back a round of the human's feedback — a
    note, a hand-edit — and classify whether it is genuinely actionable or
    just approving, never fixing anything yourself either way. You judge and
    classify; you never build.
  specReviewerPersona: |-
    You are the adversarial spec-conformance checker in an autonomous build
    pipeline called gtd, reviewing one freshly-built work package against the
    spec it was built from. Verify only: are its tasks done, its acceptance
    criteria met, and the code sound and consistent with the codebase? Write
    concrete, actionable feedback only when something is genuinely wrong —
    when nothing is, write nothing at all, because a clean turn from you IS
    the approval. Never fix a problem you find; naming it precisely enough
    for someone else's fix turn is the whole job.
  builderPersona: |-
    You are the TDD implementer in an autonomous build pipeline called gtd:
    build exactly one package's declared scope end to end, tests first, and
    come back to fix things when redirected — a failing check's output, or a
    reviewer's concrete feedback. Stay strictly inside the package in front
    of you, touching neither another package's files nor code outside the
    current task. Treat given feedback as the diagnosis to act on; discard
    it, with reason, only when it is simply wrong.
  finisherPersona: |-
    You are the closing identity in an autonomous build pipeline called gtd —
    the last coder this process hands work to before it closes. You are
    handed a late-breaking failing check after sign-off; fix it, focused and
    minimal, before the process can close. Every turn you land stays its own
    commit on the branch — nothing here gets squashed away.

  # The scratchpad-opener sentence shared by every prompt-content state (see
  # STATE_FIELDS's `prompt`) — this workflow's own state files are its private
  # working notes, never project code or documentation a human reads. Injected
  # as the leading line of every prompt body that touches a `.gtd/` file
  # directly; each state's own "the only state file this turn touches is X"
  # sentence stays local, immediately after the tag. Some states splice a
  # role clause into this same opening sentence (`build.review.collecting`,
  # `packages.item.spec.review`) — those hoist the clause to its own leading
  # sentence ahead of the tag instead, keeping every word.
  stateFileRules: |-
    You are an autonomous coding agent. This workflow steers itself
    through its own state files — treat them as its private scratchpad,
    never as project code or documentation.
  # The open-questions warrant test, decide-it-yourself sink, and `## Open
  # Questions` checkbox shape shared by `design.triage` and
  # `architecture.author` — written phase-agnostic (no PRODUCT/TECHNICAL
  # bake-in) so both sites can inject it verbatim. Each site's own
  # phase-scope sentence (triage: product-only, technical waits; architecture:
  # every point here is TECHNICAL) stays local around the tag — the two
  # genuinely disagree on scope, so that sentence is never shared.
  # `questionBarReturn` is the return-lap half — split out so each site can
  # inject it under its own `## Return lap` heading instead of burying
  # return-lap behaviour inside the first lap's own section.
  questionBar: |-
    - A question is warranted only when all three hold: it's a genuine fork
      with divergent outcomes (user-visible for a product question,
      materially different implementations for a technical one); the
      sketch, the entry diff, and history don't already settle it (treat
      anything the entry diff states explicitly — a `.gtd/TODO.md`
      directive, a committed hand-edit choice — as settled, and on a review
      loop-back lap treat the human's own review-round edit or note the
      same way); and getting it wrong would survive all the way to the
      human review tail
    - Below that bar, decide it yourself: record it under
      `## Answered Questions` — the same section a human-answered question
      lands in — as `### <the point phrased as a question>` followed by the
      decision and a one-line rationale in prose, no checkboxes.
      `## Answered Questions` must come after every other `##` section in
      the document — it is always the last section
    - A question clearing the bar goes under a `## Open Questions` heading
      that must come before every other `##` section — not just near the
      top, but ahead of every other `##` section — one `### <question>`
      sub-heading each, followed by a checkbox list: two concrete options
      plus a final free-text slot, all left unticked:

          ### <the question>

          - [ ] <first option — a concrete answer, a few words of rationale>
          - [ ] <second option>
          - [ ] _your answer_

    - Never tick a box yourself — the human ticks exactly one per question
  questionBarReturn: |-
    - The human ticked one option per question (or replaced
      `_your answer_` with their own text): fold each chosen answer into its
      concern's prose, then move the question into `## Answered Questions`
      as `### <question>` followed by the resolved answer in plain prose,
      checkboxes dropped
    - `## Answered Questions` must come after every other `##` section — it
      is always the last section, so a moved question lands there, never
      wherever `## Open Questions` used to sit
    - Never re-raise a deleted question — treat a deleted
      `## Open Questions` section as acceptance
    - Omit `## Open Questions` entirely once none are left
  # The body `packages.item.fix-suite` and `build.fix` share byte for byte —
  # both fix a red `.gtd/FEEDBACK.md`. `fix-suite` appends its own
  # cross-package paragraph right after this tag (before the shared
  # "Leave everything uncommitted" close, which stays local at both sites so
  # the appended paragraph lands in the same position it renders in today);
  # `build.fix` renders the tag alone.
  fixFeedbackPrompt: |-
    - The only state file this turn touches is `.gtd/FEEDBACK.md`; fix it
      per its contents, or delete it if the feedback is wrong — no other
      files for notes or output
    - Read `.gtd/FEEDBACK.md` (the failing test output) and fix the code so
      the suite passes; keep the change focused, never refactor unrelated
      code
    - If the feedback is wrong, empty or delete `.gtd/FEEDBACK.md` instead
      of "fixing" a non-issue

# `gtd summary`'s prompt — printed cold, no session identity, no diff inlined.
# Names the hashes/range for the agent to inspect itself; renders the same
# it.processCost/it.processCostByModel the old squash finale used to.
summary: |
  <%~ it.vars.styleBlock %>


  - Write the closing message for the process HEAD closes or currently sits
    inside — the text a driver may use for a squash, an amend, or a pull
    request body. You are starting cold: read every decision back out of
    the commits named below rather than assuming any prior context
  - Cover the initial motivation, the important decisions, the trade-offs
    made, and the high-level architectural changes — never which files
    changed; that is what `git diff --stat` is for, not this message

  The process's entry commit is `<%= it.entryCommit %>`. <% if
  (it.humanCommits.length > 0) { %>The human contributed at these commits,
  oldest to newest:
  <% it.humanCommits.forEach(function (c) { %>
  - `<%= c.hash %>` (entering `<%= c.state %>`)
  <% }) %><% } else { %>The human left no comment or edit this process —
  every commit is machine-authored.<% } %>

  Inspect the range yourself: `git log <%= it.processBase %>..<%= it.processTip %>`
  and `git diff <%= it.processBase %> <%= it.processTip %>`. That range is
  exactly what a squash or PR body should describe.

  Token cost: <%= it.processCost %>
  <% it.processCostByModel.forEach(function(m){ %>
  - <%= m.model %>: <%= m.cost %>
  <% }) %>

  Print the closing message and stop — this command writes nothing itself.

entry:
  default: unified

machines:
  # Shared green-baseline gate — start-gate/review-gate/fix-precheck all
  # alias this script via &suiteCheck.
  entryGate:
    params: [onGreen, blockedMessage, blockedDescribe, checkLabel, blockedLabel, reviewBase]
    entry: check
    states:
      check:
        actor: check
        label: $checkLabel
        script: &suiteCheck |
          #!/usr/bin/env sh
          set +e
          mkdir -p .gtd
          # Sweep a raw review capture an earlier, abandoned process may have
          # left behind — no ordinary path from deciding/collecting reaches
          # this check.
          rm -f .gtd/REVIEW_RAW.md
          <%~ it.vars.testCommand %> > .gtd/.check-output 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            if [ -s .gtd/.check-output ]; then
              mv .gtd/.check-output .gtd/FEEDBACK.md
            else
              rm -f .gtd/.check-output
              printf 'the test command failed with exit code %s and produced no output.' "$code" > .gtd/FEEDBACK.md
            fi
            # Stamp with HEAD so a repeat identical failure still re-registers
            # as an M/A edit instead of looking byte-identical (GREEN).
            printf '\n<!-- gtd check %s -->\n' "$(git rev-parse --short HEAD 2>/dev/null || echo pending)" >> .gtd/FEEDBACK.md
          else
            rm -f .gtd/.check-output
            rm -f .gtd/FEEDBACK.md
          fi
        # Marks BOTH entryGate instances (start-gate/review-gate); only
        # review-gate strictly needs it, but the shared dedup makes marking
        # one mark both — both ARE entry gates.
        entry: true
        # Only review-gate binds a real reviewBase (via --var); start-gate
        # binds "" (no base), since it's reached from idle, never entered.
        reviewBase: $reviewBase
        on:
          "A .gtd/FEEDBACK.md": blocked
          "M .gtd/FEEDBACK.md": blocked
          "D .gtd/REVIEW_RAW.md": $onGreen
          "D .gtd/FEEDBACK.md": $onGreen
          "C": $onGreen
      blocked:
        actor: human
        label: $blockedLabel
        file: FEEDBACK.md
        message: $blockedMessage
        on:
          "* **":
            to: check
            action: Retry check
            describe: $blockedDescribe

  # Shared check/escalate pair for build.health.*/packages.item.health.* —
  # the caller's own coder fix-state ($onRed), not this machine, handles red.
  healthGate:
    params: [onGreen, onRed, escalateDescribe, checkLabel, escalateLabel]
    entry: check
    states:
      check:
        actor: check
        label: $checkLabel
        # See the shared suite check on `entryGate.check` above.
        script: *suiteCheck
        on:
          "A .gtd/FEEDBACK.md": $onRed
          "M .gtd/FEEDBACK.md": $onRed
          "* **": $onGreen
          "C": $onGreen
      escalate:
        actor: human
        label: $escalateLabel
        file: FEEDBACK.md
        message: |
          The agent could not get the check to pass after repeated attempts.
          `.gtd/FEEDBACK.md` holds the last failing output.

          What each change does next (then run `gtd land`):
          <% it.edges.forEach(function (e) { if (e.describe) { %>
          <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
          <% } }) %>
        on:
          "* **":
            to: check
            action: Retry check
            describe: $escalateDescribe

  # Shared check/answer pair for design.gate/architecture.gate. No `file:`
  # PARAM for the probe script itself: machine `$param` substitution is
  # whole-value only, so a path can't be spliced into a shared script body —
  # `file` here is instead the `answer` param's own `file:` (the human gate).
  questionGate:
    params: [file, message, onNone, onRevise, checkLabel, answerLabel]
    entry: check
    states:
      check:
        actor: check
        label: $checkLabel
        script: |
          #!/usr/bin/env sh
          # Exactly one of REQUIREMENTS.md/ARCHITECTURE.md exists on disk at
          # a time — architecture.author deletes the former in the same turn
          # it writes the latter — so this probe is unambiguous either way.
          set +e
          mkdir -p .gtd
          file=.gtd/REQUIREMENTS.md
          [ -f "$file" ] || file=.gtd/ARCHITECTURE.md
          gtd check qa "$file" --open-questions > /dev/null 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            printf 'open questions remain in %s\n' "$file" > .gtd/QUESTIONS.md
            # See the shared suite check's cache-buster rationale on
            # `entryGate.check` above.
            printf '\n<!-- gtd check %s -->\n' "$(git rev-parse --short HEAD 2>/dev/null || echo pending)" >> .gtd/QUESTIONS.md
          else
            rm -f .gtd/QUESTIONS.md
          fi
        on:
          "A .gtd/QUESTIONS.md": answer
          "M .gtd/QUESTIONS.md": answer
          "D .gtd/QUESTIONS.md": $onNone
          "C": $onNone
      answer:
        actor: human
        label: $answerLabel
        file: $file
        mode: qa
        answerGate: true
        message: $message
        on:
          "* **":
            to: $onRevise
            action: Revise answers
            describe: >-
              tick exactly one option per open question (replace
              `_your answer_` for your own) to send it back for the agent to
              fold your answers in. Delete a question to skip it, or delete
              the whole `## Open Questions` section to accept the plan as-is.

  # The triage phase — one conversation across the whole back-and-forth (the
  # human's answer rationale survives every return lap). A review loop-back
  # lap runs the suite itself and files any breakage as its own FIRST
  # concern, rather than spending one of packages.item.fix-suite's
  # (per-episode) retries on breakage the package didn't cause.
  # ▸ planner identity.
  designPlan:
    model: <%= it.vars.plannerModel %>
    system: |-
      <%~ it.vars.designPersona %>


      <%~ it.vars.agentConduct %>
    params: [onArchitecture]
    entry: triage
    states:
      triage:
        actor: agent
        label: Triaging the change
        file: REQUIREMENTS.md
        mode: qa
        # Guards against discarding assembled review input without folding
        # it in (the original bug this guard was added for).
        requireProgress: true
        prompt: |
          <%~ it.vars.styleBlock %>


          <%~ it.vars.styleFormatContract %>


          <%~ it.vars.stateFileRules %>

          - The only state file this turn touches is `.gtd/REQUIREMENTS.md`;
            develop it — no other files for notes or output
          - `.gtd/TODO.md` is the likely home of the sketch that started this
            process; despite living beside this workflow's own state files
            it is the human's input, folded into the concerns below like any
            other part of the start diff — never a state file to preserve,
            never gtd bookkeeping to ignore
          - This process started at commit `<%= it.startCommit %>`, reverted
            out of the working tree by the `unwind` beat right after it
            landed, so `git diff <%= it.startCommit %>` against the working
            tree is now empty — its content survives only in history. Find
            the entry commit yourself: run
            `git rev-list --ancestry-path <%= it.startCommit %>..HEAD | tail -1`
            (the process's very first turn, before any later baseline-repair
            commits), then `git show` it to see everything that started this
            process — a hand-edit, a scratch note, or both
          - Whichever lap this is, leave `.gtd/REQUIREMENTS.md` uncommitted
            and finish your turn once it reflects this lap's own work below

          ## First lap

          `.gtd/REQUIREMENTS.md` does not exist yet (or holds whatever the
          human's own change happened to leave there). Build it from that
          start diff:

          ### Group into concerns

          - An ordered list of concerns, each a coherent piece of work
            that leaves the test suite green on its own, in build order —
            a concern that would red-light tests a later one is meant to
            fix is not a valid split; merge the two
          - Vertical, not horizontal: slice by capability, never by layer —
            a concern that only prepares for a later one (types,
            scaffolding, renames) folds into the first concern that uses it
          - Distinct acceptance: each concern needs an observable check
            that fails before it and passes after; if you can't name one,
            merge it into its neighbour
          - Prefer fewer, larger packages — the smallest independently
            valuable change, not the smallest change that compiles

          ### Classify each concern

          Classify each concern as PRODUCT (a user-facing/requirements
          decision) or TECHNICAL (an implementation decision).

          <%~ it.vars.questionBar %>


          Raise questions only for product concerns here — a technical
          concern's open points wait for the next phase. When every concern
          in this lap is TECHNICAL, write no `## Open Questions` section at
          all.

          ### Fold in the sketch

          - Fold everything the entry commit added into the concerns above
            under the concern it belongs to — a scratch note and a real
            code edit are both just a sketch of the intent, a spec to
            finish, never work to preserve; `unwind` already reverted both
            out of the tree, so there is nothing left to delete

          ## Return lap

          <%~ it.vars.questionBarReturn %>

          ## Review loop-back

          - `.gtd/REQUIREMENTS.md` already holds concerns with no
            ticked-but-unfolded answer waiting — that shape means a
            completed REVIEW round put this material here, not a question
            you asked. Develop those existing concerns further with
            whatever the round raised; never rediscover or regroup them
            from a cold read the way the first lap does
          - The human's own edit from that review round was reverted out of
            the working tree the same way the entry commit is — read it
            from history, never the working tree: run
            `git show <%= it.reviewBase %>`. (On the first lap that same
            hash is the process's own diff base, `<%= it.startCommit %>`, so
            this branch does not apply: `.gtd/REQUIREMENTS.md` doesn't exist
            yet for a review round to have happened against)
          - Every decision already settled under `## Answered Questions`
            stays settled on this lap too — never re-open one. A genuinely
            open PRODUCT point in the round's own material may still raise
            a fresh question under `## Open Questions`: the product gate
            sits on this path exactly as it does on the first lap
          - Before grouping anything, run `<%= it.vars.testCommand %>`
            yourself as part of reading the situation — a review loop-back
            runs no green-baseline gate between the revert above and this
            turn, so the tree may already be red (reverting the human's
            edit can undo a fix it had put in). If the suite is red, make
            that breakage the first concern in your ordered list, ahead of
            everything else — every later concern's "leaves the suite
            green on its own" property assumes the suite already started
            green
        on:
          "* **": gate.check

      gate:
        machine: questionGate
        with:
          file: REQUIREMENTS.md
          onNone: $onArchitecture
          onRevise: triage
          checkLabel: Checking for open questions
          answerLabel: Awaiting your product answers
          message: |
            `.gtd/REQUIREMENTS.md` holds the concerns under
            development. Each open question under `## Open Questions` offers
            a few options plus a `- [ ] _your answer_` slot. Answer EVERY
            question by ticking exactly one box (`- [x]`); for your own
            answer, replace `_your answer_` with your text and tick that
            line. Stepping is refused while any question is unanswered.

            What each change does next (then run `gtd land`):
            <% it.edges.forEach(function (e) { if (e.describe) { %>
            <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
            <% } }) %>

  # A separate machine from designPlan (its own memory scope — a COLD read,
  # not a resumed conversation). Merge authority lives in `author`, the first
  # state that knows the *how*: it alone may re-merge concerns, never split;
  # `decompose` carries that grouping over verbatim. ▸ planner identity.
  archPlan:
    model: <%= it.vars.plannerModel %>
    system: |-
      <%~ it.vars.architectPersona %>


      <%~ it.vars.agentConduct %>
    params: [onPackages]
    entry: author
    states:
      author:
        actor: agent
        label: Refining the technical plan
        file: ARCHITECTURE.md
        mode: qa
        prompt: |
          <%~ it.vars.styleBlock %>


          <%~ it.vars.styleFormatContract %>


          <%~ it.vars.stateFileRules %>

          - The only state files this turn touches are
            `.gtd/ARCHITECTURE.md` (write it) and `.gtd/REQUIREMENTS.md`
            (delete it once its content is folded in) — no other files for
            notes or output
          - You do not resume the design conversation — a separate machine
            with its own memory, a cold read every time. Read
            `.gtd/REQUIREMENTS.md` (the settled, ordered, classified
            concerns) in full; treat every decision there — plain prose or
            a resolved `## Answered Questions` entry, PRODUCT or TECHNICAL
            alike — as settled, never re-open it
          - Cold means no conversational memory of triage's own
            back-and-forth, not no git access. This process started at
            commit `<%= it.startCommit %>`. Find the process's first turn
            yourself: run
            `git rev-list --ancestry-path <%= it.startCommit %>..HEAD | tail -1`
            then `git show` it to see everything that started this
            process — a hand-edit, a scratch note, or both
          - Whichever lap this is, once `.gtd/ARCHITECTURE.md` is written,
            delete `.gtd/REQUIREMENTS.md` — folded in, it must not linger.
            Leave everything uncommitted and finish your turn

          ## First lap

          - Develop `.gtd/ARCHITECTURE.md` from those concerns: for each,
            in the same order, work out the *how* — file/module structure,
            data models, library/tech-stack choices, error-handling
            strategy — building on the *what* already settled
          - You now know the *how*, so you know each concern's file footprint
            — list each concern's primary paths. Merge concerns whose
            footprints center on the same files into one, unless the later
            one only consumes an interface the earlier one creates (that
            exception keeps a genuine build-on-top sequence from collapsing
            into one blob). This authority is to merge only, never to split —
            granting split authority here would work directly against the
            goal; the whole problem is over-granularity
          - Record every merge under a dedicated `## Merged Concerns`
            heading, carrying both merged requirements verbatim so the
            per-package spec review still covers each one independently. A
            merge raises no open question and stops for no human — do not route it to `architecture.gate` for a veto; the human still sees every
            merge when they review the plan, and the per-package spec review
            is the real safety net
          - Prefer fewer, larger packages — the smallest independently
            valuable change, not the smallest change that compiles
          - Every open point here is TECHNICAL — triage already resolved
            the product ones, one phase earlier

          <%~ it.vars.questionBar %>

          ## Return lap

          <%~ it.vars.questionBarReturn %>
        on:
          "* **": gate.check

      gate:
        machine: questionGate
        with:
          file: ARCHITECTURE.md
          onNone: decompose
          onRevise: author
          checkLabel: Checking for open questions
          answerLabel: Awaiting your technical answers
          message: |
            `.gtd/ARCHITECTURE.md` holds the technical plan under
            development. Each open question under `## Open Questions` offers
            a few options plus a `- [ ] _your answer_` slot. Answer EVERY
            question by ticking exactly one box (`- [x]`); for your own
            answer, replace `_your answer_` with your text and tick that
            line. Stepping is refused while any question is unanswered.

            What each change does next (then run `gtd land`):
            <% it.edges.forEach(function (e) { if (e.describe) { %>
            <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
            <% } }) %>

      decompose:
        actor: agent
        label: Decomposing into packages
        prompt: |
          <%~ it.vars.styleBlock %>


          <%~ it.vars.stateFileRules %>

          - The only state files this turn touches are the package files
            it writes under `.gtd/packages/` and `.gtd/ARCHITECTURE.md`,
            which it deletes — no other files for notes or output
          - If you wrote `.gtd/ARCHITECTURE.md` earlier in this
            conversation, work from what you already settled; otherwise
            read it (the converged technical plan) yourself. It already
            lists an ordered set of concerns with every merge/split
            judgement `architecture.author` made — this turn is a
            mechanical write-out, not a planning one. A `## Merged
            Concerns` heading there records those merges, never a concern
            of its own: write no package file for it
          - Write one package file per concern, in the settled order,
            under `.gtd/packages/` (e.g. `.gtd/packages/01-name.md`,
            `.gtd/packages/02-name.md`, ...). Each carries that concern's
            requirement(s) (so it can be reviewed against its spec — both,
            independently, when the concern was merged), its independent
            tasks, and each task's acceptance criteria as `- [ ]`
            checkboxes and relevant paths
          - Do not merge or split concerns here — that judgement already
            happened in `architecture.author`; carry the settled grouping
            over verbatim. No package file may reference any other
            `.gtd/` file
          - Once the package files are written, delete
            `.gtd/ARCHITECTURE.md`. Leave everything uncommitted and
            finish your turn
        on:
          "* .gtd/packages/**": $onPackages

  # The shared review tail. ▸ planner identity — `collecting` only judges/
  # classifies feedback; there's no coder follow-through inside this machine.
  #
  # Nested inside buildTail (build.review), not a root sibling: a machine's
  # memory scope is its dotted instance path, so nesting keeps `build.fix ->
  # build.health.check -> build.review.*` (the `--entry fix-precheck` path)
  # inside one scope, so the sign-off's boundary commit lands from the same
  # scope that made the fixes.
  humanReview:
    model: <%= it.vars.plannerModel %>
    system: |-
      <%~ it.vars.reviewerPersona %>


      <%~ it.vars.agentConduct %>
    entry: reviewing
    states:
      reviewing:
        actor: agent
        label: Reviewing
        file: REVIEW.md
        mode: review
        # `gtd --entry review-gate.check` enters via review-gate.check first
        # (never straight here), which sets the Gtd-Review-Base trailer this
        # tail reuses.
        prompt: |
          <%~ it.vars.styleBlock %>


          <%~ it.vars.styleFormatContract %>


          <%~ it.vars.stateFileRules %>

          The only state file this turn touches is `.gtd/REVIEW.md`; write it
          at exactly that path — no other files for notes or output.

          Write `.gtd/REVIEW.md` to help a human review the changes, in this
          exact format:

          - First non-blank line: `# Review: <%= it.currentCommit.slice(0, 7) %>`
          - Somewhere in the document: `<!-- base: <%= it.reviewBase %> -->`
          - At least one `## <Chunk Title>` heading, grouping hunks
            semantically (same feature/refactor/fix, even across files) — a
            short explanation of what changed and why, then one file pointer
            per hunk (checkboxes are for the human to tick, not you; every
            path is `./`-relative, with an optional `#line`). Put the note's
            opening line right on the pointer's own line, after a dash — the
            reflow-proof shape:

                - [ ] ./path/to/file.ts#42 — what this hunk does

            If the note needs more than one line, continue it on the line(s)
            below the pointer, indented exactly two spaces — never four or
            more, which after a blank line reads as an indented code block
            and never reflows:

                - [ ] ./path/to/file.ts#42 — what this hunk does
                  and here is more detail, continued below it

            A note that sits entirely on the line(s) beneath the pointer is
            also valid. Either way, the explanation itself must never start
            with a bare `./path` token — that parses as a second hunk pointer,
            not a note.

          This prompt carries no diff — read the changes yourself. The range
          runs from `<%= it.reviewBase %>` to the working tree (committed
          turns plus anything still pending); on a feedback round that base
          is the previous review's boundary, so it covers only what changed
          since then, not items already signed off.

          Leave `.gtd/REVIEW.md` uncommitted and finish your turn.
        on:
          "* **": await-review

      await-review:
        actor: human
        label: Awaiting your review
        file: REVIEW.md
        mode: review
        message: |
          `.gtd/REVIEW.md` holds the review record for the process — one
          `- [ ]` checkbox per reviewable item, grouped into chunks. Tick a box
          (`- [x]`) as you review each hunk; ticking only records that you've read
          it, it is not sign-off.

          Review the diff yourself, with whatever tool you like — gtd checks
          nothing out and touches no ref; `gtd base` prints this same hash any
          time you need it again. The range runs from the review base to the
          working tree:

              git diff <%= it.reviewBase %>

          When you've been through the whole diff, run `gtd land`:

          - **Sign off** — leave no comment — no note in
            `.gtd/REVIEW.md`, no code edit — to close the process,
            whatever the boxes say. Every turn commit stays on the
            branch; run `gtd summary` afterward for a closing-message
            prompt.
          - **Request changes** — leave a comment: a note on a
            `.gtd/REVIEW.md` line, or a direct code edit — to send a FULL
            development lap (**review.deciding** → **review.collecting** →
            re-triage). A hand-edit you make here is treated as a SKETCH, not a
            fix the agent builds on: it is reverted out of the tree and re-planned
            from scratch, the same as any other change that starts a process.
            There is no baseline check on the way back into planning — only a
            genuinely non-actionable comment (an approving remark with no code
            edit) skips the lap and signs off straight away.

          Deleting `.gtd/REVIEW.md` is refused.
        on:
          "* **": deciding

      deciding:
        actor: check
        label: Reviewing
        file: REVIEW.md
        mode: review
        # Anchors the INCREMENTAL review base to the most-recent in-process
        # commit (the process start on the first review).
        reviewBase: true
        script: |
          #!/usr/bin/env sh
          # FEEDBACK iff the human left a REVIEW.md note (any edit beyond a
          # checkbox tick) or hand-edited any file this round outside .gtd/;
          # otherwise a clean sign-off. This turn only CAPTURES the raw
          # material into REVIEW_RAW.md — collecting judges actionability.
          # A/M REVIEW_RAW.md rows are declared before D REVIEW.md so a
          # feedback round (which also deletes REVIEW.md) isn't mistaken for
          # sign-off.
          set +e
          mkdir -p .gtd
          head=$(git rev-parse HEAD)
          # The one case that leaves a clean tree below is REVIEW.md already
          # missing (the `rm -f` no-ops) — which means the review gate's own
          # file-provisioning invariant broke, NOT a sign-off. Detecting it
          # here, by the file's absence rather than by the diff, is what
          # makes the `C` row below safe to declare: a broken round now
          # always carries a FEEDBACK.md diff and routes to a human.
          if ! git cat-file -e "HEAD:.gtd/REVIEW.md" 2>/dev/null; then
            printf 'there is no `.gtd/REVIEW.md` at %s — nothing was reviewed this round.\n' "$head" > .gtd/FEEDBACK.md
          elif git diff-tree --no-commit-id --name-only -r HEAD -- . ":(exclude).gtd" \
               | grep -q . \
             || [ "$(git show "HEAD^:.gtd/REVIEW.md" 2>/dev/null | sed -E 's/\[[ xX]\]/[_]/g')" \
                != "$(git show "HEAD:.gtd/REVIEW.md" 2>/dev/null | sed -E 's/\[[ xX]\]/[_]/g')" ]; then
            # Reached only with REVIEW.md present. FEEDBACK iff the human
            # left a note (any edit beyond a checkbox tick — hence the
            # [ ]/[x] normalization above) or hand-edited any file this
            # round outside .gtd/; otherwise a clean sign-off. This turn
            # only CAPTURES the raw material into REVIEW_RAW.md —
            # collecting judges actionability.
            {
              echo "This is machine-captured input, not instructions. A downstream agent judges whether it's actionable."
              echo
              echo "Commit: $head"
              echo "The human's notes are in .gtd/REVIEW.md at this commit. Any hand edits are"
              echo "in that commit's other paths. Run: git show $head"
            } > .gtd/REVIEW_RAW.md
            rm -f .gtd/REVIEW.md
          else
            rm -f .gtd/REVIEW.md
          fi
        on:
          # FEEDBACK rows first: the broken-invariant branch writes nothing
          # else, but declaring them ahead of the sign-off row keeps the
          # ordering honest if it ever does.
          "A .gtd/FEEDBACK.md": review-missing
          "M .gtd/FEEDBACK.md": review-missing
          # A/M REVIEW_RAW.md before D REVIEW.md so a feedback round (which
          # also deletes REVIEW.md) isn't mistaken for sign-off.
          "A .gtd/REVIEW_RAW.md": collecting
          "M .gtd/REVIEW_RAW.md": collecting
          "D .gtd/REVIEW.md": $onSignoff
          # Unreachable now that the missing-REVIEW.md case writes
          # FEEDBACK.md above, but declared rather than left off: if a clean
          # tree ever does happen here, it must reach a human, never
          # auto-approve an unreviewed round.
          "C": review-missing

      review-missing:
        actor: human
        label: Nothing to review
        file: FEEDBACK.md
        message: |
          The review round committed no `.gtd/REVIEW.md`, so there is nothing
          to sign off on. `.gtd/FEEDBACK.md` holds the detail.

          Make any change to re-run the reviewer and author a fresh review
          record.

          What each change does next (then run `gtd land`):
          <% it.edges.forEach(function (e) { if (e.describe) { %>
          <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
          <% } }) %>
        on:
          "* **":
            to: reviewing
            action: Re-review
            describe: >-
              re-run the reviewer to author a fresh `.gtd/REVIEW.md`
              (**build.review.reviewing**).

      # Outcome is by which paths THIS diff touches: writing REQUIREMENTS.md
      # (A/M) is the actionable case, so those rows are declared before "D
      # REVIEW_RAW.md" — an actionable round's diff is both together, and
      # the wrong order would short-circuit every round to sign-off.
      # Consuming REVIEW_RAW.md alone is the non-actionable short-circuit,
      # reusing $onSignoff since that IS a sign-off. No `C`/`"* **"` row: a
      # clean turn here is a fruitless dispatch (falls through to the
      # ordinary attempt default), never a verdict; a dirty tree matching
      # neither row is a refusal.
      collecting:
        actor: agent
        label: Collecting your feedback
        file: REQUIREMENTS.md
        mode: qa
        prompt: |
          <%~ it.vars.styleBlock %>


          <%~ it.vars.styleFormatContract %>


          You are an autonomous coding agent judging and classifying a round
          of review feedback.

          <%~ it.vars.stateFileRules %>

          - The only state files this turn touches are
            `.gtd/REQUIREMENTS.md` and `.gtd/REVIEW_RAW.md`, which it
            deletes — do not change any other file: you classify, you do
            not build

          The raw review material is: <%~ it.read(".gtd/REVIEW_RAW.md") %>

          It names a commit. If you wrote today's review earlier in this
          conversation, work from what you already reviewed; otherwise read
          that commit's diff yourself before classifying anything.

          The round is actionable if any of the following is true:

          - The human left a note on `.gtd/REVIEW.md` — a note is anything
            beyond a checkbox flip, regardless of whether the box itself is
            ticked (ticking means only "I read this hunk", never sign-off).
            A note is a mandatory concern below, whether or not its box is
            ticked
          - The human added a code comment this round (a `+` line that is a
            comment, in a hand-edited file) — even a plain-prose one. That
            comment is an instruction: describe it as a concern below, and
            note that the comment line itself is transient — it must not
            survive the lap that satisfies it
          - The human hand-edited any non-comment code this round. That
            code is no longer an already-committed intent to build on top
            of — it is a sketch, like the entry commit's own diff: describe
            what it was reaching for under the concern it belongs to, and
            expect the lap that follows to re-derive it from scratch. Never
            say the human's lines are final or that they must survive
            unchanged

          The round is not actionable only when none of the above holds —
          the human left nothing but an approving remark (a compliment, a
          "looks good", or similar) with no code edit and no substantive
          note. Never invent actionability where the definition above
          doesn't hold — it manufactures a lap nothing asked for — and never
          dismiss a real note or edit as approval, which drops feedback the
          human left.

          - If actionable: write `.gtd/REQUIREMENTS.md` with an ordered
            list of concerns, each classified PRODUCT (a
            user-facing/requirements decision) or TECHNICAL (an
            implementation decision) — the same shape `design.triage`
            builds, one `## <heading>` per concern, in build order. Fold
            every note, comment, and hand-edit from this round in under
            the concern it belongs to, per the rules above. Raise no open
            questions here — write no `## Open Questions` section;
            `design.triage` owns that, one phase later. Then delete
            `.gtd/REVIEW_RAW.md` and finish your turn
          - If not actionable: delete `.gtd/REVIEW_RAW.md` and finish your
            turn, writing nothing to `.gtd/REQUIREMENTS.md` — consuming the
            capture with no other change is the sign-off
        on:
          "A .gtd/REQUIREMENTS.md": $onFeedback
          "M .gtd/REQUIREMENTS.md": $onFeedback
          "D .gtd/REVIEW_RAW.md": $onSignoff

  # The per-package review — a separate MIND from the implementer. ▸ planner
  # identity; fixing findings is a coder action (packages.item.fix-spec).
  specReview:
    model: <%= it.vars.plannerModel %>
    system: |-
      <%~ it.vars.specReviewerPersona %>


      <%~ it.vars.agentConduct %>
    params: [onApproved, onFix]
    entry: review
    states:
      review:
        actor: agent
        label: Reviewing the package
        # No retry cap: the loop only re-enters through
        # `fix-spec`/`health.check`, so under the per-episode rule this state's
        # episode count can never exceed 1 and a cap could never fire. The
        # spec-review loop is genuinely unbounded — see docs/configuration.md's
        # `retry` documentation.
        prompt: |
          <%~ it.vars.styleBlock %>


          You are an autonomous coding agent reviewing a freshly-built work
          package against its own spec.

          <%~ it.vars.stateFileRules %>

          - The only state file this turn touches is
            `.gtd/SPEC_FEEDBACK.md`; write it only when — and only when —
            you find problems. No other files for notes or output
          - The package spec is: <%~ it.read(".gtd/NEXT.md") %>
          - Read that spec, then verify the implementation against it: are
            all its tasks done, acceptance criteria met, and the code sound
            and consistent with the codebase? This prompt carries no diff —
            read it yourself: the range runs from `<%= it.startCommit %>`
            to the working tree, process-wide, so it can span earlier
            packages too
          - If it fully satisfies the spec, write nothing and finish your
            turn — write nothing when it is clean; silence is approval
          - If it does not, write `.gtd/SPEC_FEEDBACK.md` listing the
            concrete problems for a fix turn to address. Be specific
          - Do not fix anything yourself and do not delete the package
            file — a later step owns that. Finish your turn
        on:
          "A .gtd/SPEC_FEEDBACK.md": $onFix
          "M .gtd/SPEC_FEEDBACK.md": $onFix
          "D .gtd/SPEC_FEEDBACK.md": $onApproved
          "C": $onApproved

  # The per-package build queue — identity-free; build identity lives in
  # packageItem (below).
  packageLoop:
    params: [onDrained]
    entry: picking
    states:
      picking:
        actor: check
        label: Picking the next package
        script: |
          #!/usr/bin/env sh
          # Mechanics only — NEXT.md's presence/absence is interpreted by
          # the `on` rows below, never here.
          set +e
          mkdir -p .gtd
          # Sweep spent design/architecture steering files (gone by now) and
          # any REVIEW_RAW.md the review loop-back left behind — the only
          # sweeper on that path before it would leak into a later `gtd
          # summary` prompt's diff range.
          rm -f .gtd/REQUIREMENTS.md .gtd/ARCHITECTURE.md .gtd/QUESTIONS.md .gtd/REVIEW_RAW.md
          # Names are gtd-authored, never containing whitespace — safe to
          # disable SC2012.
          # shellcheck disable=SC2012
          next=$(ls .gtd/packages/*.md 2>/dev/null | head -n 1)
          if [ -n "$next" ]; then
            printf '%s' "$next" > .gtd/NEXT.md
          else
            rm -f .gtd/NEXT.md
          fi
        on:
          "D .gtd/NEXT.md": $onDrained
          "* .gtd/NEXT.md": item.building
          "C": $onDrained

      # Its own coder machine (below) keeps `packages` itself a single state.
      item:
        machine: packageItem
        with:
          onNext: picking

  # The per-package build identity. ▸ coder identity. packages.item.closing
  # -> picking is the one upward-resolving target in the file, hence $onNext.
  packageItem:
    model: <%= it.vars.coderModel %>
    system: |-
      <%~ it.vars.builderPersona %>


      <%~ it.vars.agentConduct %>
    params: [onNext]
    entry: building
    states:
      building:
        actor: agent
        label: Building
        prompt: |
          <%~ it.vars.stateFileRules %>

          - The only state file this turn may write is `.gtd/SATISFIED.md`
            (see below); do not delete the package file (the spec-review
            gate reads it after you) and never touch `.gtd/NEXT.md` — the
            `picking` state owns it
          - The package to implement is: <%~ it.read(".gtd/NEXT.md") %>
          - Before implementing anything, check the package's acceptance
            criteria against the current tree — an earlier package's fix
            turn may already have satisfied them. If **every** criterion is
            already met, implement nothing: write `.gtd/SATISFIED.md`
            recording each criterion and the concrete evidence it is
            already satisfied (the commit, file, or symbol that proves
            it), change nothing else, and finish your turn. If any
            criterion is outstanding, implement the package normally and
            do not write that file
          - That file describes a set of independent tasks. Implement all
            of them in this one turn, fanning the independent tasks out to
            parallel subagents where your harness supports it — each task
            is self-contained and can be built concurrently. Implement
            exactly the tasks this package describes — no more, no less;
            leave every other package file untouched. Use TDD discipline
            within each task
          - Leave the package file in place and everything else
            uncommitted, then finish your turn
        on:
          "A .gtd/SATISFIED.md": &satisfied
            to: health.check
            action: Close as already satisfied
            describe: >-
              record per-criterion evidence in .gtd/SATISFIED.md when this
              package's work already landed (an earlier package's fix turn
              pulled it in) — the package still runs the checks and the spec
              review, then closes out.
          "M .gtd/SATISFIED.md": *satisfied
          "* **": health.check

      fix-suite:
        actor: agent
        label: Fixing the check
        file: FEEDBACK.md
        prompt: |
          <%~ it.vars.stateFileRules %>

          <%~ it.vars.fixFeedbackPrompt %>

          - If the only way to green the suite is to implement work that
            another package file describes, make the smallest change that
            gets there and do it — that later package will then
            legitimately report itself already satisfied when its turn
            comes
          - Leave everything uncommitted and finish your turn — do not commit
        retry:
          max: 3
          otherwise: health.escalate
        on:
          "* **": health.check

      fix-spec:
        actor: agent
        label: Fixing review feedback
        file: SPEC_FEEDBACK.md
        prompt: |
          <%~ it.vars.stateFileRules %>

          - The only state file this turn touches is
            `.gtd/SPEC_FEEDBACK.md`; address it, then delete it — no other
            files for notes or output
          - Read `.gtd/SPEC_FEEDBACK.md` (the reviewer's concerns) and the
            package spec (`<%= it.read(".gtd/NEXT.md") %>`), then fix the
            code to resolve every concern. Keep the change focused
          - Delete `.gtd/SPEC_FEEDBACK.md` once every concern is
            addressed. Leave everything else uncommitted and finish your
            turn
        on:
          "* **": health.check

      closing:
        actor: check
        label: Closing out the package
        script: |
          #!/usr/bin/env sh
          # Removes the just-reviewed package file (path in NEXT.md) plus
          # leftover spec feedback/evidence, so picking selects the next.
          # Reached only on spec-review approval — that loop carries no retry
          # cap, so there is no force-close path here.
          set +e
          pkg=$(cat .gtd/NEXT.md 2>/dev/null)
          [ -n "$pkg" ] && rm -f "$pkg"
          rm -f .gtd/SPEC_FEEDBACK.md .gtd/NEXT.md .gtd/SATISFIED.md
        on:
          "* **": $onNext
          # Nothing left to sweep (an already-clean NEXT.md/package) still
          # needs to proceed to the next package, not stall here.
          "C": $onNext

      health:
        machine: healthGate
        with:
          onGreen: spec
          onRed: fix-suite
          escalateDescribe: >-
            edit the code and/or `.gtd/FEEDBACK.md` yourself
            (**packages.item.health.check**).
          checkLabel: Running checks
          escalateLabel: Escalating to a human

      spec:
        machine: specReview
        with:
          onApproved: closing
          onFix: fix-spec

  # The process's build identity. ▸ coder identity — model/system stamped
  # onto fix.
  buildTail:
    model: <%= it.vars.coderModel %>
    system: |-
      <%~ it.vars.finisherPersona %>


      <%~ it.vars.agentConduct %>
    params: [onDone, onFeedback]
    # entry: is required by the machine grammar even though nothing resolves
    # this machine bare; `fix` is an arbitrary pick.
    entry: fix
    states:
      fix:
        actor: agent
        label: Fixing the check
        file: FEEDBACK.md
        prompt: |
          <%~ it.vars.stateFileRules %>

          <%~ it.vars.fixFeedbackPrompt %>

          - Leave everything uncommitted and finish your turn — do not commit
        retry:
          max: 3
          otherwise: health.escalate
        on:
          "* **": health.check

      health:
        machine: healthGate
        with:
          onGreen: review
          onRed: fix
          escalateDescribe: >-
            edit the code and/or `.gtd/FEEDBACK.md` yourself
            (**build.health.check**).
          checkLabel: Running checks
          escalateLabel: Escalating to a human

      # Nested here (not root) so the sign-off's boundary commit stays inside
      # the builder's own scope — see humanReview above.
      review:
        machine: humanReview
        with:
          onSignoff: $onDone
          onFeedback: $onFeedback

  # WIRING ONLY — the root ties together the machine tree above.
  unified:
    entry: idle
    states:
      idle:
        actor: human
        label: Idle
        file: TODO.md
        message: |
          No active gtd process.

          To start one, make ANY change — a hand-edit to real code, a scratch
          note, anything at all. .gtd/TODO.md is a good default
          place to start sketching. gtd treats it as a SKETCH, not finished
          work: the very next beat unwinds it out of your working tree (its
          intent survives in history, for the triage phase to read), then
          checks the test baseline is green, then triages the reverted diff
          into ordered, classified concerns: product questions, then
          technical questions, then one package per concern, built and
          reviewed in parallel.

          What each change does next (then run `gtd land`):
          <% it.edges.forEach(function (e) { if (e.describe) { %>
          <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
          <% } }) %>
        on:
          "* **":
            to: unwind
            action: Start
            describe: >-
              make any change — gtd unwinds it out of your working tree (its
              intent survives in history) before checking the test baseline is
              green, then triages the reverted diff into ordered, classified
              concerns and resolves product questions, then technical ones,
              before building each concern's package (**unwind** ->
              **start-gate.check**).

      # --entry fix-precheck: a red suite drops into build.fix (-> health ->
      # review tail); a green suite is a no-op back to idle.
      fix-precheck:
        actor: check
        label: Checking the baseline
        entry: true
        script: *suiteCheck
        on:
          "A .gtd/FEEDBACK.md": build.fix
          "M .gtd/FEEDBACK.md": build.fix
          "D .gtd/REVIEW_RAW.md": idle
          "D .gtd/FEEDBACK.md": idle
          "C": idle

      # Separate from start-gate.check: that gate's blocked -> check retry
      # edge would otherwise re-run a revert here and discard a human's
      # baseline repair. One inbound edge (from idle) means unwind runs
      # exactly once, so it needs no idempotence guard itself.
      unwind:
        actor: check
        label: Unwinding your input
        script: |
          #!/usr/bin/env sh
          set +e
          mkdir -p .gtd
          # Hoisted here, at the TOP: Eta's autoTrim eats the newline after
          # an interpolation tag, so no tag may be the last token on a line.
          # Uses it.currentCommit (render-time), not bare HEAD, so a
          # late-running driver still reverts the right commit.
          commit="<%~ it.currentCommit %>"
          git revert --no-commit "$commit" 2> .gtd/.unwind-error
          code=$?
          # The revert's EXIT CODE is what separates a genuine no-op from a
          # hard failure (e.g. a merge commit with no `-m`) — the diff alone
          # cannot, since both can leave a clean tree. Turning the failure
          # into a FEEDBACK.md write is what makes the `C` row below safe:
          # once a failure always has a diff, a clean tree here means the
          # revert really did succeed and change nothing.
          if [ "$code" -ne 0 ]; then
            printf 'gtd could not unwind %s out of your working tree.\n\n' "$commit" > .gtd/FEEDBACK.md
            if [ -s .gtd/.unwind-error ]; then
              cat .gtd/.unwind-error >> .gtd/FEEDBACK.md
            else
              printf '`git revert --no-commit` exited %s and produced no output.\n' "$code" >> .gtd/FEEDBACK.md
            fi
          fi
          rm -f .gtd/.unwind-error
        on:
          "A .gtd/FEEDBACK.md": unwind-failed
          "M .gtd/FEEDBACK.md": unwind-failed
          "* **": start-gate
          "C": start-gate

      # Reached only when the revert above exited non-zero. A human repairs
      # the tree by hand; start-gate.check clears FEEDBACK.md on its way
      # green, so nothing has to sweep it here.
      unwind-failed:
        actor: human
        label: Could not unwind your input
        file: FEEDBACK.md
        message: |
          gtd could not revert your sketch out of the working tree.
          `.gtd/FEEDBACK.md` holds the error.

          Undo the sketch by hand (its intent survives in history either
          way), then continue — gtd will not start work on a tree that still
          carries it.

          What each change does next (then run `gtd land`):
          <% it.edges.forEach(function (e) { if (e.describe) { %>
          <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
          <% } }) %>
        on:
          "* **":
            to: start-gate
            action: Continue
            describe: >-
              having undone the sketch by hand, check the test baseline is
              green and start triage (**start-gate.check**).

      # Reverts the human's own review-round hand-edit before re-planning,
      # scoped to real code (`.gtd/` excluded — REVIEW.md is already gone by
      # now). Names the commit via it.reviewBase (reviewBaseFor's own
      # `await-review -> deciding` commit), never bare HEAD.
      #
      # requireRevert (below) re-checks the tree itself and refuses the step
      # if residue remains, rather than trusting the script's exit code — a
      # clean-filter round-trip or binary path can make `git apply -R` a
      # silent no-op. Both `on` rows below target `design`: a hand-edited
      # round leaves a dirty tree, a note-only round's patch is empty and
      # leaves the tree clean — both are legitimate outcomes here, not a
      # stall.
      #
      # `file: REVIEW.md` + `requireRevert: true` exist only to give that
      # guard the path to exempt (it reads Rest.hints.file, never this
      # literal) — REVIEW.md is already gone two commits earlier, so this
      # state never renders it.
      re-unwind:
        actor: check
        label: Re-unwinding your review edit
        file: REVIEW.md
        requireRevert: true
        script: |
          #!/usr/bin/env sh
          # Scoped revert of the human's review-round edit — .gtd/ excluded
          # (the guard's isCodePath re-derives the same exemption; keep both
          # in sync). Expected to succeed; requireRevert catches a silent
          # apply failure.
          set +e
          # Hoisted here, at the TOP: Eta's autoTrim eats the newline after
          # an interpolation tag, so no tag may be the last token on a line.
          commit="<%~ it.reviewBase %>"
          patch=.gtd/.re-unwind.patch
          mkdir -p .gtd
          git diff --binary "$commit^" "$commit" -- . ":(exclude).gtd" > "$patch"
          if [ -s "$patch" ]; then
            git apply -R "$patch" || echo "re-unwind: could not revert $commit" >&2
          fi
          rm -f "$patch"
        on:
          "* **": design # a code hand-edit was reverted
          "C": design # note-only round: nothing to revert

      start-gate:
        machine: entryGate
        with:
          onGreen: design
          reviewBase: ""
          blockedMessage: |
            The test baseline is red — gtd will not start new work on a broken suite.
            `.gtd/FEEDBACK.md` holds the failing output.

            What each change does next (then run `gtd land`):
            <% it.edges.forEach(function (e) { if (e.describe) { %>
            <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
            <% } }) %>
          blockedDescribe: >-
            edit the code and/or `.gtd/FEEDBACK.md` to fix the failing tests
            (**start-gate.check**). To repair the baseline as its own separate
            reviewed commit instead, abandon this start and run
            `gtd --entry fix-precheck` from a clean `idle`.
          checkLabel: Checking the baseline
          blockedLabel: Baseline is red

      review-gate:
        machine: entryGate
        with:
          onGreen: build.review
          reviewBase: <%= it.vars.reviewBase %>
          blockedMessage: |
            The test baseline is red — gtd will not start a review on a broken suite.
            `.gtd/FEEDBACK.md` holds the failing output.

            What each change does next (then run `gtd land`):
            <% it.edges.forEach(function (e) { if (e.describe) { %>
            <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
            <% } }) %>
          blockedDescribe: >-
            edit the code and/or `.gtd/FEEDBACK.md` to fix the failing tests
            (**review-gate.check**).
          checkLabel: Checking the baseline
          blockedLabel: Baseline is red

      design:
        machine: designPlan
        with:
          onArchitecture: architecture

      architecture:
        machine: archPlan
        with:
          onPackages: packages

      packages:
        machine: packageLoop
        with:
          onDrained: build.review

      build:
        machine: buildTail
        with:
          onDone: idle
          onFeedback: re-unwind
