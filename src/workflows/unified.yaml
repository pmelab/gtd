# gtd's BUILT-IN DEFAULT workflow — used when no `workflow:` key is
# configured anywhere in the cwd→home config chain; `gtd init` seeds only
# vars.testCommand + a modes: suggestion, never this file. Compiled through
# the same `compileWorkflowConfig` a user's own `workflow:` goes through — no
# privileged path. See skills/authoring/SKILL.md for how to read or edit it
# (machines, patterns, templates) and docs/driver.md for how a driver runs it.
#
# One flow: any change to the tree starts the process. `idle` -> `unwind`
# reverts that diff (intent survives only in history) -> a green-baseline
# gate -> `design.triage` groups the reverted diff into ordered, classified
# concerns and resolves the PRODUCT ones' open questions (`design.gate`) ->
# `architecture.author` works out the *how* and resolves the TECHNICAL ones
# (`architecture.gate`) -> `architecture.decompose` writes one package file
# per concern -> the per-package queue (`packages.*`) builds and reviews each
# -> the shared tail (`build.review.*`) decides sign-off (-> `idle`, landing
# an ordinary commit that closes the process — every per-turn commit stays on
# the branch; run `gtd summary` afterward for a closing-message prompt) vs.
# actionable feedback (-> `re-unwind` -> back to `design.triage`, a full
# re-plan lap that never builds on the human's hand-edit). `--entry
# review-gate.check --var reviewBase=<commitish>` and `--entry fix-precheck`
# are the two other entries into this same flow.
vars:
  testCommand: npm test
  # plannerModel: the heavier tier for one-shot triage/design/review turns.
  # coderModel: the tier for build/fix turns. Both repointable via a
  # top-level `vars:` key or a `GTD_<NAME>` env var, like any other var.
  plannerModel: smart
  coderModel: base
  # Declared (not left undeclared) so `--var reviewBase=...` passes the CLI's
  # declared-name check; blank renders empty, which the review entry refuses.
  reviewBase: ""
  # The total byte budget a `judge:` field's `it.tail`/`it.diffTail`/
  # `it.sections(path, share)` divide (by `share`) across the evidence they
  # inline into ONE rendered `judge:` document — not a per-document cap.
  # 32 KiB is about 8k tokens of raw text, so even at the ~2x `JSON.stringify`
  # escaping inflation the rendered state stays near 16k tokens, roughly a
  # fifth of the 166,322 raw bytes a real over-budget judge payload was
  # rejected for. UNLIKE every other var here, this one THROWS rather than
  # disabling its mechanism when blanked/non-numeric — see "Variables" below.
  judgeBudgetBytes: "32768"
  # `healthGate.judge`'s probability floor for the "identical" verdict to end
  # a retry loop early — the ONLY off-switch this judged gate has (see
  # 01-judgment-surface.md's Requirement section): a repo retunes or disables
  # it by repointing this var, never by editing the bundled routes: row.
  judgeIdenticalMinP: "0.7"
  # `specReview.pre`'s per-section noul: a section answered "yes" needs at
  # least this confidence to skip `review` for it; "no", or "yes" under this
  # floor, both scope the review to that section instead. UNMEASURED: no
  # mined history of "requirement already satisfied?" judgments exists to
  # derive it from, and no arithmetic on another threshold can stand in for
  # one — a round of review caught an earlier version deriving this from a
  # value measured for a different question entirely. Chosen conservatively
  # high instead: the pre-judge should rarely fire until real pre-judge
  # history exists to mine a measured value from. Every judged-gate
  # threshold in this file is now an unmeasured conservative default on the
  # same footing.
  specPreJudge: "0.9"
  # `humanReview.triage`'s per-chunk noul over `.gtd/REVIEW.md`'s own
  # chunks: "actionable, not approval or nit?" A chunk answered "yes" below
  # this floor is treated as non-actionable (folded into sign-off) rather
  # than spent on a `collecting` turn — a chunk answered "no" is
  # non-actionable regardless of this floor. Blanking it disables the
  # dismissal (every "yes" counts, at any confidence) — the same
  # blank-turns-this-judged-gate-off convention `judgeIdenticalMinP` and
  # `specPreJudge` follow, kept in the SAFE direction here (never silently
  # sign off). This gate weighs chunks the HUMAN wrote, evidence no agent in
  # the loop produced — which is why it stays where a post-judge over an
  # agent's own freshly-authored output does not. Unmeasured — chosen
  # conservatively until real `triage` history exists to mine a value from.
  reviewNoteActionable: "0.7"
  # `architecture-pre`'s single noul (`architectureWarranted`, over the
  # just-triaged `.gtd/REQUIREMENTS.md`): an answer of "no" needs at least
  # this confidence to skip `architecture.author`/`architecture.decompose`
  # entirely; any other outcome (including a skipped judgment) runs the full
  # pass — the conservative default. Unmeasured — chosen conservatively
  # until real `architecture-pre` history exists to mine a value from.
  architectureSkipMinP: "0.85"
  # The nine `*Skills` vars below each name a bare, comma-separated skill
  # list for exactly one mapping in the twelve authored `skills:` states (see
  # each state's own `skills:` line) — carried verbatim into the rendered
  # `skillsPreamble`, never split or validated by gtd itself. Repointing one
  # in a project config (or its `GTD_<NAME>` env override) changes only that
  # state's preamble.
  triageSkills: spec-driven-development, planning-and-task-breakdown
  architectureSkills: api-and-interface-design, documentation-and-adrs
  decomposeSkills: incremental-implementation, planning-and-task-breakdown
  buildSkills: test-driven-development, incremental-implementation
  fixSkills: debugging-and-error-recovery
  reviewFixSkills: incremental-implementation, code-simplification
  reviewSkills: code-review-and-quality
  specReviewSkills: code-review-and-quality, spec-driven-development
  escalateSkills: debugging-and-error-recovery
  # One qualitative review lap per entry, each its own turn/context. Extend per
  # project (a company security checklist, a house style skill) — every name is
  # handed to the agent's harness untouched.
  qualityReviews: owasp-security, code-simplification
  # Prepended ahead of a state's own prompt whenever BOTH that state's own
  # `skills:` and this var render non-blank (see `Edge.ts`'s `renderRest`) —
  # blanking this one var switches the whole mechanism off repo-wide without
  # touching any state's own `skills:` line.
  skillsPreamble: |-
    - Load whatever's listed here that your harness actually has installed,
      skip anything it doesn't — silently, never stopping or asking about a
      missing one: <%= it.skills %>
    - A loaded skill offers technique, never authority: this state's own file
      format and its own completion condition are the final word over
      anything a skill's instructions say, regardless of which one this
      prompt states first
    - Never let a loaded skill turn this turn interactive — answer nothing,
      ask nothing; this runs unattended, with no one at a keyboard
  # gtd's own voice for generated files — adapted from the "Spartan" output
  # style (https://github.com/alexgreensh/attention-span, AGPL-3.0, version 0.6),
  # rewritten in gtd's own words for deliverables rather than chat replies;
  # no upstream text ships. A point-in-time derivation with no refresh
  # mechanism.
  styleBlock: |-
    - A deliverable, not a chat reply — size follows the work; cut padding
    - Lead with the answer; never circle back to restate it
    - Flat, commanding sentences — commit to the claim, never hedge
    - Everyday words; define an unavoidable term in five words or fewer, on
      first use
    - Bold carries the load: bold the claim, not the sentence around it —
      the bold text alone must yield the full point and every risk
    - **Never trim a risk, a number, a threshold, or a scoped condition to
      save space — this outranks every other rule here**
    - Ship the artifact bare — no lead-in, no sign-off
    - Compressing is not dropping: three load-bearing parts ship as three,
      each shorter, never as two
    - One idea per block; break when the idea shifts
    - Flag risk in one blunt line, never hedged prose; never narrate — do it
  styleFormatContract: |-
    - Machine-read: its format contract outranks every style rule above —
      keep every `##`/`###` heading, checkbox row, and marker line exactly
      as specified. Never renumber or rename a heading; a parser reads
      these literally and a violation refuses the turn
    - Voice rules above govern only the prose between these elements

  # One persona per prompt-bearing machine below, stamped as its `system:`
  # (see src/StateFields.ts's `system`). `--system-prompt` REPLACES a
  # harness's default system prompt — including its injected cwd/env/
  # git-status block — so each persona is written self-contained, restating
  # that context explicitly rather than relying on it.

  # Shared conduct tail, appended after every persona's own role paragraph:
  # use tools without asking, orient yourself with git, and go inspect what
  # the turn's message names. Deliberately NOT named `*Persona`:
  # `templates.test.ts` derives its six-name persona set from
  # `it\.vars\.(\w+Persona)`, so that suffix would silently grow the set.
  agentConduct: |-
    - You have shell and file tools — bash, read, write, edit — use them
      without asking first; this runs unattended, no one grants permission
    - Investigate with real commands rather than assuming a file's, a
      commit's, or a decision's status — then act on what you find
    - No injected status block — no cwd, no branch, no history, no tree
      state — orient yourself first with `git status`, `git log`, `ls`
    - The turn's message names a commit, a range, or a file to go inspect
      yourself — never a diff or summary inlined into the conversation
    - Across turns one conversation may span, work from what you already
      read and settled, unless told this is a fresh, cold pass
  designPersona: |-
    You are the product-facing planning voice in gtd's build pipeline: turn
    a raw sketch — a hand-edit, a scratch note, or both — into an ordered,
    classified list of concerns, and hold the running product conversation
    with the human it depends on. You are read by that human — write
    plainly — not by a parser, except where a state says otherwise.
  architectPersona: |-
    You are the technical planning voice in gtd's build pipeline: take over
    once product concerns are settled, reading them cold, no carried
    conversation. Work out the *how* per concern — structure, data models,
    tech-stack choices, error handling — raise the technical open
    questions, then write one package spec per concern with no further
    judgement call: the grouping is already decided.
  reviewerPersona: |-
    You are the independent reviewing mind in gtd's build pipeline —
    deliberately separate from whoever wrote the code, with no attachment
    to it. Two turns: write a structured review document grouping a diff
    into chunks; later, classify a round of the human's feedback as
    actionable or just approving, never fixing anything yourself. You judge
    and classify; you never build.
  specReviewerPersona: |-
    You are the adversarial spec-conformance checker in gtd's build
    pipeline, checking one freshly-built package against its spec. Verify
    only: tasks done, criteria met, code sound and consistent with the
    codebase. Write feedback only when something is genuinely wrong —
    otherwise write nothing; a clean turn IS the approval. Never fix what
    you find — naming it precisely enough for a fix turn is the whole job.
  builderPersona: |-
    You are the TDD implementer in gtd's build pipeline: build one
    package's declared scope end to end, tests first, and come back to fix
    things when redirected — a failing check, or reviewer feedback. Stay
    strictly inside the package in front of you; never touch another
    package's files or code outside the task. Treat feedback as the
    diagnosis to act on; discard it, with reason, only when simply wrong.
  finisherPersona: |-
    You are the closing identity in gtd's build pipeline — the last coder
    before it closes. Fix a late-breaking failing check after sign-off,
    focused and minimal. Every turn lands its own commit — nothing here
    gets squashed away.
  escalationPersona: |-
    You are the diagnosing voice in gtd's build pipeline, called in once a
    check has stayed red past repeated fix attempts. Read the failing
    output, the previous round's, and the code those attempts touched, then
    write down what is failing, why the earlier attempts didn't resolve it,
    and concrete approaches worth trying next. Never fix the code yourself —
    naming the problem precisely enough for the next fix turn is the whole
    job.

  # The scratchpad-opener sentence shared by every prompt-content state (see
  # STATE_FIELDS's `prompt`) — this workflow's own state files are its private
  # working notes, never project code or documentation a human reads. Injected
  # as the leading line of every prompt body that touches a `.gtd/` file
  # directly; each state's own "the only state file this turn touches is X"
  # sentence stays local, immediately after the tag. Some states splice a
  # role clause into this same opening sentence (`build.review.collecting`,
  # `packages.item.spec.review`) — those hoist the clause to its own leading
  # sentence ahead of the tag instead, keeping every word.
  stateFileRules: |-
    - You are an autonomous coding agent
    - This workflow's own state files are its private scratchpad, never
      project code or documentation
  # The open-questions warrant test, decide-it-yourself sink, and `## Open
  # Questions` checkbox shape shared by `design.triage` and
  # `architecture.author` — written phase-agnostic (no PRODUCT/TECHNICAL
  # bake-in) so both sites can inject it verbatim. Each site's own
  # phase-scope sentence (triage: product-only, technical waits; architecture:
  # every point here is TECHNICAL) stays local around the tag — the two
  # genuinely disagree on scope, so that sentence is never shared.
  # `questionBarReturn` is the return-lap half — split out so each site can
  # inject it under its own `## Return lap` heading instead of burying
  # return-lap behaviour inside the first lap's own section.
  questionBar: |-
    - The goal is shared understanding, not a quota or an empty section: a
      question exists to close a gap between what the human wants and
      what the agent is about to build. Ask whenever that gap is open —
      even when the point looks cheap to undo, settled-looking, or
      narrow. This goal outranks what follows; the conditions below are
      signals a gap is real, strong evidence to ask, never permission
      withheld
    - Before writing `## Open Questions`, walk every concern you grouped and
      collect every point above the bar into that ONE section — a question
      held back for a later lap is a bug. One lap is the target; a second is
      the exception
    - Raise first, narrow second: only once every concern above the bar is
      raised into `## Open Questions`, walk that same set once more and
      answer the ones a confident default settles, moving each into
      `## Answered Questions` with its answer. This pass narrows what's
      already raised — it is never license to raise less, and skipping the
      raise to answer straight through is the same bug as holding a
      question back for a later lap
    - Treat each of these as strong evidence a gap is real: it's a genuine
      fork with divergent outcomes (user-visible for product, materially
      different builds for technical); the diff and history don't already
      settle it (treat an explicit `.gtd/TODO.md` directive, a committed
      hand-edit, or — on a loop-back lap — the human's own review-round
      edit/note as settled); or it would be expensive to undo once
      packages are written
    - Where no gap in shared understanding exists, decide it yourself:
      record it under `## Answered Questions` as
      `### <the point phrased as a question>`
      plus a one-line rationale in prose, no checkboxes. That heading
      always comes last, after every other `##` section
    - Above the bar, write it under `## Open Questions` — always the first
      `##` section — as `### <question>` plus a checkbox list: two
      concrete options and a free-text slot, all unticked:

          ### <the question>

          - [ ] <first option — a concrete answer, a few words of rationale>
          - [ ] <second option>
          - [ ] _your answer_

    - Never tick a box yourself — the human ticks exactly one per question
  questionBarReturn: |-
    - This lap continues the same goal as the first: close the gap
      between what the human wants and what gets built. Folding in
      answers and deciding what's left is that same goal continued, not
      a different job
    - The human answered — a ticked box, a free-text answer in place of
      `_your answer_`, a deleted question, or a deleted `## Open Questions`
      section are all answers. Fold each resolved answer into its concern's
      prose, then move the question into `## Answered Questions` as
      `### <question>` with the resolved answer in plain prose — no
      checkboxes
    - `## Answered Questions` is always the last `##` section — a moved
      question lands there, never wherever `## Open Questions` used to sit
    - Never re-raise a deleted question, and never re-open a settled
      `## Answered Questions` entry
    - An answer may earn a follow-up: if it opens a genuinely new fork above
      the bar — one the answer itself created — raise it as a fresh `##
      Open Questions` entry on this same lap. Never restate a question
      already asked, and never treat this as licence to re-open a question
      already settled under `## Answered Questions`
    - Recognise a silent lap from `## Open Questions` still present with
      nothing ticked and nothing else changed — the human's way of saying
      the gap is already closed. That lap ends the questions, whatever the
      goal says: decide every remaining question yourself, move each to
      `## Answered Questions` with a one-line rationale, raise nothing new,
      and leave no `## Open Questions` section behind
  # The body `packages.item.fix-suite` and `build.fix` share byte for byte —
  # both fix a red `.gtd/FEEDBACK.md`. `fix-suite` appends its own
  # cross-package paragraph right after this tag (before the shared
  # "Leave everything uncommitted" close, which stays local at both sites so
  # the appended paragraph lands in the same position it renders in today);
  # `build.fix` renders the tag alone.
  fixFeedbackPrompt: |-
    - The only state file this turn writes is `.gtd/FEEDBACK.md` — no other
      files for notes or output
    - Read `.gtd/FEEDBACK.md` (the failing test output) and fix the code so
      the suite passes
    - When `.gtd/ESCALATION.md` is present, it is a human-reviewed analysis
      of why earlier attempts failed — read it and treat it as the primary
      instruction for this turn. Never edit or delete it yourself, even once
      you believe you've resolved it: only a genuinely green check retires
      it, so an attempt that turns out to be wrong still leaves the next
      turn's instruction in place. Its absence is the ordinary case: an
      unremarkable red round with nothing to escalate yet
    - Delete `.gtd/FEEDBACK.md` either way — once the suite passes, or once
      you have established the feedback was wrong; leaving it in place is
      never the right end state, the next check writes its own

  # The human-facing half of footnotes — how to type one, injected into the
  # three human-gate messages (`design.gate.answer`, `architecture.gate.answer`,
  # `build.review.await-review`). `footnoteFoldIn` below is the agent-facing
  # half; the two never share text, different audience and content.
  footnoteRules: |-
    - Leave a footnote anywhere: mark the exact spot with `[^name]` (any
      name, no whitespace or `]`), then define it below as `[^name]:
      explain what you mean` — indent a longer comment's continuation
      lines. (The literal words "your comment" are this format's seeded
      placeholder body — a definition still holding them exactly is
      flagged as unfilled, so write your own words there)
    - A footnote is a comment on that exact spot — the hunk, line, or
      paragraph it marks — never a whole-file remark
    - `name` is yours to pick; only a definition's name must be unique in
      this document — the same name may mark more than one spot
  # The agent-facing half — injected into the three prompts that fold a
  # footnote in (`design.triage`, `architecture.author`,
  # `build.review.collecting`). `build.review.reviewing`, the one state that
  # WRITES a review file, references neither tag — the agent never authors a
  # footnote.
  footnoteFoldIn: |-
    - A footnote (`[^name]` plus its `[^name]:` definition) is a comment on
      its exact anchor — fold it in as a mandatory concern described
      against that anchor's hunk or paragraph, never flattened into a
      whole-file remark
    - DELETE it in this same turn — marker and definition together — the
      way a transient hand-written code comment is already treated. Never
      re-read a footnote already acted on
    - A footnote is human input only — you reply in prose; never write one
      yourself

# `gtd summary`'s prompt — printed cold, no session identity, no diff inlined.
# Names the hashes/range for the agent to inspect itself; renders the same
# it.processCost/it.processCostByModel the old squash finale used to.
summary: |
  <%~ it.vars.styleBlock %>


  - Write the closing message for the process HEAD closes or sits inside —
    for a squash, an amend, or a PR body. Starting cold: read every
    decision out of the commits below, not assumed context
  - Cover the motivation, the decisions, the trade-offs, and the
    high-level architectural changes — never which files changed; `git
    diff --stat` is for that, not this message
  - If the range removes or renames a documented config key, CLI flag, or
    workflow state — a public surface, not an internal one — add a literal
    `BREAKING CHANGE:` footer naming what disappears. A `!` on the type
    prefix alone (`feat!:`/`refactor!:`) is NOT enough: this repo's own
    commit-analyzer has missed that marker before, cutting no release
    until a follow-up commit carried the literal footer instead

  The process's entry commit is `<%= it.entryCommit %>`. <% if
  (it.humanCommits.length > 0) { %>The human contributed at these commits,
  oldest to newest:
  <% it.humanCommits.forEach(function (c) { %>
  - `<%= c.hash %>` (entering `<%= c.state %>`)
  <% }) %><% } else { %>The human left no comment or edit this process —
  every commit is machine-authored.<% } %>

  Inspect the range: `git log <%= it.processBase %>..<%= it.processTip %>`
  and `git diff <%= it.processBase %> <%= it.processTip %>` — exactly what
  a squash or PR body should describe.

  Token cost: <%= it.processCost %>
  <% it.processCostByModel.forEach(function(m){ %>
  - <%= m.model %>: <%= m.cost %>
  <% }) %>

  Print the closing message and stop — this writes nothing itself.

entry:
  default: unified

machines:
  # Shared green-baseline gate — start-gate/review-gate/fix-precheck all
  # alias this script via &suiteCheck.
  entryGate:
    params: [onGreen, blockedMessage, blockedDescribe, checkLabel, blockedLabel, reviewBase]
    entry: check
    states:
      check:
        actor: check
        label: $checkLabel
        # `&suiteCheck` below (the output-capture / empty-output-fallback /
        # HEAD-stamp body, from `<%~ it.vars.testCommand %>` through the
        # trailing if/else) is DUPLICATED — not aliased — into
        # `healthGate.check` further down this file: a YAML alias reuses a
        # whole scalar node, and `healthGate.check`'s script needs its own
        # PRIOR_FEEDBACK.md prologue TEXTUALLY BEFORE that shared body inside
        # the SAME Eta-templated string, which plain YAML has no mechanism to
        # express (no string-concatenation-of-aliases, and the shared body
        # itself still needs live `<%~ it.vars.testCommand %>` interpolation,
        # so pulling it into a `vars:` entry would freeze that reference as
        # dead text instead of evaluating it). A change to this body — the
        # capture/fallback/stamp logic — MUST be mirrored into
        # `healthGate.check`'s copy by hand; neither test suite nor YAML
        # tooling catches a drift between them.
        script: &suiteCheck |
          #!/usr/bin/env sh
          set +e
          mkdir -p .gtd
          # Sweep a raw review capture an earlier, abandoned process may have
          # left behind — no ordinary path from deciding/collecting reaches
          # this check.
          rm -f .gtd/REVIEW_RAW.md
          <%~ it.vars.testCommand %> > .gtd/.check-output 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            if [ -s .gtd/.check-output ]; then
              mv .gtd/.check-output .gtd/FEEDBACK.md
            else
              rm -f .gtd/.check-output
              printf 'the test command failed with exit code %s and produced no output.' "$code" > .gtd/FEEDBACK.md
            fi
            # Stamp with HEAD so a repeat identical failure still re-registers
            # as an M/A edit instead of looking byte-identical (GREEN).
            printf '\n<!-- gtd check %s -->\n' "$(git rev-parse --short HEAD 2>/dev/null || echo pending)" >> .gtd/FEEDBACK.md
          else
            rm -f .gtd/.check-output
            rm -f .gtd/FEEDBACK.md
          fi
        # Marks BOTH entryGate instances (start-gate/review-gate); only
        # review-gate strictly needs it, but the shared dedup makes marking
        # one mark both — both ARE entry gates.
        entry: true
        # Only review-gate binds a real reviewBase (via --var); start-gate
        # binds "" (no base), since it's reached from idle, never entered.
        reviewBase: $reviewBase
        on:
          "A .gtd/FEEDBACK.md": blocked
          "M .gtd/FEEDBACK.md": blocked
          "D .gtd/REVIEW_RAW.md": $onGreen
          "D .gtd/FEEDBACK.md": $onGreen
          "C": $onGreen
      blocked:
        actor: human
        label: $blockedLabel
        file: FEEDBACK.md
        message: $blockedMessage
        on:
          "* **":
            to: check
            action: Retry check
            describe: $blockedDescribe

  # Shared check/judge/escalate trio for build.health.*/packages.item.health.*
  # — the caller's own coder fix-state ($onRed), not this machine, handles
  # red. `check` writes `.gtd/PRIOR_FEEDBACK.md` from the last COMMITTED red
  # round (found by walking history, not HEAD — the intervening fix turn
  # always deletes `.gtd/FEEDBACK.md` from HEAD once it believes it resolved
  # the failure) only when one exists, so the FIRST red round of an episode
  # (nothing to compare against yet) bypasses `judge` straight to `$onRed`,
  # paying for no judgment. `retry:` stays on `$onRed` (see
  # `packageItem`/`buildTail` below) rather than moving onto `judge` here:
  # `judge`'s only direct structural source is `check`, but `fix`/`fix-suite`
  # sits between every pair of `judge` visits and is NOT one of `judge`'s
  # sources, so `episodeVisits` (`PatternMachine.ts`) would reset `judge`'s
  # own count on every single pass and a cap declared here could never fire.
  # `$onRed` has TWO direct sources instead (`check`'s own bypass row, and
  # `judge`'s `routes:` catch-all below) — sound accumulation under
  # `sourcesOf`'s single-hop rule, the same shape the bundled retry-workflow
  # tests already pin.
  healthGate:
    model: <%= it.vars.coderModel %>
    system: |-
      <%~ it.vars.escalationPersona %>


      <%~ it.vars.agentConduct %>
    params: [onGreen, onRed, checkLabel, escalateLabel]
    entry: check
    states:
      check:
        actor: check
        label: $checkLabel
        # DUPLICATES (not aliases) `entryGate.check`'s `&suiteCheck` body from
        # `<%~ it.vars.testCommand %>` through the trailing if/else — see the
        # comment on that anchor for why plain YAML/Eta can't express "this
        # state's own PRIOR_FEEDBACK.md prologue, THEN the shared body" any
        # other way. Mirror a change to that shared portion here by hand.
        script: |
          #!/usr/bin/env sh
          set +e
          mkdir -p .gtd
          rm -f .gtd/PRIOR_FEEDBACK.md
          # Sweep a raw review capture an earlier, abandoned process may have
          # left behind — no ordinary path from deciding/collecting reaches
          # this check (same as entryGate.check's own sweep).
          rm -f .gtd/REVIEW_RAW.md
          # Bound the PRIOR_FEEDBACK.md search to the CURRENT episode, not the
          # whole process (`it.startCommit`): HEAD's own subject already reads
          # "... → <%= it.state %>" (the commit that just entered this check —
          # `PatternMachine.ts`'s `stateSubject`/`TRANSITION_SEP`), so the
          # SECOND most recent such subject is the last time this exact check
          # was entered before now. Reaching THIS check always requires
          # passing through it (green or red), so that prior entry is never
          # itself carrying an unrelated gate's FEEDBACK.md the way
          # `it.startCommit` (spanning the whole process, every earlier gate
          # included) could. No second match at all means this is the very
          # first visit ever — nothing to bound against, so there is no prior
          # round full stop (never falls back to `it.startCommit`, which would
          # reintroduce exactly the cross-episode leak this bounds against).
          episode_anchor=$(git log --format='%H %s' <%= it.startCommit %>..HEAD \
            | grep -F -- ' → <%= it.state %>' | sed -n '2p' | cut -d' ' -f1)
          if [ -n "$episode_anchor" ]; then
            prior_commit=$(git log --format=%H --diff-filter=AM "$episode_anchor"..HEAD -- .gtd/FEEDBACK.md 2>/dev/null | head -n 1)
            if [ -n "$prior_commit" ]; then
              git show "$prior_commit":.gtd/FEEDBACK.md > .gtd/PRIOR_FEEDBACK.md 2>/dev/null
            fi
          fi
          <%~ it.vars.testCommand %> > .gtd/.check-output 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            if [ -s .gtd/.check-output ]; then
              mv .gtd/.check-output .gtd/FEEDBACK.md
            else
              rm -f .gtd/.check-output
              printf 'the test command failed with exit code %s and produced no output.' "$code" > .gtd/FEEDBACK.md
            fi
            # Stamp with HEAD so a repeat identical failure still re-registers
            # as an M/A edit instead of looking byte-identical (GREEN).
            printf '\n<!-- gtd check %s -->\n' "$(git rev-parse --short HEAD 2>/dev/null || echo pending)" >> .gtd/FEEDBACK.md
          else
            rm -f .gtd/.check-output
            rm -f .gtd/FEEDBACK.md
            rm -f .gtd/PRIOR_FEEDBACK.md
            # `.gtd/ESCALATION.md` is swept ONLY here, on a genuinely green
            # result — never on a still-red round, so an unresolved analysis
            # a fix turn left in place (fixFeedbackPrompt never deletes it)
            # survives every retry within the same episode. That also makes
            # its deletion a reliable "this episode's escalation budget just
            # reset" signal: `escalate`'s own script (below) anchors its
            # round count on the most recent such deletion.
            rm -f .gtd/ESCALATION.md
          fi
        on:
          "A .gtd/PRIOR_FEEDBACK.md": judge
          "M .gtd/PRIOR_FEEDBACK.md": judge
          "A .gtd/FEEDBACK.md": $onRed
          "M .gtd/FEEDBACK.md": $onRed
          "* **": $onGreen
          "C": $onGreen
      # The judged retry: a `choice` between identical/new-failure/progress
      # over `.gtd/FEEDBACK.md` (this round) vs `.gtd/PRIOR_FEEDBACK.md` (the
      # previous round), both committed by `check` above so `it.read` can
      # reach them (the evidence rule — no gathering turn). An unaware driver
      # sees only `message:` and lands with a clean tree, taking the ordinary
      # `C` row to `$onRed` — the same conservative target `routes:`'s own
      # catch-all names, so a skipped judgment and a "keep fixing" verdict
      # both land the same place; only the `Gtd-Judge:` trailer (or its
      # absence) tells them apart.
      judge:
        actor: judge
        label: Judging the retry
        message: |
          The check is still red, and this isn't the first round —
          `.gtd/FEEDBACK.md` (this round) and `.gtd/PRIOR_FEEDBACK.md` (the
          previous round) are both on disk. Run `gtd judge answer` and pipe a
          verdict — identical, new-failure, or progress — or land (with or
          without an edit of your own) to accept the conservative default
          (retry the fix) with no verdict recorded.
        # A textual diff of `current`/`previous` is NOT a valid reduction —
        # measured, not reasoned: diffing the two documents from the
        # observed 84,761/81,561-byte failure produced 295 changed lines,
        # almost entirely REORDERING (the runner interleaves parallel task
        # output nondeterministically), so two byte-identical failure sets
        # produce a large diff — suppressing the one verdict this gate
        # exists to find (`identical`). A diff may SUPPLEMENT bounded
        # content; it never replaces it. Filtering to failure lines was
        # also measured and rejected: a grep for error/failed/FAIL cut
        # 166,322 bytes to about ten lines each and the verdict fell
        # straight out, but `testCommand` is arbitrary and a filter tuned
        # to one runner's vocabulary drops everything on another — which
        # reads as `identical`, the escalating direction.
        judge: |-
          <%
            // The trailing `<!-- gtd check <sha> -->` stamp always differs
            // and must sit outside the compared region — `it.tail` takes
            // the END of the document, exactly where the stamp is, so it
            // is stripped here rather than left to the criteria alone.
            const stripStamp = (text) => text.replace(/\n<!-- gtd check [0-9a-f]+ -->\n?$/, "\n")
            const current = stripStamp(it.tail(".gtd/FEEDBACK.md", 0.5))
            const previous = stripStamp(it.tail(".gtd/PRIOR_FEEDBACK.md", 0.5))
            // This bound (`it.tail`) can manufacture a false "identical": a
            // single unbroken trailing line (no newline in the last cut
            // bytes) renders as "" for either or both documents, and two
            // genuinely different files can render the SAME cut tail while
            // differing earlier. Both shapes are computed from the
            // UNBOUNDED reads (free at the payload — never inlined) rather
            // than trusted from the cut text alone.
            const currentWhole = it.read(".gtd/FEEDBACK.md")
            const previousWhole = it.read(".gtd/PRIOR_FEEDBACK.md")
            // The length comparison this replaced was a proxy for content: two
            // reports of EQUAL byte length can still differ before the cut and
            // match only after it — `stripStamp` on BOTH whole reads is
            // load-bearing, not tidiness, since the trailing stamp always
            // differs and would otherwise force every round "not comparable".
            const notComparable =
              current === "" ||
              previous === "" ||
              (current === previous && stripStamp(currentWhole) !== stripStamp(previousWhole))
            const state = notComparable ? { tailsNotComparable: true } : { current, previous }
            // `instructions` must switch alongside `criteria`: the guarded
            // branch's `state` carries no `current`/`previous` at all, so
            // telling the model to compare fields the payload does not
            // contain would push it toward reading their mutual absence as
            // sameness — exactly the `identical` verdict this guard exists
            // to forbid.
            const instructions = notComparable
              ? "state carries tailsNotComparable: the two bounded tails came back unusable as evidence (see criteria). There is nothing to compare here; answer from criteria alone."
              : "Compare this round's failing check output (current) against the previous round's (previous), both in state. Classify the change."
            const criteria = notComparable
              ? "state carries tailsNotComparable instead of current/previous: the two bounded tails are not usable evidence (one came back empty, or both matched only because the cut tails agree while the two full reports actually differ). identical is FORBIDDEN here — answer new-failure or progress instead, defaulting to progress if genuinely unsure."
              : "identical: the same failure restated, byte-for-byte or the same root cause — the trailing `<!-- gtd check <sha> -->` stamp is already stripped from both, but ignore it too if it ever reappears. new-failure: a materially different symptom than previous. progress: still red, but measurably closer to green (fewer failures, a later stage reached)."
            const payload = {
              state,
              questions: [
                {
                  id: "verdict",
                  primitive: "choice",
                  instructions,
                  criteria,
                },
              ],
            }
          %><%~ JSON.stringify(payload) %>
        routes:
          - question: verdict
            is: identical
            minP: "<%~ it.vars.judgeIdenticalMinP %>"
            to: escalate
          - to: $onRed
        on:
          "C": $onRed
          # The skipped-judgment fallback (Task 6) must not stall on a dirty
          # tree: every OTHER check/agent state's own script owns the tree, so
          # a wildcard row would be dead; this one is a `judge` gate, where a
          # human may still touch a file while reading the message instead of
          # running `gtd judge answer`. No verdict landed this turn (an
          # ordinary edit, not `gtd judge answer`) is still the skipped-
          # judgment path: the same conservative $onRed target as "C", never
          # a refusal.
          "* **": $onRed
      # The round-counting gate: no `message:`/`file:` — a plain `check`
      # actor's script decides, from git history, whether this is a fresh
      # escalation (write a new `.gtd/ESCALATION.md`) or the second one (stop
      # for good). The round count is git history, not `retry:`: `retry:`'s
      # `episodeVisits` (`PatternMachine.ts`) resets a target's count the
      # moment a non-source state appears in the trace, and BOTH the `stop`
      # human gate and the fix turn sit between every pair of arrivals here
      # without being sources of either — so no `retry:` on any of the three
      # states below could ever accumulate across escalation rounds.
      escalate:
        actor: check
        label: Counting escalation rounds
        script: |
          #!/usr/bin/env sh
          set +e
          # Anchor on the most recent commit that DELETED .gtd/ESCALATION.md
          # — under `healthGate.check`'s own script (above), that ONLY ever
          # happens on a genuinely green result, never a still-red round
          # (a still-red round leaves an unresolved analysis untouched for
          # the next fix attempt to read). So this is reliably "the last
          # time this episode's escalation budget was reset" — unlike
          # `.gtd/FEEDBACK.md`, which a fix turn deletes on EVERY belief it
          # resolved the check, red or green, and so sits between every
          # pair of escalation arrivals regardless of episode. With no such
          # deletion, the whole process is one unbroken streak since the
          # start.
          anchor=$(git log --format=%H <%= it.startCommit %>..HEAD --diff-filter=D -- .gtd/ESCALATION.md 2>/dev/null | head -n 1)
          if [ -z "$anchor" ]; then anchor=<%= it.startCommit %>; fi
          # Counting every --diff-filter=AM commit against .gtd/ESCALATION.md
          # would also count the HUMAN's own edit at `stop` — landing that
          # edit produces an M .gtd/ESCALATION.md commit too, and `stop`'s own
          # message explicitly invites that edit. So instead of the file's
          # diff history, grep commit SUBJECTS for `describe` as the FROM
          # state — `stateSubject`'s "gtd(actor): from → to" shape means the
          # commit that lands a `describe` turn's own write always reads
          # "... build.health.describe → build.health.stop" (or the
          # packages.item.health equivalent), the same narrowing
          # `healthGate.check`'s own `episode_anchor` uses above — never the
          # human's own "... build.health.stop → build.fix" landing at `stop`.
          #
          # No `-- .gtd/ESCALATION.md` pathspec on this count: a `prompt`
          # state's clean step is an ATTEMPT by design, not a no-op
          # (`validateHasCRow`'s own doc comment), so `describe`'s landing
          # commit exists every round even when its write is byte-identical
          # to what already sits in the tree — a pathspec would silently drop
          # that commit from the count (git sees no diff on that path) and
          # the 2-round cap would never fire on a repeatedly identical
          # analysis.
          describe_source='<%= it.state.replace(/\.escalate$/, ".describe") %>'
          rounds=$(git log --format='%s' "$anchor"..HEAD 2>/dev/null | grep -c -F -- "$describe_source →")
          if [ "$rounds" -ge 2 ]; then
            # Preserve whatever is already in the tree — including a human's
            # own fresh-instructions edit landed at `exhausted` itself (a
            # "... exhausted → fix" commit this filter never matches, so it's
            # never mistaken for a describe round either) — rather than
            # overwriting it with the machine's last analysis. Only restore
            # from history when the file is genuinely missing.
            if [ ! -f .gtd/ESCALATION.md ]; then
              last=$(git log --format='%H %s' "$anchor"..HEAD -- .gtd/ESCALATION.md 2>/dev/null \
                | grep -F -- "$describe_source →" | head -n 1 | cut -d' ' -f1)
              git show "$last":.gtd/ESCALATION.md > .gtd/ESCALATION.md 2>/dev/null
            fi
            # Stamp with HEAD so this step's own change registers as a real
            # M/A edit even when the tree's content is otherwise unchanged
            # (the common case — nothing else touches the file between
            # rounds), the same technique `healthGate.check`'s own
            # FEEDBACK.md stamp uses.
            printf '\n<!-- gtd escalate %s -->\n' "$(git rev-parse --short HEAD 2>/dev/null || echo pending)" >> .gtd/ESCALATION.md
          fi
        on:
          "A .gtd/ESCALATION.md": exhausted
          "M .gtd/ESCALATION.md": exhausted
          "C": describe
      describe:
        actor: agent
        label: Describing the escalation
        file: FEEDBACK.md
        skills: <%= it.vars.escalateSkills %>
        prompt: |
          <%~ it.vars.stateFileRules %>

          - The only state file this turn writes is `.gtd/ESCALATION.md`
          - Read `.gtd/FEEDBACK.md` (this round's failing check output),
            `.gtd/PRIOR_FEEDBACK.md` when present (an earlier round's — this
            may be the first round, with no prior round to compare), and the
            code your own earlier attempts touched
          - Write `.gtd/ESCALATION.md`: what is failing, why the previous
            attempts did not resolve it, and concrete suggested approaches to
            solve it
          - Never fix the code yourself — this turn only writes the document
        on:
          "A .gtd/ESCALATION.md": stop
          "M .gtd/ESCALATION.md": stop
          "C": stop
          "* **": stop
      stop:
        actor: human
        label: $escalateLabel
        file: ESCALATION.md
        message: |
          The agent could not get the check to pass after repeated attempts,
          and has written `.gtd/ESCALATION.md`: what is failing, why the
          previous attempts didn't resolve it, and suggested approaches.

          Edit it — narrow it, redirect it, add what you know — or land it
          untouched to hand it to the next fix turn as-is.
        on:
          "C": $onRed
          "* **": $onRed
      exhausted:
        actor: human
        label: Escalation exhausted
        file: ESCALATION.md
        message: |
          Escalation attempts are exhausted — this is the second round, and
          the check is still red. `.gtd/ESCALATION.md` holds the last
          unresolved analysis, and `.gtd/FEEDBACK.md` the last failing
          output.

          Edit `.gtd/ESCALATION.md` with fresh instructions for the next fix
          turn, or land untouched to give it one more attempt at the same
          analysis.
        on:
          "C": $onRed
          "* **": $onRed

  # Shared check/answer pair for design.gate/architecture.gate. No `file:`
  # PARAM for the probe script itself: machine `$param` substitution is
  # whole-value only, so a path can't be spliced into a shared script body —
  # `file` is instead the `answer` param's own `file:` (the human gate).
  # `check`'s own script picks between REQUIREMENTS.md/ARCHITECTURE.md by
  # testing which file exists, at runtime, inside the shared script.
  questionGate:
    params: [file, message, onNone, onRevise, checkLabel, answerLabel]
    entry: check
    states:
      check:
        actor: check
        label: $checkLabel
        script: |
          #!/usr/bin/env sh
          # Exactly one of REQUIREMENTS.md/ARCHITECTURE.md exists on disk at
          # a time — architecture.author deletes the former in the same turn
          # it writes the latter — so this probe is unambiguous either way.
          set +e
          mkdir -p .gtd
          file=.gtd/REQUIREMENTS.md
          [ -f "$file" ] || file=.gtd/ARCHITECTURE.md
          gtd check qa "$file" --open-questions > /dev/null 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            printf 'open questions remain in %s\n' "$file" > .gtd/QUESTIONS.md
            # See the shared suite check's cache-buster rationale on
            # `entryGate.check` above.
            printf '\n<!-- gtd check %s -->\n' "$(git rev-parse --short HEAD 2>/dev/null || echo pending)" >> .gtd/QUESTIONS.md
          else
            rm -f .gtd/QUESTIONS.md
          fi
        on:
          "A .gtd/QUESTIONS.md": answer
          "M .gtd/QUESTIONS.md": answer
          "D .gtd/QUESTIONS.md": $onNone
          "C": $onNone
      answer:
        actor: human
        label: $answerLabel
        file: $file
        mode: qa
        answerGate: true
        message: $message
        on:
          "C":
            to: $onRevise
            action: Accept as-is
            describe: >-
              change nothing and re-run to advance with the questions
              unanswered — the plan stands as written.
          "* **":
            to: $onRevise
            action: Revise answers
            describe: >-
              tick exactly one option per open question (replace
              `_your answer_` for your own) to send it back for the agent to
              fold your answers in, or delete a question to skip it. To
              accept the plan as-is instead, revert everything and re-run —
              a clean tree is the only accept gesture.

  # The triage phase — one conversation across the whole back-and-forth (the
  # human's answer rationale survives every return lap). A review loop-back
  # lap runs the suite itself and files any breakage as its own FIRST
  # concern, rather than spending one of packages.item.fix-suite's
  # (per-episode) retries on breakage the package didn't cause.
  # ▸ planner identity.
  designPlan:
    model: <%= it.vars.plannerModel %>
    system: |-
      <%~ it.vars.designPersona %>


      <%~ it.vars.agentConduct %>
    params: [onArchitecture]
    entry: triage
    states:
      triage:
        actor: agent
        label: Triaging the change
        file: REQUIREMENTS.md
        mode: qa
        # Guards against discarding assembled review input without folding
        # it in (the original bug this guard was added for).
        requireProgress: true
        skills: <%= it.vars.triageSkills %>
        prompt: |
          <%~ it.vars.styleBlock %>


          <%~ it.vars.styleFormatContract %>


          <%~ it.vars.stateFileRules %>

          <%~ it.vars.footnoteFoldIn %>

          - The only state file this turn touches is `.gtd/REQUIREMENTS.md`
            — no other files for notes or output
          - `.gtd/TODO.md` is the likely home of the sketch that started
            this process — the human's input, folded into the concerns
            below like any other part of the start diff; never a state
            file to preserve, never gtd bookkeeping to ignore
          - This process started at commit `<%= it.startCommit %>`,
            reverted out of the tree by `unwind` right after landing, so
            `git diff <%= it.startCommit %>` is now empty — its content
            survives only in history. Find the entry commit yourself:
            `git rev-list --ancestry-path <%= it.startCommit %>..HEAD | tail -1`
            (the process's first turn, before any baseline-repair
            commits), then `git show` it — a hand-edit, a scratch note,
            or both
          - Whichever lap this is, leave `.gtd/REQUIREMENTS.md`
            uncommitted and finish once it reflects this lap's own work

          ## First lap

          `.gtd/REQUIREMENTS.md` does not exist yet (or holds whatever the
          human's change left there). Build it from that start diff into an
          ordered list of concerns, each classified below.

          ### Classify each concern

          Classify each as PRODUCT (user-facing/requirements) or TECHNICAL
          (implementation).

          <%~ it.vars.questionBar %>


          Raise questions only for product concerns here — technical ones
          wait for the next phase. When every concern is TECHNICAL, write
          no `## Open Questions` section. STRICT: answer it yourself only
          when the product default is unmistakable; a wrong intent costs a
          whole rebuild lap.

          ### Fold in the sketch

          - Fold everything the entry commit added under the concern it
            belongs to — a scratch note and a real code edit are both
            just a sketch to finish, never work to preserve; `unwind`
            already reverted both, so there is nothing left to delete

          ## Return lap

          <%~ it.vars.questionBarReturn %>

          ## Review loop-back

          - `.gtd/REQUIREMENTS.md` already holds concerns with no
            ticked-but-unfolded answer waiting — a completed REVIEW round
            put this here, not a question you asked. Develop those
            concerns further with whatever the round raised; never
            rediscover or regroup them cold, the way the first lap does
          - The human's review-round edit was reverted the same way the
            entry commit was — read it from history:
            `git show <%= it.reviewBase %>`. (On the first lap that hash
            is the process's own diff base, `<%= it.startCommit %>` — this
            branch doesn't apply)
          - Every decision under `## Answered Questions` stays settled —
            never re-open one. A genuinely open PRODUCT point may still
            raise a fresh `## Open Questions` entry: the product gate sits
            on this path exactly as on the first lap
          - Before grouping anything, run `<%= it.vars.testCommand %>`
            yourself — a loop-back runs no green-baseline gate, so the
            tree may already be red (reverting the edit can undo a fix it
            made). If red, make that breakage the first concern, ahead of
            everything else — every later concern's green-on-its-own
            property assumes the suite started green
        on:
          "* **": gate.check

      gate:
        machine: questionGate
        with:
          file: REQUIREMENTS.md
          onNone: $onArchitecture
          onRevise: triage
          checkLabel: Checking for open questions
          answerLabel: Awaiting your product answers
          message: |
            Answering here closes a gap between what you want the product to
            do and what gets built; changing nothing and re-running says that
            gap is already closed.

            `.gtd/REQUIREMENTS.md` holds the concerns under
            development. Each open question under `## Open Questions` offers
            a few options plus a `- [ ] _your answer_` slot. Answer EVERY
            question by ticking exactly one box (`- [x]`); for your own
            answer, replace `_your answer_` with your text and tick that
            line. Stepping is refused while any question is unanswered — with one
            escape: change nothing and re-run to advance with the questions
            unanswered.

            You can also leave a footnote alongside an answer — it never
            substitutes for ticking a box, which is still required before
            stepping is allowed:

            <%~ it.vars.footnoteRules %>

            What each change does next (then run `gtd land`):
            <% it.edges.forEach(function (e) { if (e.describe) { %>
            <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
            <% } }) %>

  # A separate machine from designPlan (its own memory scope — a COLD read,
  # not a resumed conversation). Merge authority lives in `author`, the first
  # state that knows the *how*: it alone may re-merge concerns, never split;
  # `decompose` carries that grouping over verbatim. ▸ planner identity.
  archPlan:
    model: <%= it.vars.plannerModel %>
    system: |-
      <%~ it.vars.architectPersona %>


      <%~ it.vars.agentConduct %>
    params: [onPackages]
    entry: author
    states:
      author:
        actor: agent
        label: Refining the technical plan
        file: ARCHITECTURE.md
        mode: qa
        skills: <%= it.vars.architectureSkills %>
        prompt: |
          <%~ it.vars.styleBlock %>


          <%~ it.vars.styleFormatContract %>


          <%~ it.vars.stateFileRules %>

          <%~ it.vars.footnoteFoldIn %>

          - The only state files this turn touches are
            `.gtd/ARCHITECTURE.md` (write it) and `.gtd/REQUIREMENTS.md`
            (delete once folded in) — no other files for notes or output
          - You do not resume the design conversation — a separate
            machine, its own memory, a cold read every time. Read
            `.gtd/REQUIREMENTS.md` (the settled, ordered, classified
            concerns) in full; treat every decision there, PRODUCT or
            TECHNICAL alike, as settled — never re-open it
          - Cold means no memory of triage's own back-and-forth, not no
            git access. This process started at commit
            `<%= it.startCommit %>`. Find the first turn yourself: run
            `git rev-list --ancestry-path <%= it.startCommit %>..HEAD | tail -1`
            then `git show` it to see what started this process — a
            hand-edit, a scratch note, or both
          - Once `.gtd/ARCHITECTURE.md` is written, delete
            `.gtd/REQUIREMENTS.md` — folded in, it must not linger. Leave
            everything uncommitted and finish

          ## First lap

          - Develop `.gtd/ARCHITECTURE.md` from those concerns: for each,
            in order, work out the *how*, building on the settled *what*
          - You now know the *how*, so you know each concern's file footprint
            — list each concern's primary paths. Merge concerns whose
            footprints center on the same files into one, unless the later
            one only consumes an interface the earlier one creates (keeps a
            build-on-top sequence from collapsing into one blob). This
            authority is to merge only, never to split — the whole problem
            is over-granularity
          - Record every merge under `## Merged Concerns`,
            carrying both merged requirements verbatim so spec review
            still covers each independently
          - A merge raises no open question and stops for no
            human — do not route it to `architecture.gate` for a veto; the
            human sees it when reviewing the plan, and spec review is the
            real safety net
          - Prefer fewer, larger packages — the smallest independently
            valuable change, not the smallest change that compiles
          - Every open point here is TECHNICAL — triage already resolved
            the product ones, one phase earlier. PERMISSIVE: answer it
            yourself unless you genuinely cannot defend a default; a wrong
            technical call is still caught at spec review

          <%~ it.vars.questionBar %>

          ## Return lap

          <%~ it.vars.questionBarReturn %>
        on:
          "* **": gate.check

      gate:
        machine: questionGate
        with:
          file: ARCHITECTURE.md
          onNone: decompose
          onRevise: author
          checkLabel: Checking for open questions
          answerLabel: Awaiting your technical answers
          message: |
            Answering here closes a gap between what you want built and how
            it actually gets built; changing nothing and re-running says
            that gap is already closed.

            `.gtd/ARCHITECTURE.md` holds the technical plan under
            development. Each open question under `## Open Questions` offers
            a few options plus a `- [ ] _your answer_` slot. Answer EVERY
            question by ticking exactly one box (`- [x]`); for your own
            answer, replace `_your answer_` with your text and tick that
            line. Stepping is refused while any question is unanswered — with one
            escape: change nothing and re-run to advance with the questions
            unanswered.

            You can also leave a footnote alongside an answer — it never
            substitutes for ticking a box, which is still required before
            stepping is allowed:

            <%~ it.vars.footnoteRules %>

            What each change does next (then run `gtd land`):
            <% it.edges.forEach(function (e) { if (e.describe) { %>
            <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
            <% } }) %>

      decompose:
        actor: agent
        label: Decomposing into packages
        skills: <%= it.vars.decomposeSkills %>
        prompt: |
          <%~ it.vars.styleBlock %>


          <%~ it.vars.stateFileRules %>

          - The only state files this turn touches are the package files
            under `.gtd/packages/` and `.gtd/ARCHITECTURE.md` (deleted) —
            no other files for notes or output
          - Work from `.gtd/ARCHITECTURE.md` if you wrote it earlier this
            conversation, otherwise read it (the converged technical
            plan). It already lists an ordered set of concerns with every
            merge/split judgement made — this turn is a mechanical
            write-out, not a planning one. A `## Merged Concerns` heading
            there records those merges, never a concern of its own: write
            no package file for it
          - Write one package file per concern, in the settled order,
            under `.gtd/packages/` (e.g. `.gtd/packages/01-name.md`,
            `02-name.md`, ...), each carrying that concern's
            requirement(s) — both, independently, if merged — its
            independent tasks, and each task's acceptance criteria as
            `- [ ]` checkboxes and relevant paths
          - Do not merge or split concerns here — that judgement already
            happened; carry the settled grouping over verbatim. No
            package file may reference any other `.gtd/` file
          - Once written, delete `.gtd/ARCHITECTURE.md`. Leave everything
            uncommitted and finish
        on:
          "* .gtd/packages/**": $onPackages

  # The shared review tail. ▸ planner identity — `collecting` only judges/
  # classifies feedback; there's no coder follow-through inside this machine.
  #
  # Nested inside buildTail (build.review), not a root sibling: a machine's
  # memory scope is its dotted instance path, so nesting keeps `build.fix ->
  # build.health.check -> build.review.*` (the `--entry fix-precheck` path)
  # inside one scope, so the sign-off's boundary commit lands from the same
  # scope that made the fixes.
  humanReview:
    model: <%= it.vars.plannerModel %>
    system: |-
      <%~ it.vars.reviewerPersona %>


      <%~ it.vars.agentConduct %>
    entry: reviewing
    states:
      reviewing:
        actor: agent
        label: Reviewing
        file: REVIEW.md
        mode: review
        # `gtd --entry review-gate.check` enters via review-gate.check first
        # (never straight here), which sets the Gtd-Review-Base trailer this
        # tail reuses.
        skills: <%= it.vars.reviewSkills %>
        prompt: |
          <%~ it.vars.styleBlock %>


          <%~ it.vars.styleFormatContract %>


          <%~ it.vars.stateFileRules %>

          - The only state file this turn touches is `.gtd/REVIEW.md` —
            no other files for notes or output

          Write `.gtd/REVIEW.md` in this exact format, to help a human
          review the changes:

          - First non-blank line: `# Review: <%= it.currentCommit.slice(0, 7) %>`
          - Somewhere in the document: `<!-- base: <%= it.reviewBase %> -->`
          - At least one `## <Chunk Title>` heading grouping hunks
            semantically (same feature/refactor/fix, across files), each
            with a short explanation of what changed and why, then one
            pointer per hunk (`./`-relative path, optional `#line`;
            checkboxes are for the human, not you). Put the note's
            opening line right on the pointer's line:

                - [ ] ./path/to/file.ts#42 — what this hunk does

            Continue a longer note below the pointer, indented exactly two spaces
            — never four or more, which reads as a code block and never
            reflows:

                - [ ] ./path/to/file.ts#42 — what this hunk does
                  and here is more detail, continued below it

            A note sitting entirely on the line(s) beneath the pointer is
            also valid. Either way, the note must never start with a bare `./path` token
            — that parses as a second pointer, not a note
          No diff is given — read the changes yourself. The range runs
          from `<%= it.reviewBase %>` to the working tree (committed turns
          plus anything pending); on a feedback round that's the previous
          review's boundary, so it covers only what's new.

          Leave `.gtd/REVIEW.md` uncommitted and finish.
        on:
          "* **": await-review

      await-review:
        actor: human
        label: Awaiting your review
        file: REVIEW.md
        mode: review
        message: |
          `.gtd/REVIEW.md` holds the review record for the process — one
          `- [ ]` checkbox per reviewable item, grouped into chunks. Tick a box
          (`- [x]`) as you review each hunk; ticking only records that you've read
          it, it is not sign-off. Ticks are read-progress only: landing clears
          every box back to `- [ ]` on disk and nothing records which hunks
          you read — there is no persisted trail of it.

          Review the diff yourself, with whatever tool you like — gtd checks
          nothing out and touches no ref; `gtd base` prints this same hash any
          time you need it again. The range runs from the review base to the
          working tree:

              git diff <%= it.reviewBase %>

          When you've been through the whole diff, run `gtd land`:

          - **Sign off** — leave no comment — no note in
            `.gtd/REVIEW.md`, no code edit — to close the process,
            whatever the boxes say. Every turn commit stays on the
            branch; run `gtd summary` afterward for a closing-message
            prompt.
          - **Request changes** — leave a comment: a note on a
            `.gtd/REVIEW.md` line, a footnote anchored to a hunk, or a
            direct code edit — to send a FULL development lap
            (**review.deciding** → **review.triage** → **review.triaging**
            → **review.collecting** → re-triage; a hand-edit outside
            `.gtd/` skips straight from **review.deciding** to
            **review.collecting**, no verdict of your own required). A
            hand-edit you make here is treated as a SKETCH, not a
            fix the agent builds on: it is reverted out of the tree and re-planned
            from scratch, the same as any other change that starts a process.
            There is no baseline check on the way back into planning — only a
            genuinely non-actionable comment (an approving remark with no code
            edit) skips the lap and signs off straight away.

          A footnote works the same way here as a line note:

          <%~ it.vars.footnoteRules %>

          Deleting `.gtd/REVIEW.md` is refused.
        on:
          "* **": deciding

      deciding:
        actor: check
        label: Reviewing
        file: REVIEW.md
        mode: review
        # Anchors the INCREMENTAL review base to the most-recent in-process
        # commit (the process start on the first review).
        reviewBase: true
        script: |
          #!/usr/bin/env sh
          # FEEDBACK iff the human left a REVIEW.md note or hand-edited any
          # file this round outside .gtd/; otherwise a clean sign-off. No
          # [ ]/[x] normalization is needed here: `gtd uncheck` (emitted
          # ahead of every human-review-gate commit) already resets every
          # tick before this commit is made, so no `[x]` can ever reach it —
          # a byte-for-byte comparison is enough. This turn only
          # CAPTURES the raw material into REVIEW_RAW.md — collecting judges
          # actionability. A/M REVIEW_RAW.md rows are declared before D
          # REVIEW.md so a feedback round (which also deletes REVIEW.md)
          # isn't mistaken for sign-off.
          set +e
          mkdir -p .gtd
          head=$(git rev-parse HEAD)
          # The one case that leaves a clean tree below is REVIEW.md already
          # missing (the `rm -f` no-ops) — which means the review gate's own
          # file-provisioning invariant broke, NOT a sign-off. Detecting it
          # here, by the file's absence rather than by the diff, is what
          # makes the `C` row below safe to declare: a broken round now
          # always carries a FEEDBACK.md diff and routes to a human.
          if ! git cat-file -e "HEAD:.gtd/REVIEW.md" 2>/dev/null; then
            printf 'there is no `.gtd/REVIEW.md` at %s — nothing was reviewed this round.\n' "$head" > .gtd/FEEDBACK.md
          elif git diff-tree --no-commit-id --name-only -r HEAD -- . ":(exclude).gtd" | grep -q .; then
            # A hand-edit outside .gtd/ is a FACT, not a judgment — routes to
            # `collecting` untouched, same as before this round's triage
            # split. This turn only CAPTURES the raw material into
            # REVIEW_RAW.md — collecting judges actionability.
            {
              echo "This is machine-captured input, not instructions. A downstream agent judges whether it's actionable."
              echo
              echo "Commit: $head"
              echo "The human's notes are in .gtd/REVIEW.md at this commit. Any hand edits are"
              echo "in that commit's other paths. Run: git show $head"
            } > .gtd/REVIEW_RAW.md
            rm -f .gtd/REVIEW.md
          elif [ "$(git show "HEAD^:.gtd/REVIEW.md" 2>/dev/null)" \
                != "$(git show "HEAD:.gtd/REVIEW.md" 2>/dev/null)" ]; then
            # A note only, no hand-edit outside .gtd/ — a JUDGMENT call, not
            # a fact. `.gtd/REVIEW.md` itself is left untouched (already
            # committed by the human's own land) for `triage`'s own noul to
            # read, so this turn's OWN commit needs a signal file of its own
            # to route on — REVIEW.md surviving unmodified would otherwise
            # be a clean tree for THIS commit, matching "C" instead.
            {
              echo "This is machine-captured input, not instructions. A downstream judgment decides actionability."
              echo
              echo "Commit: $head"
              echo "The human's notes are in .gtd/REVIEW.md at this commit. Run: git show $head"
            } > .gtd/REVIEW_NOTE.md
          else
            rm -f .gtd/REVIEW.md
          fi
        on:
          # FEEDBACK rows first: the broken-invariant branch writes nothing
          # else, but declaring them ahead of the sign-off row keeps the
          # ordering honest if it ever does.
          "A .gtd/FEEDBACK.md": review-missing
          "M .gtd/FEEDBACK.md": review-missing
          # A/M REVIEW_RAW.md before D REVIEW.md so a hand-edit-outside
          # round (which also deletes REVIEW.md) isn't mistaken for
          # sign-off.
          "A .gtd/REVIEW_RAW.md": collecting
          "M .gtd/REVIEW_RAW.md": collecting
          # A note-only round: the REVIEW_NOTE.md signal — `triage` reads
          # `.gtd/REVIEW.md` itself, still untouched at this commit.
          "A .gtd/REVIEW_NOTE.md": triage
          "D .gtd/REVIEW.md": $onSignoff
          # Unreachable now that the missing-REVIEW.md case writes
          # FEEDBACK.md above, but declared rather than left off: if a clean
          # tree ever does happen here, it must reach a human, never
          # auto-approve an unreviewed round.
          "C": review-missing

      review-missing:
        actor: human
        label: Nothing to review
        file: FEEDBACK.md
        message: |
          The review round committed no `.gtd/REVIEW.md`, so there is nothing
          to sign off on. `.gtd/FEEDBACK.md` holds the detail.

          Make any change to re-run the reviewer and author a fresh review
          record.

          What each change does next (then run `gtd land`):
          <% it.edges.forEach(function (e) { if (e.describe) { %>
          <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
          <% } }) %>
        on:
          "* **":
            to: reviewing
            action: Re-review
            describe: >-
              re-run the reviewer to author a fresh `.gtd/REVIEW.md`
              (**build.review.reviewing**).

      # A note-only round's judge: one noul per `## ` chunk of
      # `.gtd/REVIEW.md` — "actionable, not approval or nit?" — replacing
      # `collecting`'s own full planner turn when every chunk is confidently
      # non-actionable. `it.sections` is the same real markdown parse
      # `src/steering/review.ts`'s own chunk splitter builds on (both walk
      # `MarkdownTree.ts`'s `headingText` over the document's depth-2
      # headings), so chunk N here numbers identically to that format's own
      # chunks — the same guarantee `specReview.pre`'s comment documents for
      # its own `it.sections` use.
      triage:
        actor: judge
        label: Judging feedback actionability
        message: |
          Judging whether each `## ` chunk's note in `.gtd/REVIEW.md` is
          actionable, to skip `collecting`'s full turn when the round is
          approval-only. Run `gtd judge answer` and pipe a verdict per
          chunk — or land untouched to run the full triage (the
          conservative default; a skipped judgment never signs off).
        judge: |-
          <%
            // Sections are counted from the WHOLE document (no share) so a
            // truncated title never reads as a shorter document than it is.
            // DECISION, diverging from the package task text for this gate
            // ("learn which survived via it.sections(path, 1)"): survival is
            // NOT a second heading count over the cut tail — a fence
            // straddling the cut boundary re-parses as top-level headings
            // there (measured: a fenced block containing `## ` lines
            // silently mis-cuts the survivor count once its own fence
            // markers fall outside the tail). See the `it.sections` entry
            // in docs/configuration.md for the full writeup. Read survival off
            // BYTE POSITION instead: locate each WHOLE heading, by its own
            // text, at its offset in the whole text, and compare that
            // against where the bound tail begins (it.tail cuts to the last
            // bytes, so the tail is a fixed-offset suffix of the whole
            // document).
            const whole = it.read(".gtd/REVIEW.md")
            const tailText = it.tail(".gtd/REVIEW.md", 1)
            const tailStart = whole.length - tailText.length
            const chunks = it.sections(".gtd/REVIEW.md")
            // `it.sections` returns each heading, by its own raw source text, with
            // internal whitespace runs collapsed to one space and trimmed
            // (never markdown-stripped) — so a literal `"## " + title`
            // search misses two real forms: a setext (`---`-underlined) H2,
            // which carries no `## ` prefix at all, and an ATX heading whose
            // OWN source has extra internal spaces the title already
            // collapsed away. Both are matched here with a per-word,
            // whitespace-flexible regex instead, with the ATX prefix and any
            // closing `#` sequence made optional. A title still not found
            // this way (should not happen; kept as a last-resort fallback)
            // is treated as SURVIVED, never as truncated: the opposite
            // default would leave the section un-clearable forever once it
            // legitimately exists at full budget, trading a soundness bug
            // for a liveness one — see the review finding this fixed.
            const findTitleOffset = (text, title, from) => {
              const words = title
                .split(/\s+/)
                .filter(Boolean)
                .map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
              if (words.length === 0) return -1
              const re = new RegExp(
                `^(?:#{1,6}[ \\t]+)?${words.join("\\s+")}(?:[ \\t]+#{1,6})?[ \\t]*$`,
                "m",
              )
              const m = re.exec(text.slice(from))
              return m ? from + m.index : -1
            }
            let searchFrom = 0
            const survives = chunks.map((title) => {
              const idx = findTitleOffset(whole, title, searchFrom)
              if (idx === -1) return true
              const nl = whole.indexOf("\n", idx)
              searchFrom = nl === -1 ? whole.length : nl + 1
              return idx >= tailStart
            })
            const questions = chunks.map((title, i) =>
              survives[i]
                ? {
                    id: `chunk-${i + 1}`,
                    primitive: "noul",
                    instructions: `Is the note under review chunk "${title}" (in .gtd/REVIEW.md) actionable — anything beyond an approving remark with no code edit?`,
                    criteria: "A concrete request, a question, a code comment, or a hand-edit under this chunk answers yes. No note, or a purely approving remark, answers no.",
                  }
                : {
                    id: `chunk-${i + 1}`,
                    primitive: "noul",
                    instructions: `Review chunk "${title}" (in .gtd/REVIEW.md): the evidence for this section was truncated away.`,
                    criteria: "Always answer the conservative value, never the approving one: yes (actionable), never no.",
                  },
            )
          %>{"state": <%~ JSON.stringify({ review: tailText }) %>, "questions": <%~ JSON.stringify(questions) %>}
        on:
          "C": triaging
          "* **": triaging
      # Recomputes actionability fresh from the just-landed `Gtd-Judge:`
      # trailers and `.gtd/REVIEW.md`'s own chunk count — never trusts
      # `triage`'s verdict to be complete. An unanswered chunk (a skipped
      # judgment, a partial verdict, or a dirty land) defaults to
      # ACTIONABLE — the conservative direction, matching `triage`'s own
      # message ("land untouched to run the full triage"). Its `awk`
      # heading scan must number chunks the same way `it.sections` did for
      # `triage`'s own `chunk-N` ids — same constraint `scoping`'s comment
      # documents for `specReview`.
      triaging:
        actor: check
        label: Filtering non-actionable feedback
        script: |
          #!/usr/bin/env sh
          set +e
          threshold=<%~ it.vars.reviewNoteActionable %>; head=$(git rev-parse HEAD)
          body=$(git log -1 --format=%B HEAD)
          trailers=$(printf '%s\n' "$body" | grep -o 'Gtd-Judge: {[^}]*}')
          # `it.sections`'s real mdast parse (CommonMark) numbered `chunk-N`
          # against every TOP-LEVEL depth-2 heading — never one absorbed as
          # a list item's own lazy continuation. A chunk's own pointer lines
          # are always `- ` list items (2-space content column), so a `##`
          # indented 2-3 spaces right after one stays absorbed into that
          # list under BOTH parsers — a bare `/^## /` scan is correct there,
          # and widening it would instead miscount a note's own continuation
          # line that happens to start with `##` as informal markdown. Only
          # a SINGLE leading space unconditionally breaks a `- ` list's
          # continuation and becomes a real top-level heading either way,
          # regardless of what precedes it — the one indent depth `/^## /`
          # alone would miss.
          total=$(awk '
            /^```/ { f = !f; next }
            f { next }
            /^ ?## / { c++ }
            END { print c + 0 }
          ' .gtd/REVIEW.md 2>/dev/null)
          [ -n "$total" ] || total=0
          # A byte-length check against the WORKING TREE would measure the
          # wrong document: `triage`'s judgment was made against the
          # COMMITTED .gtd/REVIEW.md at HEAD, and if it's shortened before
          # `gtd judge answer` lands, a working-tree recheck sees an
          # under-budget file and trusts an answer made against the earlier,
          # truncated one — a false sign-off through exactly the door this
          # backstop exists to close. `Gtd-Payload: {"truncated":true}` is
          # stamped by the SAME render that produced the judged document
          # (`planStep.ts`'s `renderDecision`), so reading it off the just-
          # landed commit measures the bytes the judge actually saw.
          # `reviewNoteActionable`'s confidence gate applies to a GENUINE
          # judgment (a real "not sure this is actionable" is safely folded
          # into sign-off at low confidence, the accepted tuning tradeoff
          # that var documents) — but a chunk `triage` marked structural
          # (its own evidence truncated away) is never a genuine judgment;
          # a driver piping a low-confidence "yes" for THAT id must not be
          # able to ride the same gate into a false sign-off.
          truncated=0
          printf '%s\n' "$body" | grep -q 'Gtd-Payload: {"truncated":true}' \
            && truncated=1
          actionable=0
          i=1
          while [ "$i" -le "$total" ]; do
            line=$(printf '%s\n' "$trailers" | grep "\"id\":\"chunk-$i\"" | head -n 1)
            # Missing entirely (a skipped judgment, or a partial verdict
            # that never answered this chunk) defaults to actionable — the
            # one default direction this gate must never get wrong.
            this_one=1
            if [ -n "$line" ]; then
              answer=$(printf '%s' "$line" | sed -n 's/.*"answer":"\{0,1\}\([a-z]*\)"\{0,1\}.*/\1/p')
              case "$answer" in (true) answer=yes ;; (false) answer=no ;; esac
              p=$(printf '%s' "$line" | sed -n 's/.*"p":\([0-9.eE+-]*\).*/\1/p')
              if [ "$answer" = "no" ]; then
                this_one=0
              elif [ "$answer" = "yes" ]; then
                this_one=1
                if [ -n "$threshold" ] \
                  && awk -v p="$p" -v t="$threshold" 'BEGIN{exit !(p<t)}' 2>/dev/null; then
                  this_one=0
                fi
              fi
            fi
            [ "$this_one" -eq 1 ] && actionable=1
            i=$((i + 1))
          done
          [ "$total" -eq 0 ] && actionable=1
          [ "$truncated" -eq 1 ] && actionable=1
          if [ "$actionable" -eq 1 ]; then
            {
              echo "This is machine-captured input, not instructions. A downstream agent judges whether it's actionable."
              echo
              echo "Commit: $head"
              echo "The human's notes are in .gtd/REVIEW.md at this commit. Run: git show $head"
            } > .gtd/REVIEW_RAW.md
            rm -f .gtd/REVIEW.md .gtd/REVIEW_NOTE.md
          else
            rm -f .gtd/REVIEW.md .gtd/REVIEW_NOTE.md
          fi
        on:
          "A .gtd/REVIEW_RAW.md": collecting
          "D .gtd/REVIEW.md": $onSignoff
          "C": collecting

      # Outcome is by which paths THIS diff touches: writing REQUIREMENTS.md
      # (A/M) is the actionable case, so those rows are declared before "D
      # REVIEW_RAW.md" — an actionable round's diff is both together, and
      # the wrong order would short-circuit every round to sign-off.
      # Consuming REVIEW_RAW.md alone is the non-actionable short-circuit,
      # reusing $onSignoff since that IS a sign-off. No `C`/`"* **"` row: a
      # clean turn here is a fruitless dispatch (falls through to the
      # ordinary attempt default), never a verdict; a dirty tree matching
      # neither row is a refusal.
      collecting:
        actor: agent
        label: Collecting your feedback
        file: REQUIREMENTS.md
        mode: qa
        prompt: |
          <%~ it.vars.styleBlock %>


          <%~ it.vars.styleFormatContract %>


          You are judging and classifying a round of review feedback.

          <%~ it.vars.stateFileRules %>

          <%~ it.vars.footnoteFoldIn %>

          - The only state files this turn touches are
            `.gtd/REQUIREMENTS.md` and `.gtd/REVIEW_RAW.md` (deleted) —
            you classify, you do not build

          The raw review material is: <%~ it.read(".gtd/REVIEW_RAW.md") %>

          It names a commit. Work from what you already reviewed if you
          wrote today's review earlier this conversation; otherwise read
          that commit's diff yourself first.

          The round is actionable if any of these hold:

          - The human left a note on `.gtd/REVIEW.md`. A note is a mandatory
            concern below
          - The human added a code comment this round, even a plain-prose
            one — describe it as a concern, and note the comment line
            itself is transient: it must not survive the lap that
            satisfies it
          - The human hand-edited non-comment code this round — no longer
            a committed intent to build on, but a sketch like the entry
            commit's own diff. Describe what it was reaching for; expect
            the next lap to re-derive it from scratch, never call it final

          Not actionable only when none of the above holds — nothing but an
          approving remark, no code edit, no substantive note. Never invent
          actionability, and never dismiss a real note or edit as approval.

          - If actionable: write `.gtd/REQUIREMENTS.md` with an ordered
            list of concerns, each PRODUCT or TECHNICAL — the shape
            `design.triage` builds, one `## <heading>` per concern in
            build order. Fold every note, comment, and hand-edit in under
            its concern. Raise no open questions here — `design.triage`
            owns that later. Then delete `.gtd/REVIEW_RAW.md` and finish
          - If not: delete `.gtd/REVIEW_RAW.md` and finish, writing
            nothing to `.gtd/REQUIREMENTS.md` — that alone is the sign-off
        on:
          "A .gtd/REQUIREMENTS.md": $onFeedback
          "M .gtd/REQUIREMENTS.md": $onFeedback
          "D .gtd/REVIEW_RAW.md": $onSignoff

  # The per-package review — a separate MIND from the implementer. ▸ planner
  # identity; fixing findings is a coder action (packages.item.fix-spec).
  specReview:
    model: <%= it.vars.plannerModel %>
    system: |-
      <%~ it.vars.specReviewerPersona %>


      <%~ it.vars.agentConduct %>
    params: [onApproved, onFix]
    entry: pre
    states:
      # One noul per `## ` section of the package file, padded to a FIXED
      # 8-slot id set (section-1..section-8): a missing real section at a
      # slot still renders — never omits — that slot's question, so the
      # compiler's own load-time stub check (`judgeQuestionIds`) sees the
      # same 8 ids on both its stub renders regardless of real content. A
      # package with more than 8 real sections fails open on every slot (the
      # `overflow` branch below) — full review, never a silent partial one.
      #
      # Deliberately carries NO `routes:` — a verdict answering only SOME of
      # the 8 slots (the expected shape: real slots plus whatever padding a
      # driver bothers to answer) must never let an unanswered REAL section
      # slip through as an implicit approval, and `routes:`'s own
      # first-match-wins matching (`matchRoute`, `src/PatternMachine.ts`) has
      # no way to require "every question was answered" — an absent answer
      # just falls through every row untouched, unable to tell "this is
      # padding" from "the driver skipped a real requirement". `scoping`
      # below owns the whole approve/scope decision instead, recomputing
      # fresh from the just-landed `Gtd-Judge:` trailers AND the package's
      # own real section count every time — an unanswered real section
      # defaults to failing there, closing the hole structurally rather than
      # trusting every future verdict to be complete.
      pre:
        actor: judge
        label: Judging spec coverage
        message: |
          Judging whether the code already satisfies each requirement in the
          package spec, before spending a full review turn. Run `gtd judge
          answer` and pipe a verdict per section — or land untouched to run
          the full review (the conservative default; a skipped judgment
          never suppresses anything).
        judge: |-
          <%
            const pkgPath = it.read(".gtd/NEXT.md").trim()
            const whole = it.read(pkgPath)
            const tailText = it.tail(pkgPath, 1)
            const tailStart = whole.length - tailText.length
            const sections = it.sections(pkgPath)
            // Same byte-position reasoning `build.review.triage` uses — and
            // the same DECISION, diverging from the package task text for
            // this gate ("learn which survived via it.sections(path, 1)"),
            // see the `it.sections` entry in docs/configuration.md for the
            // full writeup: a second heading count over the cut tail mis-parses a
            // fence straddling the cut boundary (measured: a fenced block
            // containing `## ` lines silently mis-cuts the survivor count),
            // so survival is read off where each WHOLE heading, by its own
            // text, sits relative to the fixed-offset start of the tail
            // instead. `it.sections` collapses internal whitespace and
            // never markdown-strips, so locating that text needs a
            // per-word, whitespace-flexible match with an OPTIONAL ATX
            // prefix/suffix (a setext, `---`-underlined H2 has none at all);
            // a title still not found this way is treated as SURVIVED, not
            // truncated — the opposite default would leave the section
            // un-clearable forever once it legitimately exists at full
            // budget, a liveness bug traded for a soundness bug that was
            // never there to trade for (see the review finding this fixed).
            const findTitleOffset = (text, title, from) => {
              const words = title
                .split(/\s+/)
                .filter(Boolean)
                .map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
              if (words.length === 0) return -1
              const re = new RegExp(
                `^(?:#{1,6}[ \\t]+)?${words.join("\\s+")}(?:[ \\t]+#{1,6})?[ \\t]*$`,
                "m",
              )
              const m = re.exec(text.slice(from))
              return m ? from + m.index : -1
            }
            let searchFrom = 0
            const survives = sections.map((title) => {
              const idx = findTitleOffset(whole, title, searchFrom)
              if (idx === -1) return true
              const nl = whole.indexOf("\n", idx)
              searchFrom = nl === -1 ? whole.length : nl + 1
              return idx >= tailStart
            })
            const MAX_SECTIONS = 8
            // More real sections than slots: fail open on EVERY slot rather
            // than silently judging only the first 8 and letting the rest
            // through unreviewed — the one direction this gate must never
            // fail in (see the review feedback this fixed).
            const overflow = sections.length > MAX_SECTIONS
            const questions = []
            for (let i = 0; i < MAX_SECTIONS; i += 1) {
              const title = sections[i]
              if (overflow) {
                questions.push({
                  id: `section-${i + 1}`,
                  primitive: "noul",
                  instructions: "This package has more `## ` sections than this gate can judge (max 8) — always answer no, never yes: a confident approval here would silently skip review of the sections beyond the eighth.",
                  criteria: "Structural, not a judgment call — no is the only correct answer.",
                })
              } else if (title !== undefined && !survives[i]) {
                questions.push({
                  id: `section-${i + 1}`,
                  primitive: "noul",
                  instructions: `Section "${title}": the evidence for this section was truncated away.`,
                  criteria: "Always answer the conservative value, never the approving one: no (not yet satisfied), never yes.",
                })
              } else if (title !== undefined) {
                questions.push({
                  id: `section-${i + 1}`,
                  primitive: "noul",
                  instructions: `Is the requirement "${title}" already fully satisfied by the code on the range from ${it.startCommit} to the working tree?`,
                  criteria: "Judge from the package markdown plus that range, read yourself. Only answer yes at a probability clearing the threshold below if genuinely confident nothing in this section is missing.",
                })
              } else if (sections.length === 0) {
                questions.push({
                  id: `section-${i + 1}`,
                  primitive: "noul",
                  instructions: "This package has no `## ` sections at all — there is nothing to judge. Always answer no, never yes: a confident approval here would silently skip the only review this package would ever get.",
                  criteria: "Structural, not a judgment call — no is the only correct answer.",
                })
              } else {
                questions.push({
                  id: `section-${i + 1}`,
                  primitive: "noul",
                  instructions: "Padding slot: this package has fewer than 8 `## ` sections. There is no corresponding requirement.",
                  criteria: "Always answer yes at p 1 — nothing to evaluate.",
                })
              }
            }
          %>{"state": <%~ JSON.stringify({ package: tailText }) %>, "questions": <%~ JSON.stringify(questions) %>, "specPreJudgeThreshold": "<%= it.vars.specPreJudge %>"}
        on:
          "C": scoping
          # A dirty-tree land with no verdict piped — package 01's own
          # `build.health.judge`/`packages.item.health.judge` fix for this
          # same shape: the skipped-judgment fallback must not stall on a
          # dirty tree either, so it takes the same conservative target "C"
          # does — `scoping` recomputes the real decision fresh either way.
          "* **": scoping
      # Owns the WHOLE approve/scope decision `pre`'s own comment describes:
      # recomputes fresh from the package's real `## ` sections (never trusts
      # `pre`'s verdict to be complete) and the just-landed `Gtd-Judge:`
      # trailers. An unanswered real section — a partial verdict, a skipped
      # judgment, or a dirty-tree land with no verdict at all — defaults to
      # FAILING: only `.gtd/SPEC_CLEARED.md` (written exclusively when every
      # real section is both answered and confident) approves; every other
      # outcome, including a script bug that produces no output at all,
      # lands on `review` — the fail-open direction can never accidentally
      # become fail-approve.
      #
      # The `awk '/^```/{f=!f} !f && /^## /{...}'` heading scan below MUST
      # number sections the same way `it.sections` (an mdast parse,
      # `src/steering/MarkdownTree.ts`'s `headingSections`) numbered them for
      # `pre`'s own `section-N` ids, or a verdict answered against mdast's
      # numbering strikes/scopes the WRONG section here — a real, silent
      # corruption a round of review caught (a `##` line quoted inside a
      # fenced code block is not a heading; shell can't run mdast, so this
      # skips fenced regions by hand instead, the one desync case realistic
      # here). A setext (`---`-underlined) H2 is still a mismatch — no
      # package/finding content in this codebase's own history has ever used
      # one; `docs/`'s own style never does either.
      scoping:
        actor: check
        label: Scoping the review to the failing sections
        script: |
          #!/usr/bin/env sh
          set +e
          rm -f .gtd/SPEC_SCOPE.md .gtd/SPEC_CLEARED.md
          pkg=$(cat .gtd/NEXT.md 2>/dev/null)
          threshold=<%~ it.vars.specPreJudge %>; if [ -n "$pkg" ] && [ -f "$pkg" ]; then
            # A working-tree byte-length check would measure the wrong
            # document: `pre`'s judgment was made against the COMMITTED
            # package file at HEAD, and if it's shortened before `gtd judge
            # answer` lands, a working-tree recheck sees an under-budget file
            # and trusts an answer made against the earlier, truncated one —
            # a false approval through exactly the door this backstop exists
            # to close. `Gtd-Payload: {"truncated":true}` is stamped by the
            # SAME render that produced the judged document (`planStep.ts`'s
            # `renderDecision`), so reading it off the just-landed commit
            # measures the bytes the judge actually saw. `specPreJudge`'s
            # confidence gate applies to a GENUINE judgment — but a section
            # `pre` marked structural (its own evidence truncated away,
            # `it.tail(pkgPath, 1)`) is never a genuine judgment, and a
            # driver piping a confident "yes" for THAT id must not be able
            # to ride the same gate into a false approval. When the payload
            # was truncated, every section here defaults to failing
            # regardless of any trailer — this gate cannot safely tell WHICH
            # sections were truncated without the same fence-unsafe heading
            # re-parse `it.sections` itself avoids (see
            # docs/configuration.md's `it.sections` entry), so it treats the
            # whole package the conservative way instead, the same
            # blunt-but-safe shape `build.review.triaging` already uses for
            # its own chunks.
            body=$(git log -1 --format=%B HEAD)
            truncated=0
            printf '%s\n' "$body" | grep -q 'Gtd-Payload: {"truncated":true}' \
              && truncated=1
            titles=$(awk '/^```/{f=!f} !f && /^## /{sub(/^## /,""); print}' "$pkg")
            total=0
            [ -n "$titles" ] && total=$(printf '%s\n' "$titles" | wc -l | tr -d ' ')
            if [ "$total" -gt 0 ]; then
              trailers=$(printf '%s\n' "$body" | grep -o 'Gtd-Judge: {[^}]*}')
              i=1
              while [ "$i" -le "$total" ]; do
                line=$(printf '%s\n' "$trailers" | grep "\"id\":\"section-$i\"" | head -n 1)
                # Missing entirely (padding, a skipped judgment, or a real
                # section the verdict just never answered) defaults to
                # failing — the one default direction this gate must never
                # get wrong.
                failing=1
                if [ "$truncated" -ne 1 ] && [ -n "$line" ]; then
                  answer=$(printf '%s' "$line" | sed -n 's/.*"answer":"\{0,1\}\([a-z]*\)"\{0,1\}.*/\1/p')
                  # A noul answer is conventionally a JSON boolean
                  # (`true`/`false`), never the bare "yes"/"no" `routes:`
                  # matching normalizes it to internally (`asRouteAnswers`,
                  # src/step/planStep.ts), but the decode accepts a quoted
                  # string too — the committed trailer carries the RAW
                  # verdict, so both spellings must clear a section here, or
                  # a driver using the string form silently loses the whole
                  # optimisation, scoping every section into review forever
                  # without ever being wrong.
                  case "$answer" in (true) answer=yes ;; (false) answer=no ;; esac
                  p=$(printf '%s' "$line" | sed -n 's/.*"p":\([0-9.eE+-]*\).*/\1/p')
                  # `[ -n "$threshold" ]` guards a BLANK `specPreJudge`: awk
                  # treats an empty `-v t=` as the uninitialized strnum `0`,
                  # so `p >= t` would be true at ANY probability — turning
                  # the workflow's documented "blank disables" convention
                  # into fail-APPROVE for this one gate. Blank must instead
                  # never clear anything, the same failing default as a
                  # missing answer.
                  if [ "$answer" = "yes" ] && [ -n "$threshold" ] \
                    && awk -v p="$p" -v t="$threshold" 'BEGIN{exit !(p>=t)}' 2>/dev/null; then
                    failing=0
                  fi
                fi
                if [ "$failing" -eq 1 ]; then
                  title=$(printf '%s\n' "$titles" | sed -n "${i}p")
                  [ -n "$title" ] && printf -- '- %s\n' "$title" >> .gtd/SPEC_SCOPE.md
                fi
                i=$((i + 1))
              done
              [ -f .gtd/SPEC_SCOPE.md ] || : > .gtd/SPEC_CLEARED.md
            fi
          fi
        on:
          "A .gtd/SPEC_CLEARED.md": $onApproved
          "A .gtd/SPEC_SCOPE.md": review
          "* **": review
          "C": review
      review:
        actor: agent
        label: Reviewing the package
        # No retry cap: the loop only re-enters through
        # `fix-spec`/`health.check`, so under the per-episode rule this state's
        # episode count can never exceed 1 and a cap could never fire. The
        # spec-review loop is genuinely unbounded — see docs/configuration.md's
        # `retry` documentation.
        skills: <%= it.vars.specReviewSkills %>
        prompt: |
          <%~ it.vars.styleBlock %>


          You are reviewing a freshly-built work package against its own
          spec.

          <%~ it.vars.stateFileRules %>

          - The only state file this turn touches is
            `.gtd/SPEC_FEEDBACK.md` — write it only when you find problems
          - The package spec is: <%~ it.read(".gtd/NEXT.md") %>
          <% let scope; try { scope = it.read(".gtd/SPEC_SCOPE.md") } catch (e) { scope = undefined } %><% if (scope) { %>
          - A pre-judge already found the other sections satisfied. Confine
            your review to only these sections: <%~ scope %>
          <% } %>
          - Verify the implementation against it: tasks done, criteria
            met, code sound and consistent with the codebase. No diff is
            given — read the range yourself, from `<%= it.startCommit %>`
            to the working tree, process-wide (it can span earlier
            packages)
          - You own that bar; nothing downstream re-weighs your findings
          - Write nothing when the package fully satisfies its spec —
            silence is your approval. Otherwise write
            `.gtd/SPEC_FEEDBACK.md` listing what would violate the spec if
            it shipped unaddressed, specific enough to act on, each as its
            own `## ` heading
          - Never fix anything yourself and never delete the package
            file — a later step owns that
        on:
          "A .gtd/SPEC_FEEDBACK.md": $onFix
          "M .gtd/SPEC_FEEDBACK.md": $onFix
          "D .gtd/SPEC_FEEDBACK.md": $onApproved
          "C": $onApproved

  # The per-package build queue — identity-free; build identity lives in
  # packageItem (below).
  packageLoop:
    params: [onDrained]
    entry: picking
    states:
      picking:
        actor: check
        label: Picking the next package
        script: |
          #!/usr/bin/env sh
          # Mechanics only — NEXT.md's presence/absence is interpreted by
          # the `on` rows below, never here.
          set +e
          mkdir -p .gtd
          # Sweep spent design/architecture steering files (gone by now), any
          # REVIEW_RAW.md the review loop-back left behind, and the quality
          # lap's own state (its queue, its picked lens, its findings and
          # markers) — the only sweeper on that path before any of these
          # would leak into a later `gtd summary` prompt's diff range. A
          # feedback loop-back therefore clears `.gtd/QUALITY_DONE.md` too,
          # re-running the whole lap.
          rm -f .gtd/REQUIREMENTS.md .gtd/ARCHITECTURE.md .gtd/QUESTIONS.md .gtd/REVIEW_RAW.md .gtd/NEXT_REVIEW.md .gtd/QUALITY*.md
          rm -rf .gtd/reviews
          # Names are gtd-authored, never containing whitespace — safe to
          # disable SC2012.
          # shellcheck disable=SC2012
          next=$(ls .gtd/packages/*.md 2>/dev/null | head -n 1)
          if [ -n "$next" ]; then
            printf '%s' "$next" > .gtd/NEXT.md
          else
            rm -f .gtd/NEXT.md
          fi
        on:
          "D .gtd/NEXT.md": $onDrained
          "* .gtd/NEXT.md": item.building
          "C": $onDrained

      # Its own coder machine (below) keeps `packages` itself a single state.
      item:
        machine: packageItem
        with:
          onNext: picking

  # The per-package build identity. ▸ coder identity. packages.item.closing
  # -> picking is the one upward-resolving target in the file, hence $onNext.
  packageItem:
    model: <%= it.vars.coderModel %>
    system: |-
      <%~ it.vars.builderPersona %>


      <%~ it.vars.agentConduct %>
    params: [onNext]
    entry: building
    states:
      building:
        actor: agent
        label: Building
        skills: <%= it.vars.buildSkills %>
        prompt: |
          <%~ it.vars.stateFileRules %>

          - The only state file this turn may write is `.gtd/SATISFIED.md`;
            never delete the package file (the spec-review gate reads it
            after you) or touch `.gtd/NEXT.md` — `picking` owns it
          - The package to implement is: <%~ it.read(".gtd/NEXT.md") %>
          - First check its acceptance criteria against the current tree —
            an earlier fix turn may already satisfy them. If **every**
            criterion is met, implement nothing: write `.gtd/SATISFIED.md`
            with each criterion's concrete evidence (commit, file, or
            symbol), change nothing else, and finish. Otherwise implement
            normally and skip that file
          - Implement every task the package describes, no more, no less,
            fanning independent ones out to parallel subagents where your
            harness supports it; leave other package files untouched
          - Leave the package file in place, everything uncommitted, then
            finish your turn
        on:
          "A .gtd/SATISFIED.md": &satisfied
            to: health.check
            action: Close as already satisfied
            describe: >-
              record per-criterion evidence in .gtd/SATISFIED.md when this
              package's work already landed (an earlier package's fix turn
              pulled it in) — the package still runs the checks and the spec
              review, then closes out.
          "M .gtd/SATISFIED.md": *satisfied
          "* **": health.check

      fix-suite:
        actor: agent
        label: Fixing the check
        file: FEEDBACK.md
        skills: <%= it.vars.fixSkills %>
        prompt: |
          <%~ it.vars.stateFileRules %>

          <%~ it.vars.fixFeedbackPrompt %>

          - If the only way to green the suite is another package's work,
            make the smallest change that gets there — that package can
            then legitimately report itself already satisfied later
          - Leave everything uncommitted and finish your turn — do not commit
        retry:
          max: 3
          otherwise: health.escalate
        on:
          "* **": health.check

      fix-spec:
        actor: agent
        label: Fixing review feedback
        file: SPEC_FEEDBACK.md
        skills: <%= it.vars.reviewFixSkills %>
        prompt: |
          <%~ it.vars.stateFileRules %>

          - The only state file this turn touches is
            `.gtd/SPEC_FEEDBACK.md` — address it, then delete it
          - Read it (the reviewer's concerns) and the package spec
            (`<%= it.read(".gtd/NEXT.md") %>`), then fix the code to
            resolve every concern
          - Delete `.gtd/SPEC_FEEDBACK.md` once resolved; leave everything
            else uncommitted and finish your turn
        on:
          "* **": health.check

      closing:
        actor: check
        label: Closing out the package
        script: |
          #!/usr/bin/env sh
          # Removes the just-reviewed package file (path in NEXT.md) plus
          # leftover spec feedback/evidence, so picking selects the next.
          # Reached only on spec-review approval — that loop carries no retry
          # cap, so there is no force-close path here.
          set +e
          pkg=$(cat .gtd/NEXT.md 2>/dev/null)
          [ -n "$pkg" ] && rm -f "$pkg"
          rm -f .gtd/SPEC_FEEDBACK.md .gtd/SPEC_SCOPE.md .gtd/SPEC_CLEARED.md .gtd/NEXT.md .gtd/SATISFIED.md
        on:
          "* **": $onNext
          # Nothing left to sweep (an already-clean NEXT.md/package) still
          # needs to proceed to the next package, not stall here.
          "C": $onNext

      health:
        machine: healthGate
        with:
          onGreen: spec
          onRed: fix-suite
          checkLabel: Running checks
          escalateLabel: Escalating to a human

      spec:
        machine: specReview
        with:
          onApproved: closing
          onFix: fix-spec

  # The qualitative review lap — one dimension per turn, each its own fresh
  # context (a gtd state invocation IS a separate context window). `seeding`
  # and `picking` are `check` (mechanics only); `reviewing` is `prompt` (the
  # one turn that judges). ▸ planner identity — reviewing is a planner turn,
  # not a coder one; the fix turn lives in buildTail instead (see its
  # `fix-quality`), so this machine stamps no coder model/system anywhere.
  qualityReview:
    model: <%= it.vars.plannerModel %>
    system: |-
      <%~ it.vars.reviewerPersona %>


      <%~ it.vars.agentConduct %>
    params: [onClean, onFindings]
    entry: seeding
    states:
      # Short-circuits on `.gtd/QUALITY_DONE.md` — without it, `build.health`'s
      # green route re-enters this lap forever, since both `build.fix` and
      # `fix-quality` hand back to `build.health.check`. The guard is per
      # EPISODE: written once by `picking` when the queue drains, swept only
      # on the feedback loop-back path (`packageLoop.picking`'s sweep).
      # `seeding`'s script below interpolates `<%~ it.vars.qualityReviews %>`
      # raw into a `list="..."` shell assignment, run with `sh -c` — a value
      # containing `$(...)` or a backtick executes. Accepted: a repository's
      # own gtd config (`.gtdrc`, `GTD_QUALITYREVIEWS`) is TRUSTED input —
      # `testCommand` already reaches `sh -c` raw by design (it IS a command
      # line), so a config that could set `qualityReviews` could already set
      # `testCommand` to anything. This reaches a shell deliberately.
      seeding:
        actor: check
        label: Seeding the quality review queue
        script: |
          #!/usr/bin/env sh
          set +e
          [ -f .gtd/QUALITY_DONE.md ] && exit 0
          mkdir -p .gtd/reviews
          i=1
          list="<%~ it.vars.qualityReviews %>"
          IFS=,
          for name in $list; do
            trimmed=$(printf '%s' "$name" | sed 's/^ *//; s/ *$//')
            if [ -n "$trimmed" ]; then
              printf '%s' "$trimmed" > "$(printf '.gtd/reviews/%02d-%s.md' "$i" "$trimmed")"
              i=$((i + 1))
            fi
          done
        on:
          "* .gtd/reviews/**": picking
          "C": $onClean
      # The `ls .gtd/reviews/*.md | head -n 1` idiom `packageLoop.picking`
      # already uses — draining its own queue is what ends the loop; the
      # reviewer never touches `.gtd/reviews/` itself.
      picking:
        actor: check
        label: Picking the next quality lens
        script: |
          #!/usr/bin/env sh
          set +e
          # Names are gtd-authored, never containing whitespace — safe to
          # disable SC2012.
          # shellcheck disable=SC2012
          next=$(ls .gtd/reviews/*.md 2>/dev/null | head -n 1)
          if [ -n "$next" ]; then
            cp "$next" .gtd/NEXT_REVIEW.md
            rm -f "$next"
          else
            rm -f .gtd/NEXT_REVIEW.md
            : > .gtd/QUALITY_DONE.md
            if [ -s .gtd/QUALITY.md ]; then
              : > .gtd/QUALITY_READY.md
            fi
          fi
        # First-match-wins ordering is what routes a drained-with-findings
        # turn (whose diff carries the queue deletions AND both markers) to
        # the fix turn rather than the clean exit.
        on:
          "A .gtd/NEXT_REVIEW.md": reviewing
          "M .gtd/NEXT_REVIEW.md": reviewing
          "A .gtd/QUALITY_READY.md": $onFindings
          "* **": $onClean
          "C": $onClean
      reviewing:
        actor: agent
        label: Reviewing (one quality lens)
        file: NEXT_REVIEW.md
        skills: <%~ it.read(".gtd/NEXT_REVIEW.md").trim() %>
        prompt: |
          <%~ it.vars.stateFileRules %>

          - The only state file this turn writes is `.gtd/QUALITY.md` — no
            other files for notes or output
          - Review the whole assembled change, from `<%= it.startCommit %>`
            to the working tree, through this ONE quality lens only — the
            lens is named in `.gtd/NEXT_REVIEW.md`, already loaded as this
            turn's own skill
          - Where you find something blocking, APPEND a `## ` chunk to
            `.gtd/QUALITY.md` describing it — never overwrite what an
            earlier dimension already wrote there
          - Write nothing when nothing is blocking under this lens — a
            clean turn IS this dimension's approval
          - Touch no other state file, and leave everything uncommitted
        on:
          "* **": picking
          "C": picking

  # The process's build identity. ▸ coder identity — model/system stamped
  # onto fix.
  buildTail:
    model: <%= it.vars.coderModel %>
    system: |-
      <%~ it.vars.finisherPersona %>


      <%~ it.vars.agentConduct %>
    params: [onDone, onFeedback]
    # entry: is required by the machine grammar even though nothing resolves
    # this machine bare; `fix` is an arbitrary pick.
    entry: fix
    states:
      fix:
        actor: agent
        label: Fixing the check
        file: FEEDBACK.md
        skills: <%= it.vars.fixSkills %>
        prompt: |
          <%~ it.vars.stateFileRules %>

          <%~ it.vars.fixFeedbackPrompt %>

          - Leave everything uncommitted — do not commit
        retry:
          max: 3
          otherwise: health.escalate
        on:
          "* **": health.check

      health:
        machine: healthGate
        with:
          onGreen: quality
          onRed: fix
          checkLabel: Running checks
          escalateLabel: Escalating to a human

      # Sits ahead of the whole humanReview machine, never inside it, so
      # every round reaching this point pays for the lap before a human ever
      # sees the review — there is no verdict anywhere upstream that could
      # skip it.
      quality:
        machine: qualityReview
        with:
          onClean: review
          onFindings: fix-quality

      # A sibling of `fix`, not a state inside `qualityReview`: a machine
      # stamps one `model:`/`system:` on every state it owns, and reviewing
      # is a planner turn while fixing is a coder turn. The split also lets
      # `health.check`/`health.escalate` resolve as plain local targets —
      # targets never resolve upward in this workflow.
      fix-quality:
        actor: agent
        label: Fixing quality findings
        file: QUALITY.md
        skills: <%= it.vars.reviewFixSkills %>
        prompt: |
          <%~ it.vars.stateFileRules %>

          - Read `.gtd/QUALITY.md` — one `## ` chunk per quality dimension
            that found something blocking. Merge duplicate findings across
            dimensions FIRST, then fix every chunk
          - Delete `.gtd/QUALITY.md` and `.gtd/QUALITY_READY.md` once every
            finding is resolved
          - Leave everything else uncommitted and finish your turn
        retry:
          max: 3
          otherwise: health.escalate
        on:
          "D .gtd/QUALITY.md": health.check
          "* **": fix-quality
          "C": fix-quality

      # Nested here (not root) so the sign-off's boundary commit stays inside
      # the builder's own scope — see humanReview above.
      review:
        machine: humanReview
        with:
          onSignoff: $onDone
          onFeedback: $onFeedback

  # WIRING ONLY — the root ties together the machine tree above.
  unified:
    entry: idle
    states:
      idle:
        actor: human
        label: Idle
        file: TODO.md
        message: |
          No active gtd process.

          To start one, make ANY change — a hand-edit to real code, a scratch
          note, anything at all. .gtd/TODO.md is a good default
          place to start sketching. gtd treats it as a SKETCH, not finished
          work: the very next beat unwinds it out of your working tree (its
          intent survives in history, for the triage phase to read), then
          checks the test baseline is green, then triages the reverted diff
          into ordered, classified concerns: product questions, then
          technical questions, then one package per concern, built and
          reviewed in parallel.

          What each change does next (then run `gtd land`):
          <% it.edges.forEach(function (e) { if (e.describe) { %>
          <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
          <% } }) %>
        on:
          "* **":
            to: unwind
            action: Start
            describe: >-
              make any change — gtd unwinds it out of your working tree (its
              intent survives in history) before checking the test baseline is
              green, then triages the reverted diff into ordered, classified
              concerns and resolves product questions, then technical ones,
              before building each concern's package (**unwind** ->
              **start-gate.check**).

      # --entry fix-precheck: a red suite drops into build.fix (-> health ->
      # review tail); a green suite is a no-op back to idle.
      fix-precheck:
        actor: check
        label: Checking the baseline
        entry: true
        script: *suiteCheck
        on:
          "A .gtd/FEEDBACK.md": build.fix
          "M .gtd/FEEDBACK.md": build.fix
          "D .gtd/REVIEW_RAW.md": idle
          "D .gtd/FEEDBACK.md": idle
          "C": idle

      # Separate from start-gate.check: that gate's blocked -> check retry
      # edge would otherwise re-run a revert here and discard a human's
      # baseline repair. One inbound edge (from idle) means unwind runs
      # exactly once, so it needs no idempotence guard itself.
      unwind:
        actor: check
        label: Unwinding your input
        script: |
          #!/usr/bin/env sh
          set +e
          mkdir -p .gtd
          # Hoisted here, at the TOP: Eta's autoTrim eats the newline after
          # an interpolation tag, so no tag may be the last token on a line.
          # Uses it.currentCommit (render-time), not bare HEAD, so a
          # late-running driver still reverts the right commit.
          commit="<%~ it.currentCommit %>"
          git revert --no-commit "$commit" 2> .gtd/.unwind-error
          code=$?
          # The revert's EXIT CODE is what separates a genuine no-op from a
          # hard failure (e.g. a merge commit with no `-m`) — the diff alone
          # cannot, since both can leave a clean tree. Turning the failure
          # into a FEEDBACK.md write is what makes the `C` row below safe:
          # once a failure always has a diff, a clean tree here means the
          # revert really did succeed and change nothing.
          if [ "$code" -ne 0 ]; then
            printf 'gtd could not unwind %s out of your working tree.\n\n' "$commit" > .gtd/FEEDBACK.md
            if [ -s .gtd/.unwind-error ]; then
              cat .gtd/.unwind-error >> .gtd/FEEDBACK.md
            else
              printf '`git revert --no-commit` exited %s and produced no output.\n' "$code" >> .gtd/FEEDBACK.md
            fi
          fi
          rm -f .gtd/.unwind-error
        on:
          "A .gtd/FEEDBACK.md": unwind-failed
          "M .gtd/FEEDBACK.md": unwind-failed
          "* **": start-gate
          "C": start-gate

      # Reached only when the revert above exited non-zero. A human repairs
      # the tree by hand; start-gate.check clears FEEDBACK.md on its way
      # green, so nothing has to sweep it here.
      unwind-failed:
        actor: human
        label: Could not unwind your input
        file: FEEDBACK.md
        message: |
          gtd could not revert your sketch out of the working tree.
          `.gtd/FEEDBACK.md` holds the error.

          Undo the sketch by hand (its intent survives in history either
          way), then continue — gtd will not start work on a tree that still
          carries it.

          What each change does next (then run `gtd land`):
          <% it.edges.forEach(function (e) { if (e.describe) { %>
          <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
          <% } }) %>
        on:
          "* **":
            to: start-gate
            action: Continue
            describe: >-
              having undone the sketch by hand, check the test baseline is
              green and start triage (**start-gate.check**).

      # Reverts the human's own review-round hand-edit before re-planning,
      # scoped to real code (`.gtd/` excluded — REVIEW.md is already gone by
      # now). Names the commit via it.reviewBase (reviewBaseFor's own
      # `await-review -> deciding` commit), never bare HEAD.
      #
      # requireRevert (below) re-checks the tree itself and refuses the step
      # if residue remains, rather than trusting the script's exit code — a
      # clean-filter round-trip or binary path can make `git apply -R` a
      # silent no-op. Both `on` rows below target `design`: a hand-edited
      # round leaves a dirty tree, a note-only round's patch is empty and
      # leaves the tree clean — both are legitimate outcomes here, not a
      # stall.
      #
      # `file: REVIEW.md` + `requireRevert: true` exist only to give that
      # guard the path to exempt (it reads Rest.hints.file, never this
      # literal) — REVIEW.md is already gone two commits earlier, so this
      # state never renders it.
      re-unwind:
        actor: check
        label: Re-unwinding your review edit
        file: REVIEW.md
        requireRevert: true
        script: |
          #!/usr/bin/env sh
          # Scoped revert of the human's review-round edit — .gtd/ excluded
          # (the guard's isCodePath re-derives the same exemption; keep both
          # in sync). Expected to succeed; requireRevert catches a silent
          # apply failure.
          set +e
          # Hoisted here, at the TOP: Eta's autoTrim eats the newline after
          # an interpolation tag, so no tag may be the last token on a line.
          commit="<%~ it.reviewBase %>"
          patch=.gtd/.re-unwind.patch
          mkdir -p .gtd
          git diff --binary "$commit^" "$commit" -- . ":(exclude).gtd" > "$patch"
          if [ -s "$patch" ]; then
            git apply -R "$patch" || echo "re-unwind: could not revert $commit" >&2
          fi
          rm -f "$patch"
        on:
          "* **": design # a code hand-edit was reverted
          "C": design # note-only round: nothing to revert

      start-gate:
        machine: entryGate
        with:
          onGreen: design
          reviewBase: ""
          blockedMessage: |
            The test baseline is red — gtd will not start new work on a broken suite.
            `.gtd/FEEDBACK.md` holds the failing output.

            What each change does next (then run `gtd land`):
            <% it.edges.forEach(function (e) { if (e.describe) { %>
            <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
            <% } }) %>
          blockedDescribe: >-
            edit the code and/or `.gtd/FEEDBACK.md` to fix the failing tests
            (**start-gate.check**). To repair the baseline as its own separate
            reviewed commit instead, abandon this start and run
            `gtd --entry fix-precheck` from a clean `idle`.
          checkLabel: Checking the baseline
          blockedLabel: Baseline is red

      review-gate:
        machine: entryGate
        with:
          onGreen: build.review
          reviewBase: <%= it.vars.reviewBase %>
          blockedMessage: |
            The test baseline is red — gtd will not start a review on a broken suite.
            `.gtd/FEEDBACK.md` holds the failing output.

            What each change does next (then run `gtd land`):
            <% it.edges.forEach(function (e) { if (e.describe) { %>
            <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
            <% } }) %>
          blockedDescribe: >-
            edit the code and/or `.gtd/FEEDBACK.md` to fix the failing tests
            (**review-gate.check**).
          checkLabel: Checking the baseline
          blockedLabel: Baseline is red

      design:
        machine: designPlan
        with:
          onArchitecture: architecture-pre

      # Judges whether `.gtd/REQUIREMENTS.md` — the committed artifact
      # `design.triage` just settled — warrants a dedicated architecture
      # pass, never an ex-ante complexity score off the bare `.gtd/TODO.md`
      # (that has no committed artifact to judge, and would break the
      # evidence rule every other judge state in this file follows). A
      # single fixed noul, so `routes:` is the right tool here.
      architecture-pre:
        actor: judge
        label: Judging whether this plan warrants an architecture pass
        message: |
          Judging whether `.gtd/REQUIREMENTS.md`'s settled concerns need a
          dedicated architecture pass — real structural decisions, multiple
          integration points, or a non-obvious tradeoff — before packages
          are written. Run `gtd judge answer` and pipe a verdict for
          `architectureWarranted` — or land untouched to run the full pass
          (the conservative default; a skipped judgment never suppresses
          it).
        judge: |-
          {"state": {"requirements": <%~ JSON.stringify(it.tail(".gtd/REQUIREMENTS.md", 1)) %>}, "questions": [
            {"id": "architectureWarranted", "primitive": "noul", "instructions": "Given the settled concerns in `.gtd/REQUIREMENTS.md` (in state), does this plan warrant a dedicated architecture pass — real structural decisions, multiple integration points, or a non-obvious tradeoff — before packages are written?", "criteria": "Answer yes if uncertain; a trivial, single-concern, mechanical plan with no real design decision answers no."}
          ]}
        routes:
          - question: architectureWarranted
            is: "no"
            minP: <%~ it.vars.architectureSkipMinP %>
            to: architecture-promote
          - to: architecture
        on:
          "C": architecture
          "* **": architecture

      # The skip path: promotes `.gtd/REQUIREMENTS.md` wholesale into a
      # SINGLE `.gtd/packages/01-<slug>.md` before the queue is entered —
      # never split, `architecture.decompose`'s own job, skipped here.
      # Without this, skipping `architecture.decompose` would leave
      # `.gtd/packages/` empty, so `packageLoop.picking` would match its
      # `"C"` row, route `$onDrained`, and the process would close having
      # built nothing.
      architecture-promote:
        actor: check
        label: Promoting the plan straight to a package
        script: |
          #!/usr/bin/env sh
          set +e
          # `architecture-pre`'s judged "no" was answered against a
          # `it.tail(".gtd/REQUIREMENTS.md", 1)`-bound payload — a plan over
          # judgeBudgetBytes can have structural concerns cut away from the
          # TOP before the judge ever saw them, and still clear
          # architectureSkipMinP confidently. The truncation is refused
          # here, however confident that "no" was: on a truncated landing
          # commit, this script does nothing at all — no `it.sections`
          # heading rescue is attempted, since a fence straddling the cut
          # boundary can mis-parse as a top-level heading (the same hazard
          # `packages.item.spec.pre`/`build.review.triage` avoid the same
          # way) — and the clean tree makes the "C" row below reachable,
          # routing to the full architecture pass instead of a false
          # promotion.
          if git log -1 --format=%B HEAD | grep -q 'Gtd-Payload: {"truncated":true}'; then
            exit 0
          fi
          mkdir -p .gtd/packages
          title=$(awk '/^```/{f=!f} !f && /^## /{sub(/^## /,""); print; exit}' .gtd/REQUIREMENTS.md)
          [ -z "$title" ] && title=package
          slug=$(printf '%s' "$title" | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]\{1,\}/-/g; s/^-*//; s/-*$//')
          [ -z "$slug" ] && slug=package
          mv .gtd/REQUIREMENTS.md ".gtd/packages/01-${slug}.md"
        on:
          "* **": packages
          # Reachable now: a truncated payload's refusal above leaves the
          # tree clean, routing here into the full architecture pass instead
          # of a false promotion.
          "C": architecture

      architecture:
        machine: archPlan
        with:
          onPackages: packages

      packages:
        machine: packageLoop
        with:
          onDrained: build.review

      build:
        machine: buildTail
        with:
          onDone: idle
          onFeedback: re-unwind
