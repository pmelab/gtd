# The unified gtd workflow template — gtd's BUILT-IN DEFAULT workflow. When no
# `workflow:` key is configured anywhere in the cwd→home config chain,
# src/Config.ts runs this template directly, so a state command works with no
# configuration at all. `gtd init` seeds only the settings a project tunes
# (vars.testCommand + a modes: formatting suggestion), never the workflow
# itself. See the README's "How it works" and "Driving the loop" sections for
# the full walkthrough.
#
# Compiled through the exact same `compileWorkflowConfig` a user's `.gtdrc`
# `workflow:` key goes through — no privileged code path
# (src/workflows/templates.ts does the compiling). Every content string below
# is INLINE (no `./`-relative file references): the bundled template ships
# inside a single-file build (`dist/gtd.bundle.mjs`), so its content must
# already be resolved at BUILD time. `renderInitConfig` (src/workflows/
# templates.ts) can MATERIALIZE this raw source into a `.gtdrc.json`
# `workflow:` value — the way to eject/customize the machine, and the hermetic
# test fixture — but `gtd init` itself no longer writes the workflow.
#
# ── Authored with MACHINES (entry:/machines:) ───────────────────────────────
#
# This template is written as a tree of reusable, parameterized MACHINES (see
# src/Machines.ts) — a gate/loop written once and instantiated several times
# with different `with:` bindings (dedup), or a complex cluster grouped under
# one name for source comprehension (encapsulation). Every reference below is
# an ordinary `{ machine: <name>, with: { ... } }` local, expanded at
# compile-time into concrete, qualified states before the pure engine ever
# sees the definition — no runtime footprint.
#
# MACHINE BOUNDARIES LINE UP WITH CONVERSATIONAL IDENTITY: a machine that holds
# an identity (a planner or a coder persona) declares its own `model:` ONCE, at
# the machine level (stamped onto every one of its own `prompt` states — see
# src/Machines.ts's `resolveInstanceModel`), instead of repeating `model:` on
# every state; no state anywhere declares `model:` or `memory:` directly any
# more (the memory key is computed from the machine tree — see
# src/PatternMachine.ts's `memoryScopeAt` / src/Edge.ts's `memoryKeyFor`).
#
#   * entryGate (dedup ×2)    — the green-baseline gate (check + human blocked)
#                               guarding the single start (`start-gate`) and
#                               the review (`review-gate`) entries. Its check
#                               script IS the shared `&suiteCheck` anchor
#                               (also aliased by `fix-precheck`, outside this
#                               machine) — every entry blocks on any red tree,
#                               full stop; there is no baseline-aware second
#                               run any more, since `unwind` (below) already
#                               put the tree back to the baseline before this
#                               gate ever runs. Identity-free.
#   * healthGate (dedup ×2)   — the check/escalate health pair shared by the
#                               build tail's own tail (`build.health.*`) and
#                               the per-package build's own tail
#                               (`packages.item.health.*`) — each caller's OWN
#                               `fix` state (a coder-identity action) lives
#                               beside this machine, not inside it, since
#                               fixing IS a coder action and this machine has
#                               no identity of its own. Identity-free.
#   * questionGate (dedup ×2) — the check/answer pair shared by the design and
#                               architecture phases' own open-questions gate
#                               (`design.gate.*` / `architecture.gate.*`): a
#                               shared probe script decides whether the
#                               phase's steering file still has unanswered
#                               questions, and only then rests the process at
#                               a human answer gate. Identity-free.
#   * designPlan (encap)      — the triage phase's one conversation: group the
#                               diff that started the process into ordered,
#                               classified concerns and resolve the PRODUCT
#                               ones' open questions (`design.*`: triage,
#                               gate.check, gate.answer). ▸ planner.
#   * archPlan (encap)        — the technical phase's one conversation: a COLD
#                               read of the settled concerns, resolving the
#                               TECHNICAL open questions, then a mechanical
#                               decomposition into package files
#                               (`architecture.*`: author, gate.check,
#                               gate.answer, decompose). A separate machine
#                               from `designPlan` (not one fused machine) —
#                               its own memory scope, since there may be a
#                               handover between the user-facing and the
#                               technical phase. ▸ planner.
#   * humanReview (encap)     — the shared review tail, nested INSIDE
#                               `buildTail` (`build.review.*`: reviewing →
#                               await-review → deciding → collecting) — see
#                               "Why humanReview is nested, not a root sibling"
#                               below. ▸ planner — `collecting` only judges
#                               whether the round is actionable; there is no
#                               coder-identity follow-through inside this
#                               machine any more (see the root's own
#                               `re-unwind` state).
#   * specReview (encap)      — the per-package agentic review, a SINGLE
#                               state (`packages.item.spec.review`) — a
#                               machine whose entire job is to be a separate
#                               mind from the implementer. ▸ planner — fixing
#                               the reviewer's own findings is a coder action,
#                               so it lives in `packages.item.fix-spec`
#                               instead.
#   * packageLoop (encap)     — the per-package build queue
#                               (`packages.picking`). Identity-free — the
#                               actual per-package build identity lives in its
#                               own `item` child (packageItem, below).
#   * packageItem (encap)     — the per-package build identity (`packages.
#                               item.*`: building, fix-suite, fix-spec,
#                               closing), plus its own `health` and `spec`
#                               children. ▸ coder.
#   * buildTail (encap)       — the process's build identity (`build.*`:
#                               squashing, fix), plus its own `health` child
#                               AND its own `review` child
#                               (humanReview, above). No monolithic "build the
#                               whole plan" state any more — every package is
#                               built inside `packages.item`, and the queue
#                               drains straight into `build.review`. ▸ coder.
#
# ── Why humanReview is nested, not a root sibling ───────────────────────────
#
# `humanReview` sits UNDER `buildTail` (`build.review`) rather than beside it
# at the root, because a machine's memory scope is its dotted instance path
# (see src/PatternMachine.ts's `memoryScopeAt`): entering a DESCENDANT scope
# never breaks the parent's unbroken run, but entering a sibling does. On the
# ORDINARY path (packages -> build.review -> squashing) that buys nothing —
# `build`'s own scope has no prior turn to resume, since every package is
# built inside `packages.item` instead. The one concrete case where it
# matters is `gtd --entry fix-precheck`: a red suite drops into `build.fix`,
# which opens `build`'s own scope, and the whole run from there —
# `build.fix` -> `build.health.check` -> `build.review.*` -> `build.squashing`
# — stays inside that one subtree, so `build.squashing` drafts the finale
# from the SAME session that made the fixes, instead of a root-level sibling
# forcing it to re-derive the range from scratch on every pass through the
# tail. That one benefit is worth keeping over hoisting `humanReview` back to
# a root sibling, which would otherwise be a repo-wide rename with no
# behavioural gain. (The OTHER coder turn a feedback round used to resume —
# the implementer's own follow-through on review feedback — is retired
# outright: a hand-edit made during review is now re-planned from scratch via
# the root's own `re-unwind` state, never built upon, so there is no
# continuity to preserve on that path any more.)
# The reviewer itself is unaffected either way: `build.review.*` is its own
# scope regardless of where it's nested, so it never resumes the builder's
# session.
#
# ── One flow: triage into concerns, then packages, then the shared tail ────
#
# ANY change to the tree starts the process — a hand-edit to real code, a
# scratch note, anything at all — because it's a SKETCH, not finished work:
# there is no fork on which steering file the human happened to create;
# `idle` has exactly one outgoing edge, into `unwind`, which reverts that
# whole diff back out of the working tree before planning starts (its intent
# survives in history for `design.triage` to read; the squash finale means it
# never reaches the final commit either way). `unwind` itself has exactly one
# outgoing edge, into `start-gate`.
#
# EVERY entry gates on a green baseline before proceeding, and all three now
# keep the exact same plain rule: block on any red tree, full stop. A red run
# at any of them halts at a human blocked gate (fix the failures and re-run,
# exactly like the escalate states). `start-gate` needs no baseline-aware
# second run any more — by the time it runs, `unwind` has already put the
# tree back to the baseline, so ONE suite run there IS the baseline verdict.
#
# Once green, `design.triage` reads the diff that started the process (never
# rendered into the prompt — it names the start commit and reads the range up
# to the unwind commit itself) and groups it into an ORDERED list of
# CONCERNS, each one leaving the suite green on its own, classifying each as
# PRODUCT or TECHNICAL. It raises open questions for the product ones only,
# and folds EVERYTHING the start diff added into the concerns — a scratch
# sketch and a real hand-edit alike, since `unwind` already emptied the tree
# of both; nothing is left to delete. `design.gate` is a shared check+answer
# pair: its check probes `requirementsFile` for unanswered questions and only
# rests the process at a human answer gate when some remain — a
# question-free phase skips the human stop entirely.
#
# Once the product questions are settled, `architecture.author` picks up as a
# COLD reader (a separate machine, a separate memory scope — it reads
# `requirementsFile` in full rather than resuming design's conversation),
# develops the *how* for each settled concern, and raises only TECHNICAL open
# questions — routed through the same shared `questionGate` shape
# (`architecture.gate`) over `architectureFile`. Once those are settled,
# `architecture.decompose` is a purely mechanical write-out: one package file
# per concern, in the settled order — no merge/split judgement, since that
# already happened in triage's grouping.
#
# From there the per-package build queue (`packages.*`) and the shared review
# + squash tail (`build.*`) are UNCHANGED from before this restructure — see
# their own machine doc comments below for the per-package build/review/
# health mechanics.
#
# A second entry, `gtd --entry review-gate.check`, jumps there directly and,
# once green, to `build.review.reviewing` to review a foreign branch through
# the same shared tail. A third, `gtd --entry fix-precheck`, jumps there: a
# red suite drops straight into the shared `build.fix` loop and out through the
# review + squash tail; a green suite is a no-op back to `idle`. Both states
# declare `entry: true` — otherwise unreachable from `entries.default`.
#
# All entries converge at `build.review.reviewing` -> `build.review.await-review`.
# Ticking a REVIEW.md box means only "I reviewed this hunk"; a COMMENT (not an
# unticked box) is what asks for changes. Every human step at
# `build.review.await-review` goes to `build.review.deciding`, which CAPTURES
# the raw material (never interprets it) and routes on the step's shape —
# THREE edges out of the review tail, not one:
#   * the SIGN-OFF edge: no comment at all (every box ticked, no REVIEW.md
#     note, no code edit) -> the diff is a bare REVIEW.md deletion ->
#     build.squashing -> done (the whole process collapses into one commit).
#   * the NON-ACTIONABLE edge: some comment exists, but `build.review.collecting`
#     judges it non-actionable (the human left only an approving remark, e.g. a
#     compliment with no code edit and no substantive note) -> CONSUMES the raw
#     capture (deletes it, the only change this turn) -> straight to
#     build.squashing too, WITHOUT spending a design lap producing nothing, and
#     with nothing left over to leak into the finale. The outcome is encoded by
#     which paths `collecting`'s own diff touches, never by a sentinel a file
#     pattern can't tell apart from real content — and never by a CLEAN turn
#     either, which stays the ordinary fruitless-dispatch attempt (no `C` row
#     here), not a verdict.
#   * the ACTIONABLE edge: `collecting` judges the round actionable (a note in
#     REVIEW.md, or a hand-edit to code) -> marks the raw capture (a real
#     edit) -> the root's own `re-unwind` state reverts the human's
#     review-round commit out of the working tree, scoped to real code (never
#     the review file, already gone, and never `stateDir`) -> `design.triage`
#     re-derives the work from that history as intent only — the human's
#     hand-edit is a SKETCH to be re-planned, never built upon. This is a full
#     development lap (triage -> gate -> architecture -> gate -> packages ->
#     build.review again), not a quick fix-and-re-review; there is no
#     baseline check on the way back in (`re-unwind` is not an entry, so
#     `entryGate` never runs on this path).
# Two dead ends never commit: the review-signoff guard (src/StepGuards.ts)
# REFUSES a step that leaves a box unticked with no comment (finish reviewing
# first) and a deleted REVIEW.md (restore it and tick the boxes).
#
# The shared health pair (`build.health.check`/`.escalate`, plus its own
# `build.fix`) no longer serves a feedback loop at all — with the implementer's
# own coder-identity follow-through retired, the only edge into it is
# `gtd --entry fix-precheck`'s red branch; they are not dead code, just
# reachable from one place instead of two. The
# per-package loop keeps its OWN health pair (`packages.item.health.check`/
# `.escalate`, plus `packages.item.fix-suite`) because its green edge targets
# the per-package `packages.item.spec.review` gate instead.
#
# Every `on` pattern's path below is written as the matching var's Eta
# template (e.g. `"A <%= it.vars.feedbackFile %>"`), not a literal `.gtd/...`
# path — repointing a var reroutes the machine along with every template that
# reads/writes it (see the README's "Variables" section).

vars:
  testCommand: npm test
  # Where gtd keeps its own scratch/bookkeeping (the check scripts' temp output
  # file, review-deciding's state-file exclusion). Independent of the per-file
  # vars below — relocating a file wholesale means setting both.
  stateDir: .gtd
  # The only per-file var gtd never writes and never reads — the human's own
  # sketch pad, named so the one "open steering file" keybinding has an
  # answer at `idle` too.
  todoFile: .gtd/TODO.md
  requirementsFile: .gtd/REQUIREMENTS.md
  architectureFile: .gtd/ARCHITECTURE.md
  # Stamped (never authored, never read for its content) by design.gate.check
  # / architecture.gate.check — its mere presence is the routing signal that
  # the current phase's steering file still has unanswered questions.
  questionsFile: .gtd/QUESTIONS.md
  packagesDir: .gtd/packages
  nextFile: .gtd/NEXT.md
  # Written by packages.item.building when a package's acceptance criteria are
  # already met (an earlier package's fix turn pulled the work in); read by
  # the spec reviewer as the evidence a clean turn there is a real approval,
  # not a lazy/crashed one; removed by packages.item.closing.
  satisfiedFile: .gtd/SATISFIED.md
  reviewFile: .gtd/REVIEW.md
  reviewRawFile: .gtd/REVIEW_RAW.md
  feedbackFile: .gtd/FEEDBACK.md
  specFeedbackFile: .gtd/SPEC_FEEDBACK.md
  commitMsgFile: .gtd/COMMIT_MSG.md
  # The two opaque model tiers every agent state draws from — repoint them here
  # (or via a top-level `.gtdrc` `vars:` key / a `GTD_PLANNERMODEL` env var)
  # to change every state on that tier at once. `plannerModel` (default "smart")
  # is the heavier tier for the one-shot triage/design/review turns;
  # `coderModel` (default "base") is the tier for the build/fix turns.
  plannerModel: smart
  coderModel: base
  # The fixed diff base for `gtd --entry review-gate.check --var
  # reviewBase=<commitish>` — a plain non-gtd branch reviewed against that
  # commitish rather than the process start. Declared here (rather than left
  # undeclared) so `--var reviewBase=...` passes the CLI's declared-name
  # check; the default empty string renders blank, which the entry command
  # refuses (a review entry always requires an explicit base).
  reviewBase: ""

entry:
  default: unified

machines:
  # ── DEDUP: the green-baseline entry gate (identity-free) ──────────────────
  # Runs the suite before any work starts — both `start-gate` and
  # `review-gate` reach this one check, and its script IS the shared
  # `&suiteCheck` anchor (defined once, right here, and aliased by
  # `fix-precheck` below); the `on` rules turn the result into "halt at
  # blocked" vs "proceed to $onGreen". Kept SEPARATE from `healthGate` (below)
  # even though both are a check+something-else shape: this gate runs BEFORE
  # planning, so it must NOT sweep any steering file `healthGate` does.
  entryGate:
    params: [onGreen, blockedMessage, blockedDescribe, checkLabel, blockedLabel, reviewBase]
    entry: check
    states:
      check:
        actor: check
        label: $checkLabel
        script: &suiteCheck |
          #!/usr/bin/env bash
          # gtd check turn — run the suite; a red run records .gtd/FEEDBACK.md, a
          # green run cleans it up. The `on` rules decide what that means.
          set +e
          mkdir -p "<%~ it.vars.stateDir %>"
          # Hoist the feedback path once, at the TOP: Eta's autoTrim eats the
          # newline after an interpolation tag, so no tag may be the last token on
          # a line — it would glue the next line's `else`/`fi` onto it and break
          # the script. Below this point everything is plain bash.
          feedback="<%~ it.vars.feedbackFile %>"
          mkdir -p "$(dirname "$feedback")"
          <%~ it.vars.testCommand %> > <%~ it.vars.stateDir %>/.check-output 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            if [ -s <%~ it.vars.stateDir %>/.check-output ]; then
              mv <%~ it.vars.stateDir %>/.check-output "$feedback"
            else
              rm -f <%~ it.vars.stateDir %>/.check-output
              printf 'the test command failed with exit code %s and produced no output.' "$code" > "$feedback"
            fi
            # A repeat identical failure would otherwise leave FEEDBACK.md
            # byte-identical to its committed copy — no diff, so the check would
            # look GREEN. Stamp each red run with the current HEAD (which always
            # advances between checks) so a still-red re-run always re-registers
            # as an M/A edit and takes the red edge.
            printf '\n<!-- gtd check %s -->\n' "$(git rev-parse --short HEAD 2>/dev/null || echo pending)" >> "$feedback"
          else
            rm -f <%~ it.vars.stateDir %>/.check-output
            rm -f "$feedback"
          fi
        # `entry: true` on the shared local marks both `entryGate` instances
        # (start-gate/review-gate) as manual entries — only `review-gate.check`
        # actually needs the reachability root (it is otherwise unreachable
        # from `entries.default`), but the shared dedup makes marking one mark
        # both. Accepted as correct: both ARE the workflow's entry gates.
        entry: true
        # `reviewBase: $reviewBase` — only `review-gate` binds a real
        # template (`<%= it.vars.reviewBase %>`), fixing the whole process's
        # diff base to whatever `gtd --entry review-gate.check --var
        # reviewBase=<commitish>` supplies. `start-gate` binds the literal
        # empty string, which compiles away to "no base" here — it is reached
        # from `idle`, never manually entered with a base.
        reviewBase: $reviewBase
        on:
          "A <%= it.vars.feedbackFile %>": blocked
          "M <%= it.vars.feedbackFile %>": blocked
          "D <%= it.vars.feedbackFile %>": $onGreen
          "C": $onGreen
      blocked:
        actor: human
        label: $blockedLabel
        file: <%= it.vars.feedbackFile %>
        message: $blockedMessage
        on:
          "* **":
            to: check
            action: Retry check
            describe: $blockedDescribe

  # ── DEDUP: the check/escalate health pair (identity-free) ─────────────────
  # Runs the suite; a red run records the configured feedbackFile and routes to
  # the caller's OWN fixer (`$onRed` — a coder-identity action that lives
  # beside this machine, not inside it, since fixing IS a coder action and this
  # machine has no identity); a green run cleans it up and routes to
  # `$onGreen`. Escalation redirects here after the caller's fixer has retried
  # `max` times without success. Instantiated for the build tail's own tail
  # (`build.health.*`, caller's fixer is `build.fix`) and the per-package
  # build's own tail (`packages.item.health.*`, caller's fixer is
  # `packages.item.fix-suite`).
  healthGate:
    params: [onGreen, onRed, escalateDescribe, checkLabel, escalateLabel]
    entry: check
    states:
      check:
        actor: check
        label: $checkLabel
        # This script ALSO sweeps the spent raw review capture
        # (`reviewRawFile`) — a mechanic `entryGate.check` must NOT run, since
        # it executes before planning, while a fresh sketch legitimately still
        # exists.
        script: |
          #!/usr/bin/env bash
          # gtd check turn — run the suite; a red run records .gtd/FEEDBACK.md, a
          # green run cleans it up. The `on` rules decide what that means.
          set +e
          mkdir -p "<%~ it.vars.stateDir %>"
          # Hoist every path once, at the TOP: Eta's autoTrim eats the newline
          # after an interpolation tag, so no tag may be the last token on a
          # line — it would glue the next line's `else`/`fi` onto it and break
          # the script. Below this point everything is plain bash.
          feedback="<%~ it.vars.feedbackFile %>"
          mkdir -p "$(dirname "$feedback")"
          # Sweep the raw review capture — no path from `deciding`/`collecting`
          # reaches this gate any more (its only inbound edge is
          # `gtd --entry fix-precheck`'s red branch); this is a leftover
          # sweeper for a capture an earlier, abandoned process may have left
          # committed on that path. A no-op when it is already gone or never
          # existed.
          reviewRaw="<%~ it.vars.reviewRawFile %>"
          rm -f "$reviewRaw"
          <%~ it.vars.testCommand %> > <%~ it.vars.stateDir %>/.check-output 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            if [ -s <%~ it.vars.stateDir %>/.check-output ]; then
              mv <%~ it.vars.stateDir %>/.check-output "$feedback"
            else
              rm -f <%~ it.vars.stateDir %>/.check-output
              printf 'the test command failed with exit code %s and produced no output.' "$code" > "$feedback"
            fi
            # A repeat identical failure would otherwise leave FEEDBACK.md
            # byte-identical to its committed copy — no diff, so the check would
            # look GREEN. Stamp each red run with the current HEAD (which always
            # advances between checks) so a still-red re-run always re-registers
            # as an M/A edit and takes the red edge.
            printf '\n<!-- gtd check %s -->\n' "$(git rev-parse --short HEAD 2>/dev/null || echo pending)" >> "$feedback"
          else
            rm -f <%~ it.vars.stateDir %>/.check-output
            rm -f "$feedback"
          fi
        on:
          "A <%= it.vars.feedbackFile %>": $onRed
          "M <%= it.vars.feedbackFile %>": $onRed
          "* **": $onGreen
          "C": $onGreen
      escalate:
        actor: human
        label: $escalateLabel
        file: <%= it.vars.feedbackFile %>
        message: |
          The agent could not get the check to pass after repeated attempts.
          `<%= it.vars.feedbackFile %>` holds the last failing output.

          What each change does next (then run `gtd land`):
          <% it.edges.forEach(function (e) { if (e.describe) { %>
          <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
          <% } }) %>
        on:
          "* **":
            to: check
            action: Retry check
            describe: $escalateDescribe

  # ── DEDUP: the open-questions check/answer pair (identity-free) ───────────
  # Shared by design and architecture's own gate (`design.gate`/
  # `architecture.gate`): `check`'s script probes whichever of
  # requirementsFile/architectureFile currently exists (see the script's own
  # comment) with `gtd check qa --open-questions` and stamps/removes
  # `questionsFile` on the result; only when it's present does the process
  # rest at `answer`, a human gate. A question-free phase never rests here at
  # all — `check`'s own `on` rows skip straight to `$onNone`. Takes NO `file:`
  # PARAM for the probe script itself: machine `$param` substitution is
  # whole-value only, so a path cannot be spliced into a shared script body —
  # `file` is instead the PARAM `answer` renders as its own `file:` (the
  # human-facing gate), a different use entirely from the probe.
  questionGate:
    params: [file, message, onNone, onRevise, checkLabel, answerLabel]
    entry: check
    states:
      check:
        actor: check
        label: $checkLabel
        script: |
          #!/usr/bin/env bash
          # gtd check turn — probe the current phase's steering file for
          # unanswered questions; an answered/empty result removes the marker
          # (questionsFile), an unanswered one stamps it fresh. Design and
          # architecture share this one probe: whichever of
          # requirementsFile/architectureFile exists ON DISK right now IS this
          # phase's steering file — unambiguous because architecture.author
          # deletes requirementsFile in the same turn it writes
          # architectureFile, so exactly one of the two exists here.
          set +e
          mkdir -p "<%~ it.vars.stateDir %>"
          # Hoist every path once, at the TOP: Eta's autoTrim eats the newline
          # after an interpolation tag, so no tag may be the last token on a
          # line — it would glue the next line's `else`/`fi` onto it and break
          # the script. Below this point everything is plain bash.
          questions="<%~ it.vars.questionsFile %>"
          mkdir -p "$(dirname "$questions")"
          requirements="<%~ it.vars.requirementsFile %>"
          architecture="<%~ it.vars.architectureFile %>"
          file="$requirements"
          [ -f "$file" ] || file="$architecture"
          gtd check qa "$file" --open-questions > /dev/null 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            printf 'open questions remain in %s\n' "$file" > "$questions"
            # A repeat identical result would otherwise leave the marker
            # byte-identical to its committed copy — no diff, so the check
            # would look answered. Stamp each round with the current HEAD
            # (which always advances between checks) so a still-open re-run
            # always re-registers as an M/A edit and takes the answer edge.
            printf '\n<!-- gtd check %s -->\n' "$(git rev-parse --short HEAD 2>/dev/null || echo pending)" >> "$questions"
          else
            rm -f "$questions"
          fi
        on:
          "A <%= it.vars.questionsFile %>": answer
          "M <%= it.vars.questionsFile %>": answer
          "D <%= it.vars.questionsFile %>": $onNone
          "C": $onNone
      answer:
        actor: human
        label: $answerLabel
        file: $file
        mode: qa
        answerGate: true
        message: $message
        on:
          "* **":
            to: $onRevise
            action: Revise answers
            describe: >-
              tick exactly one option per open question (replace
              `_your answer_` for your own) to send it back for the agent to
              fold your answers in. Delete a question to skip it, or delete
              the whole `## Open Questions` section to accept the plan as-is.

  # ── ENCAPSULATION: the triage phase's one conversation ─────────────────────
  # Groups the diff that started the process into ordered, classified
  # concerns and resolves the PRODUCT ones' open questions — one machine
  # identity across the whole back-and-forth, so the agent explores the
  # codebase once and the human's answer rationale survives every return lap.
  # `triage`'s prompt reads THREE laps off the requirements file's own
  # content, never off which edge landed here (the resting state is the same
  # either way): FIRST (the file is absent), RETURN (a ticked/answered
  # question waiting to be folded), and REVIEW LOOP-BACK (concerns already
  # present, nothing ticked-but-unfolded — `re-unwind` put them there, not an
  # answer). The loop-back lap also runs the suite itself and files any
  # breakage it finds as its own FIRST concern: `re-unwind` sits between
  # `build.review.deciding` and here with no `entryGate` in between, so a red
  # the revert causes is otherwise ambient. Left for
  # `packages.item.health.check` to trip over instead, it would spend one of
  # `packages.item.fix-suite`'s retry cap — process-pooled across every
  # package, the same pattern `specReview.review`'s own retry comment
  # documents — on breakage the package itself never caused.
  # ▸ planner identity — `model:` declared once here, stamped onto `triage`
  # (its only prompt state; `gate.answer` is a human turn and carries no
  # prompt).
  designPlan:
    model: <%= it.vars.plannerModel %>
    params: [onArchitecture]
    entry: triage
    states:
      triage:
        actor: agent
        label: Triaging the change
        file: <%= it.vars.requirementsFile %>
        mode: qa
        # An agent that deletes the assembled review input without folding it
        # in is the original "captured then discarded" bug, now against THIS
        # state's own file — the retired `build.addressing` state was the
        # guard's only user before this restructure; this is its new one.
        requireProgress: true
        prompt: |
          You are an autonomous coding agent. This workflow steers itself
          through its own state files — treat them as its private scratchpad,
          never as project code or documentation. The only state file this
          turn touches is `<%= it.vars.requirementsFile %>`; develop it. Do
          not create other files to hold notes or output.

          `<%= it.vars.todoFile %>` is the likely home of the sketch that
          started this process. Despite living beside this workflow's own
          state files, it is the HUMAN'S INPUT — the sketch to be folded into
          the concerns below like any other part of the start diff. It is
          never a state file to preserve, and never gtd bookkeeping to ignore.

          This process started at commit `<%= it.startCommit %>`. The change
          that started it was reverted out of the working tree by the
          `unwind` beat right after it landed, so `git diff <%= it.startCommit %>`
          (against the working tree) is now empty — its content survives only
          in history. Find the entry commit yourself: run
          `git rev-list --ancestry-path <%= it.startCommit %>..HEAD | tail -1`
          (the process's very first turn, landed immediately after
          `<%= it.startCommit %>`, before any later baseline-repair commits) —
          then `git show` that commit to see everything that started this
          process: a hand-edit to real code, a scratch note in some file, or
          both.

          On the FIRST lap, `<%= it.vars.requirementsFile %>` does not exist
          yet (or holds whatever the human's own change happened to leave
          there). Build it from that start diff:

          1. Group the diff into an ORDERED list of CONCERNS — each one a
             coherent piece of work that can leave the test suite GREEN on
             its own, in the order you'd want them built. If a concern would
             red-light tests that a later concern is meant to fix, that is
             not a valid split: merge the two into one concern.
          2. Classify each concern as PRODUCT (a user-facing/requirements
             decision) or TECHNICAL (an implementation decision).
          3. For every PRODUCT concern with an open point you cannot settle
             yourself, add a question under a `## Open Questions` heading near
             the top: one `### <question>` sub-heading each, followed by a
             checkbox list of candidate answers — aim for TWO concrete options
             plus a final free-text slot, ALL left UNTICKED:

                 ### <the question>

                 - [ ] <first option — a concrete answer, a few words of rationale>
                 - [ ] <second option>
                 - [ ] _your answer_

             Raise questions ONLY for product concerns here — a technical
             concern's open points wait for the next phase. Never tick a box
             yourself — the human ticks exactly one per question.
          4. Fold EVERYTHING the entry commit added into the concerns above —
             a scratch note and a real code edit are both just a SKETCH of
             the intent, a spec to be finished, never work to be preserved;
             `unwind` already reverted both out of the tree, so there is
             nothing left to delete. Describe each piece under the concern it
             belongs to.

          On a RETURN lap the human has ticked one option per question (or
          replaced `_your answer_` with their own text) in
          `<%= it.vars.requirementsFile %>`. For each answered question: fold
          the chosen answer into its concern's prose, then MOVE the question
          down into a `## Answered Questions` section as `### <question>`
          followed by the resolved answer in plain PROSE (drop the
          checkboxes). Never re-raise a question the human deleted; if the
          human deleted the whole `## Open Questions` section, treat every
          product concern as accepted and surface no new questions unless
          something is genuinely still blocking. Omit `## Open Questions`
          entirely once there are none left.

          On a REVIEW LOOP-BACK lap, `<%= it.vars.requirementsFile %>`
          already holds concerns and none of them have a ticked-but-unfolded
          answer waiting — that shape means a completed REVIEW ROUND put
          this material here, not a question you asked. Develop those
          existing concerns further with whatever the round raised; never
          rediscover or regroup them from a cold read the way the FIRST lap
          does.

          The human's own edit from that review round has been reverted out
          of the working tree the same way the entry commit is — read it
          from history, never the working tree: run
          `git show <%= it.reviewBase %>` to see it. (On a FIRST lap that
          same hash IS the process's own diff base, `<%= it.startCommit %>`,
          so this branch does not apply: `<%= it.vars.requirementsFile %>`
          does not exist yet for a review round to have happened against.)

          Whatever this round touches, every decision already settled under
          `## Answered Questions` stays settled on this lap too — never
          re-open one. A genuinely open PRODUCT point in the round's own
          material may still raise a fresh question under
          `## Open Questions`: the product gate sits on this path exactly as
          it does on a first lap, and will ask it.

          Before grouping anything on this lap, run
          `<%= it.vars.testCommand %>` yourself as part of reading the
          situation: a review loop-back runs no green-baseline gate between
          the revert above and this turn, so the tree may already be RED —
          reverting the human's edit can undo a fix that edit had put in. If
          the suite is red, make that breakage the FIRST concern in your
          ordered list, ahead of everything else — every later concern's
          "leaves the suite green on its own" property assumes the suite
          already started green.

          Leave `<%= it.vars.requirementsFile %>` uncommitted and finish your
          turn.
        on:
          "* **": gate.check

      gate:
        machine: questionGate
        with:
          file: <%= it.vars.requirementsFile %>
          onNone: $onArchitecture
          onRevise: triage
          checkLabel: Checking for open questions
          answerLabel: Awaiting your product answers
          message: |
            `<%= it.vars.requirementsFile %>` holds the concerns under
            development. Each open question under `## Open Questions` offers
            a few options plus a `- [ ] _your answer_` slot. Answer EVERY
            question by ticking exactly one box (`- [x]`); for your own
            answer, replace `_your answer_` with your text and tick that
            line. Stepping is refused while any question is unanswered.

            What each change does next (then run `gtd land`):
            <% it.edges.forEach(function (e) { if (e.describe) { %>
            <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
            <% } }) %>

  # ── ENCAPSULATION: the technical phase's one conversation ──────────────────
  # A separate machine from `designPlan` — its own memory scope, since there
  # may be a handover between the user-facing and the technical phase: this
  # phase does NOT resume design's conversation, it reads
  # `<%= it.vars.requirementsFile %>` cold. Resolves the TECHNICAL open
  # questions, then mechanically decomposes the settled concerns into package
  # files (no merge/split judgement — that already happened in triage's
  # grouping). ▸ planner identity — `model:` declared once here, stamped onto
  # `author` and `decompose` (its own prompt states; `gate.answer` is a human
  # turn and carries no prompt).
  archPlan:
    model: <%= it.vars.plannerModel %>
    params: [onPackages]
    entry: author
    states:
      author:
        actor: agent
        label: Refining the technical plan
        file: <%= it.vars.architectureFile %>
        mode: qa
        prompt: |
          You are an autonomous coding agent. This workflow steers itself
          through its own state files — treat them as its private scratchpad,
          never as project code or documentation. The only state files this
          turn touches are `<%= it.vars.architectureFile %>` (write it) and
          `<%= it.vars.requirementsFile %>` (delete it once its content is
          folded in). Do not create other files to hold notes or output.

          You do NOT resume the design conversation — this is a separate
          machine with its own memory, a COLD read every time. Read
          `<%= it.vars.requirementsFile %>` (the settled, ordered, classified
          concerns) in full. Treat every product decision recorded there —
          plain prose or a resolved `## Answered Questions` entry — as
          SETTLED; never re-open it.

          On the FIRST lap, develop `<%= it.vars.architectureFile %>` from
          those concerns: for each one, in the same order, work out the *how*
          — file/module structure, data models, library/tech-stack choices,
          error-handling strategy — building on the *what* already settled.
          For every open TECHNICAL point you cannot settle yourself, add a
          question under a `## Open Questions` heading exactly as the
          requirements phase does: one `### <question>` each, followed by a
          checkbox list — TWO concrete options plus a final free-text slot,
          ALL left UNTICKED:

              ### <the question>

              - [ ] <first option>
              - [ ] <second option>
              - [ ] _your answer_

          Never tick a box yourself. On a RETURN lap the human has ticked one
          option per question (or replaced `_your answer_` with their own
          text): fold each chosen answer into the plan prose, then MOVE the
          question into a `## Answered Questions` section as `### <question>`
          + the resolved answer in plain PROSE (drop the checkboxes). Never
          re-raise a deleted question; treat a deleted `## Open Questions`
          section as acceptance. Omit `## Open Questions` once there are none
          left.

          Once `<%= it.vars.architectureFile %>` is written, delete
          `<%= it.vars.requirementsFile %>` — its content has been folded in
          and it must not linger. Leave everything uncommitted and finish
          your turn.
        on:
          "* **": gate.check

      gate:
        machine: questionGate
        with:
          file: <%= it.vars.architectureFile %>
          onNone: decompose
          onRevise: author
          checkLabel: Checking for open questions
          answerLabel: Awaiting your technical answers
          message: |
            `<%= it.vars.architectureFile %>` holds the technical plan under
            development. Each open question under `## Open Questions` offers
            a few options plus a `- [ ] _your answer_` slot. Answer EVERY
            question by ticking exactly one box (`- [x]`); for your own
            answer, replace `_your answer_` with your text and tick that
            line. Stepping is refused while any question is unanswered.

            What each change does next (then run `gtd land`):
            <% it.edges.forEach(function (e) { if (e.describe) { %>
            <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
            <% } }) %>

      decompose:
        actor: agent
        label: Decomposing into packages
        prompt: |
          You are an autonomous coding agent. This workflow steers itself through
          its own state files — treat them as its private scratchpad, never as
          project code or documentation. The only state files this turn touches
          are the package files it writes under `<%= it.vars.packagesDir %>/` and
          `<%= it.vars.architectureFile %>`, which it deletes. Do not create other
          files to hold notes or output.

          If you wrote `<%= it.vars.architectureFile %>` earlier in this
          conversation, work from what you already settled; otherwise read it
          (the converged technical plan) yourself. It already lists an ORDERED
          set of concerns with every merge/split judgement made — this turn is
          a mechanical write-out, not a planning one.

          Write one package file per concern, in the settled order, under
          `<%= it.vars.packagesDir %>/` (e.g.
          `<%= it.vars.packagesDir %>/01-name.md`,
          `<%= it.vars.packagesDir %>/02-name.md`, ...). Each package file
          carries that concern's requirement (so it can be reviewed against
          its spec), its independent tasks, and each task's acceptance
          criteria as `- [ ]` checkboxes and relevant paths. Do NOT merge or
          split concerns here — that judgement already happened upstream;
          carry the settled grouping over verbatim. No package file may
          reference any other `.gtd/` file.

          Once the package files are written, delete
          `<%= it.vars.architectureFile %>`. Leave everything uncommitted and
          finish your turn.
        on:
          "* <%= it.vars.packagesDir %>/**": $onPackages

  # ── ENCAPSULATION: the shared review tail ──────────────────────────────────
  # ▸ planner identity — `model:` declared once here, stamped onto `reviewing`
  # and `collecting` (its only prompt states). `collecting` JUDGES whether a
  # round is actionable and, when it is, CLASSIFIES it straight into
  # `requirementsFile` as ordered, PRODUCT/TECHNICAL concerns — the same
  # artifact `design.triage` develops — never an instruction list, and never a
  # build. An actionable round still leaves this machine entirely (the root's
  # own `re-unwind`, then `design.triage` folds the concerns in cold), so
  # there is no coder-identity follow-through inside this machine any more.
  humanReview:
    model: <%= it.vars.plannerModel %>
    entry: reviewing
    states:
      reviewing:
        actor: agent
        label: Reviewing
        file: <%= it.vars.reviewFile %>
        mode: review
        # `gtd --entry review-gate.check` (a plain non-gtd branch, e.g. a
        # colleague's PR) does NOT enter here directly — it enters
        # `review-gate.check` first, which runs the green-baseline gate and,
        # once green, transitions here. The `Gtd-Review-Base:` trailer rides on that
        # entry commit (the process's oldest), so everything below still reuses
        # the same reviewing/await-review/feedback machinery over <commitish>..HEAD.
        prompt: |
          You are an autonomous coding agent. This workflow steers itself
          through its own state files — treat them as its private scratchpad,
          never as project code or documentation. The only state file this
          turn touches is `<%= it.vars.reviewFile %>`; write it at exactly
          that path. Do not create other files to hold notes or output.

          Write `<%= it.vars.reviewFile %>` to help a human review the changes in
          this EXACT format:

          - First non-blank line: `# Review: <%= it.currentCommit.slice(0, 7) %>`
          - Somewhere in the document: `<!-- base: <%= it.reviewBase %> -->`
          - At least one `## <Chunk Title>` heading, grouping hunks semantically
            (same feature/refactor/fix, even across files) — a short explanation of
            what changed and why, then one `- [ ] ./path/to/file.ts#42 — note` file
            pointer per hunk (checkboxes are for the human to tick, not you; every
            path is `./`-relative, with an optional `#line` and an optional
            ` — note`).

          This prompt carries no diff — read the changes yourself. The range runs
          from `<%= it.reviewBase %>` to the working tree (committed turns plus
          anything still pending); on a feedback round that base is the previous
          review's boundary, so it covers only what changed since then, not items
          already signed off.

          Leave `<%= it.vars.reviewFile %>` uncommitted and finish your turn.
        on:
          "* **": await-review

      await-review:
        actor: human
        label: Awaiting your review
        file: <%= it.vars.reviewFile %>
        mode: review
        # While the process rests here, gtd opens a "review checkout window": raw HEAD
        # is rewound to the review base (the most-recent `deciding` commit — so a
        # feedback round shows only `last-review..HEAD` — or the process start on
        # the first review) with the working tree untouched, surfacing the diff
        # as ordinary uncommitted changes. It closes on the next invocation.
        #
        # Every human step here routes to `deciding`, which decides sign-off vs.
        # feedback from the step's CONTENT (a comment, not a tick). Ticking a box
        # only records "I reviewed this hunk". Two dead ends can't be told apart by a
        # file-pattern edge, so the review-signoff guard (`src/StepGuards.ts`)
        # catches them BEFORE the step commits and refuses: an unfinished
        # review (a box still `- [ ]` with no comment) and a deleted REVIEW.md.
        reviewWindow: true
        message: |
          `<%= it.vars.reviewFile %>` holds the review record for the process — one
          `- [ ]` checkbox per reviewable item, grouped into chunks. Tick a box
          (`- [x]`) as you review each hunk; ticking only records that you've read
          it, it is not sign-off.

          When you've been through the whole diff, run `gtd land`:

          - **Sign off** — tick EVERY box and leave no comment — no note in
            `<%= it.vars.reviewFile %>`, no code edit — to collapse the process into
            one commit (**build.squashing**).
          - **Request changes** — leave a comment: a note on a
            `<%= it.vars.reviewFile %>` line, or a direct code edit — to send a FULL
            development lap (**review.deciding** → **review.collecting** →
            re-triage). A hand-edit you make here is treated as a SKETCH, not a
            fix the agent builds on: it is reverted out of the tree and re-planned
            from scratch, the same as any other change that starts a process.
            There is no baseline check on the way back into planning — only a
            genuinely non-actionable comment (an approving remark with no code
            edit) skips the lap and signs off straight away.

          Stepping with a box still unticked and no comment is refused (finish
          reviewing first); so is deleting `<%= it.vars.reviewFile %>`.
        on:
          "* **": deciding

      deciding:
        actor: check
        label: Reviewing
        file: <%= it.vars.reviewFile %>
        mode: review
        # Anchors the INCREMENTAL review base: its most-recent in-process commit is
        # the point the previous review round ended, so the next `reviewing` turn
        # (and the review checkout window) covers only the changes since then. On
        # the first review there is no such commit, so the base is the process start.
        reviewBase: true
        script: |
          #!/usr/bin/env bash
          # gtd check turn — decide the human's review step from its CONTENT. HEAD is
          # the human's `await-review -> deciding` commit; HEAD^ is the `reviewing`
          # commit that wrote the agent's original REVIEW.md (the sign-off gate
          # refuses an incomplete step, so `deciding` is entered exactly once per
          # round — nothing commits in between). It is FEEDBACK when the human left
          # a comment: a note in REVIEW.md (any edit beyond a "[ ]"->"[x]" tick) OR a
          # hand-edit to any file this round other than `.gtd/` or the state's own
          # reviewFile (which is var-configurable and may live outside `.gtd/`, e.g.
          # a root-level REVIEW.md — issue #128). Otherwise it is a clean sign-off.
          # This turn only CAPTURES the raw material into REVIEW_RAW.md (the
          # `collecting` agent then judges whether it's actionable); it does
          # NOT interpret it. Either way, remove REVIEW.md; what the resulting diff
          # MEANS is decided by this state's own `on` rules — the A/M REVIEW_RAW.md
          # rows are declared BEFORE the D REVIEW.md row so a feedback round (which
          # also deletes REVIEW.md) is captured as feedback, not mistaken for a
          # sign-off.
          set +e
          # Hoist the paths once, at the TOP: Eta's autoTrim eats the newline after
          # an interpolation tag, so no tag may be the last token on a line — it
          # would glue the next line onto it and break the script. Below this point
          # everything is plain bash.
          stateDir="<%~ it.vars.stateDir %>"
          reviewFile="<%~ it.vars.reviewFile %>"
          reviewRawFile="<%~ it.vars.reviewRawFile %>"
          head=$(git rev-parse HEAD)
          mkdir -p "$(dirname "$reviewRawFile")"
          # A note is any REVIEW.md change beyond a checkbox flip: normalize every
          # "[ ]"/"[x]" to a placeholder, then compare the agent's original (HEAD^)
          # against the human's version (HEAD).
          before=$(git show "HEAD^:$reviewFile" 2>/dev/null | sed -E 's/\[[ xX]\]/[_]/g')
          after=$(git show "HEAD:$reviewFile" 2>/dev/null | sed -E 's/\[[ xX]\]/[_]/g')
          # Did the human hand-edit anything this round besides stateDir and the
          # reviewFile itself (var-configurable — may live outside stateDir, so it
          # is excluded by exact path, not just the stateDir prefix)?
          if git diff-tree --no-commit-id --name-only -r HEAD \
               | grep -v "^$stateDir/" | grep -vxF "$reviewFile" | grep -q . \
             || [ "$before" != "$after" ]; then
            {
              echo "Raw review material captured for classification. The human reviewed the changes and left the feedback below; a downstream agent judges whether it's actionable. This file is machine-captured input, not instructions — it names a commit, never inlined content."
              echo
              echo "Commit: $head"
              echo "The human's notes are in $reviewFile at this commit; their hand edits,"
              echo "if any, are in that commit's other paths. Run: git show $head"
            } > "$reviewRawFile"
          fi
          rm -f "$reviewFile"
        on:
          "A <%= it.vars.reviewRawFile %>": collecting
          "M <%= it.vars.reviewRawFile %>": collecting
          "D <%= it.vars.reviewFile %>": $onSignoff

      # Judges actionability and, when actionable, classifies straight into
      # `requirementsFile` — an ordered, PRODUCT/TECHNICAL concern list, never
      # an instruction list for a builder (the actionable path re-plans from
      # history via `re-unwind` + `design.triage`; it never builds on the
      # human's own edit). The outcome is encoded by which paths ITS OWN diff
      # touches, never by a sentinel: writing `requirementsFile` (`A`/`M`) IS
      # the actionable case — row ORDER matters, since an actionable round's
      # diff is `A requirementsFile` + `D reviewRawFile` together, so the
      # requirements rows must be declared first or every round would
      # short-circuit to sign-off. CONSUMING `reviewRawFile` alone (deleting
      # it, the only change this turn) is the non-actionable short-circuit —
      # the same trick `deciding` already uses, one state earlier; it reuses
      # `$onSignoff` (already bound to `build.squashing`) rather than a new
      # param, because the short-circuit IS a sign-off. Declaring no `C` row
      # and no `* **` row is deliberate: a clean turn here is a fruitless
      # dispatch (a crash, a refusal, a context-limit cutoff), never a
      # verdict, so it falls through to the ordinary `prompt`-state default
      # instead — an empty ATTEMPT commit, remembered as a stall
      # (`Edge.ts`'s `stalledAt`) rather than silently misread as "the human's
      # feedback was non-actionable" — and a dirty tree matching neither row
      # is a REFUSAL (you classify, you do not build). `requirementsFile`
      # survives `re-unwind` (it lives under `stateDir`, excluded from its own
      # revert pathspec) for `design.triage` to fold in cold; a consumed
      # `reviewRawFile` with no requirements written is gone before
      # `build.squashing` ever runs, so nothing leaks into the finale.
      collecting:
        actor: agent
        label: Collecting your feedback
        file: <%= it.vars.requirementsFile %>
        mode: qa
        prompt: |
          You are an autonomous coding agent judging and classifying a round
          of review feedback. This workflow steers itself through its own
          state files — treat them as its private scratchpad, never as
          project code or documentation. The only state files this turn
          touches are `<%= it.vars.requirementsFile %>` and
          `<%= it.vars.reviewRawFile %>`, which it deletes — do NOT change any
          other file: you classify, you do not build.

          The raw review material is: <%~ it.read(it.vars.reviewRawFile) %>

          It names a commit. If you wrote today's review earlier in this
          conversation, work from what you already reviewed; otherwise read that
          commit's diff yourself before classifying anything.

          The round is ACTIONABLE if any of the following is true:

          1. The human left a NOTE on `<%= it.vars.reviewFile %>` — a note is
             anything beyond a checkbox flip, regardless of whether the box
             itself is ticked (ticking means only "I read this hunk", never
             sign-off). A note is a MANDATORY concern below, whether or not
             its box is ticked.
          2. The human ADDED a code comment this round (a `+` line that is a
             comment, in a hand-edited file) — even a plain-prose one. That
             comment is an INSTRUCTION: describe it as a concern below, and
             note that the comment line itself is transient — it must not
             survive the lap that satisfies it.
          3. The human hand-edited any non-comment code this round. That code
             is no longer an already-committed intent to build on top of — it
             is a SKETCH, like the entry commit's own diff: describe what it
             was reaching for under the concern it belongs to, and expect the
             lap that follows to re-derive it from scratch. Never say the
             human's lines are final or that they must survive unchanged.

          The round is NOT actionable only when none of the above holds — the
          human left nothing but an approving remark (a compliment, a "looks
          good", or similar) with no code edit and no substantive note. Never
          invent actionability to justify a lap, and never dismiss a real note
          or edit as approval.

          If the round is ACTIONABLE: write `<%= it.vars.requirementsFile %>`
          with an ORDERED list of CONCERNS, each classified PRODUCT (a
          user-facing/requirements decision) or TECHNICAL (an implementation
          decision) — the same shape `design.triage` builds, one
          `## <heading>` per concern, in the order you'd want them built. Fold
          every note, comment, and hand-edit from this round in under the
          concern it belongs to, per the rules above. Raise NO open
          questions here — write no `## Open Questions` section;
          `design.triage` owns that, one phase later. Then delete
          `<%= it.vars.reviewRawFile %>` and finish your turn.

          If the round is NOT actionable: delete
          `<%= it.vars.reviewRawFile %>` and finish your turn, writing nothing
          to `<%= it.vars.requirementsFile %>` — consuming the capture with no
          other change IS the sign-off.
        on:
          "A <%= it.vars.requirementsFile %>": $onFeedback
          "M <%= it.vars.requirementsFile %>": $onFeedback
          "D <%= it.vars.reviewRawFile %>": $onSignoff

  # ── ENCAPSULATION: the per-package agentic review ──────────────────────────
  # A single state: a machine whose entire job is to be a separate MIND from
  # the implementer, distinct from the coder identity that builds/fixes the
  # package (`packages.item.*`). ▸ planner identity — `model:` declared once
  # here, stamped onto `review` (its only prompt state). Fixing the reviewer's
  # own findings is a coder action, not a reviewer one — it lives in
  # `packages.item.fix-spec` (`$onFix`), not inside this machine.
  specReview:
    model: <%= it.vars.plannerModel %>
    params: [onApproved, onFix]
    entry: review
    states:
      review:
        actor: agent
        label: Reviewing the package
        # Bounded per process: once entered `max` times, a transition into it is
        # redirected to `$onApproved` (force-close the package and move on — the
        # unresolved concern is deferred to the shared human review at the tail,
        # which sees the whole diff anyway). NOTE the cap is PROCESS-scoped, so it
        # pools across packages — the same documented limitation the shared
        # `build.fix` cap has (see the README's "Why" section, "Bounded, not
        # runaway").
        retry:
          max: 3
          otherwise: $onApproved
        prompt: |
          You are an autonomous coding agent reviewing a freshly-built work package
          against its own spec. This workflow steers itself through its own
          state files — treat them as its private scratchpad, never as project
          code or documentation. The only state file this turn touches is
          `<%= it.vars.specFeedbackFile %>`; write it only when — and only
          when — you find problems. Do not create other files to hold notes or
          output.

          The package spec is: <%~ it.read(it.vars.nextFile) %>

          Read that spec, then verify the package's implementation against it: are
          all its tasks done, acceptance criteria met, and the code sound and
          consistent with the codebase? This prompt carries no diff — read it
          yourself: the range runs from `<%= it.startCommit %>` to the working
          tree.

          Note the range is process-wide (from the start of the whole build, not
          just this package), so it can span earlier packages too.

          - If it fully satisfies the spec, write NOTHING and finish your turn — a
            clean turn is your approval.
          - If it does not, write `<%= it.vars.specFeedbackFile %>` listing the
            concrete problems for a fix turn to address. Be specific.

          Do not fix anything yourself and do not delete the package file — a later
          step owns that. Finish your turn.
        on:
          "A <%= it.vars.specFeedbackFile %>": $onFix
          "M <%= it.vars.specFeedbackFile %>": $onFix
          "D <%= it.vars.specFeedbackFile %>": $onApproved
          "C": $onApproved

  # ── ENCAPSULATION: the per-package build queue ─────────────────────────────
  # Identity-free (a bookkeeping queue, not a builder) — the actual per-package
  # build identity lives in its own `item` child (packageItem, below).
  packageLoop:
    params: [onDrained]
    entry: picking
    states:
      picking:
        actor: check
        label: Picking the next package
        script: |
          #!/usr/bin/env bash
          # gtd check turn (the package queue arbiter) — the loop driver executes
          # this verbatim, then steps the check actor. Mechanics only: take the
          # first package file (by name) under the packages dir into NEXT.md, or
          # remove NEXT.md when the queue is empty. What NEXT.md's presence/absence
          # MEANS (another package to build vs. the queue closing out to review) is
          # decided by this state's own `on` rules at capture time — never here.
          set +e
          # Hoist the NEXT path once, at the TOP: Eta's autoTrim eats the newline
          # after an interpolation tag, so no tag may be the last token on a line —
          # it would glue the next line's `else`/`fi` onto it and break the script.
          # Below this point everything is plain bash.
          nextFile="<%~ it.vars.nextFile %>"
          # Sweep the design/architecture phases' spent steering files:
          # requirementsFile is consumed by architecture.author, architectureFile
          # by architecture.decompose, and questionsFile by whichever gate ran
          # last — all three are gone by the time the package queue starts.
          # reviewRawFile is swept here too: the review loop-back
          # (re-unwind) excludes stateDir from its revert, so an actionable
          # feedback round's MARKED raw capture (see humanReview's own
          # `collecting` state) rides through design and architecture
          # untouched — this is the ONLY sweeper on that path
          # before the queue (and eventually the squash finale) would
          # otherwise pick it up as stray content. No-op if already removed.
          requirements="<%~ it.vars.requirementsFile %>"
          architecture="<%~ it.vars.architectureFile %>"
          questions="<%~ it.vars.questionsFile %>"
          reviewRaw="<%~ it.vars.reviewRawFile %>"
          rm -f "$requirements" "$architecture" "$questions" "$reviewRaw"
          next=$(ls <%~ it.vars.packagesDir %>/*.md 2>/dev/null | head -n 1)
          if [ -n "$next" ]; then
            mkdir -p "$(dirname "$nextFile")"
            printf '%s' "$next" > "$nextFile"
          else
            rm -f "$nextFile"
          fi
        on:
          "D <%= it.vars.nextFile %>": $onDrained
          "* <%= it.vars.nextFile %>": item.building
          "C": $onDrained

      # The per-package build identity — its own coder machine (below), so
      # deleting a package file's own lifecycle stays inside `item` while the
      # queue itself (`packages`) stays a single state.
      item:
        machine: packageItem
        with:
          onNext: picking

  # ── ENCAPSULATION: the per-package build identity ──────────────────────────
  # ▸ coder identity — `model:` declared once here, stamped onto `building`,
  # `fix-suite`, and `fix-spec` (its own prompt states). `closing` ends that
  # package file's own lifecycle; keeping it here (not in the queue) keeps
  # `packages` itself to a single state. `packages.item.closing` -> `picking`
  # is the ONE upward-resolving target in the whole file, so it MUST be a
  # param (`$onNext`, bound by `packages` — see the machine's own reference).
  packageItem:
    model: <%= it.vars.coderModel %>
    params: [onNext]
    entry: building
    states:
      building:
        actor: agent
        label: Building
        prompt: |
          You are an autonomous coding agent. This workflow steers itself
          through its own state files — treat them as its private scratchpad,
          never as project code or documentation. The only state file this
          turn may write is `<%= it.vars.satisfiedFile %>` (see below); do NOT
          delete the package file (the spec-review gate reads it after you)
          and never touch `<%= it.vars.nextFile %>` — the `picking` state owns
          it.

          The package to implement is: <%~ it.read(it.vars.nextFile) %>

          Before implementing anything, check the package's acceptance criteria
          against the current tree — an earlier package's fix turn may already
          have satisfied them. If **every** criterion is already met, implement
          nothing: write `<%= it.vars.satisfiedFile %>` recording each criterion
          and the concrete evidence it is already satisfied (the commit, file,
          or symbol that proves it), change nothing else, and finish your turn.
          If any criterion is outstanding, implement the package normally and
          do not write that file.

          That file describes a set of INDEPENDENT tasks. Implement ALL of them in
          this one turn, fanning the independent tasks out to parallel subagents
          where your harness supports it — each task is self-contained and can be
          built concurrently. Implement EXACTLY the tasks this package describes — no
          more, no less; leave every other package file untouched. Use TDD
          discipline within each task.

          Leave the package file in place and everything else uncommitted, then
          finish your turn.
        on:
          "A <%= it.vars.satisfiedFile %>": &satisfied
            to: health.check
            action: Close as already satisfied
            describe: >-
              record per-criterion evidence in .gtd/SATISFIED.md when this
              package's work already landed (an earlier package's fix turn
              pulled it in) — the package still runs the checks and the spec
              review, then closes out.
          "M <%= it.vars.satisfiedFile %>": *satisfied
          "* **": health.check

      fix-suite:
        actor: agent
        label: Fixing the check
        file: <%= it.vars.feedbackFile %>
        prompt: |
          You are an autonomous coding agent. This workflow steers itself
          through its own state files — treat them as its private scratchpad,
          never as project code or documentation. The only state file this
          turn touches is `<%= it.vars.feedbackFile %>`; fix it per its
          contents, or delete it if the feedback turns out to be wrong. Do not
          create other files to hold notes or output.

          Read `<%= it.vars.feedbackFile %>` (the failing test output) and fix the
          code so the suite passes. Keep the change focused — do not refactor
          unrelated code. If the feedback is wrong, empty or delete
          `<%= it.vars.feedbackFile %>` instead of "fixing" a non-issue. If the
          only way to green the suite is to implement work that another
          package file describes, make the smallest change that gets there and
          do it — that later package will then legitimately report itself
          already satisfied when its turn comes.

          Leave everything uncommitted and finish your turn — do not commit.
        retry:
          max: 3
          otherwise: health.escalate
        on:
          "* **": health.check

      fix-spec:
        actor: agent
        label: Fixing review feedback
        file: <%= it.vars.specFeedbackFile %>
        prompt: |
          You are an autonomous coding agent. This workflow steers itself
          through its own state files — treat them as its private scratchpad,
          never as project code or documentation. The only state file this
          turn touches is `<%= it.vars.specFeedbackFile %>`; address it, then
          delete it. Do not create other files to hold notes or output.

          Read `<%= it.vars.specFeedbackFile %>` (the reviewer's concerns about the
          current package) and the package spec (`<%= it.read(it.vars.nextFile) %>`),
          then fix the code to resolve every concern. Keep the change focused.

          Delete `<%= it.vars.specFeedbackFile %>` once every concern is addressed.
          Leave everything else uncommitted and finish your turn.
        on:
          "* **": health.check

      closing:
        actor: check
        label: Closing out the package
        script: |
          #!/usr/bin/env bash
          # gtd check turn (the package closer) — remove the just-reviewed package
          # file (its path is in NEXT.md) plus any leftover spec feedback and
          # already-satisfied evidence, so `picking` selects the NEXT package (or
          # falls through to review when the queue is empty). Reached on approval
          # (spec review clean) and on the spec review retry cap (force-close,
          # deferring the concern to the tail).
          set +e
          pkg=$(cat <%~ it.vars.nextFile %> 2>/dev/null)
          [ -n "$pkg" ] && rm -f "$pkg"
          rm -f <%~ it.vars.specFeedbackFile %> <%~ it.vars.nextFile %> <%~ it.vars.satisfiedFile %>
        on:
          "* **": $onNext

      # Per-package health pair: packages.item.health.check/.escalate ->
      # packages.item.spec.review (green) or packages.item.fix-suite (red).
      health:
        machine: healthGate
        with:
          onGreen: spec
          onRed: fix-suite
          escalateDescribe: >-
            edit the code and/or `.gtd/FEEDBACK.md` yourself
            (**packages.item.health.check**).
          checkLabel: Running checks
          escalateLabel: Escalating to a human

      # Per-package agentic review: packages.item.spec.review -> closing
      # (approved), or packages.item.fix-spec (findings — re-verify via the
      # full health check before re-reviewing).
      spec:
        machine: specReview
        with:
          onApproved: closing
          onFix: fix-spec

  # ── ENCAPSULATION: the process's build identity ─────────────────────────────
  # ▸ coder identity — `model:` declared once here, stamped onto `squashing`
  # and `fix` (its own prompt states). There is no monolithic "build the whole
  # plan" state any more — every package is built inside `packages.item`, and
  # the queue drains straight into `build.review`. There is no coder-identity
  # follow-through on review feedback here any more — an actionable round
  # leaves this machine entirely, via `$onFeedback` bound at the root's own
  # `build:` reference to the root-local `re-unwind` state (see the header
  # comment's "Why humanReview is nested" section for why the review tail
  # still stays nested here even so). `humanReview` is nested HERE (not at the
  # root) so `build.squashing` — the one coder turn a sign-off still resumes —
  # stays inside the builder's own scope.
  buildTail:
    model: <%= it.vars.coderModel %>
    params: [onDone, onFeedback]
    # Nothing resolves this machine BARE (every reference into it names a
    # specific descendant, e.g. `build.review` / `build.fix`) — but a machine
    # must still declare an `entry:` local per its own grammar, so this names
    # an arbitrary one of its own states.
    entry: fix
    states:
      squashing:
        actor: agent
        label: Squashing
        file: <%= it.vars.commitMsgFile %>
        prompt: |
          You are an autonomous coding agent. The process is approved and done. This
          workflow steers itself through its own state files — treat them as its
          private scratchpad, never as project code or documentation. The only
          state file this turn touches is `<%= it.vars.commitMsgFile %>`; write
          it. Do not create other files to hold notes or output.

          Leave `<%= it.vars.commitMsgFile %>` uncommitted and finish your turn —
          entering this file squashes everything this process retains into one
          commit using its content as the message. This prompt carries no diff —
          if you built that range yourself earlier in this conversation, work from
          what you already know; otherwise read the range yourself. It runs from
          `<%= it.retainedBase %>` to the working tree, and is exactly what that
          commit will contain, the changes THIS process made (its trace/retry
          boundary onward). For a normal build
          process that is the whole feature; for a `gtd --entry review-gate.check`
          process it is only the fixes made during the review — NOT the changeset
          that was under review.

          If that range is non-empty, write `<%= it.vars.commitMsgFile %>` with ONE
          conventional-commits message for the changes (subject line
          `type(scope): subject`, imperative mood, <= 72 characters; a body
          explaining the why, trade-offs, and key decisions). Plain text, no
          markdown wrapper.

          If that range is empty (a clean review sign-off with no fixes), write
          `<%= it.vars.commitMsgFile %>` with exactly this one line and nothing
          else:

          chore: human review
        on:
          "A <%= it.vars.commitMsgFile %>": $onDone
          "M <%= it.vars.commitMsgFile %>": $onDone

      fix:
        actor: agent
        label: Fixing the check
        file: <%= it.vars.feedbackFile %>
        prompt: |
          You are an autonomous coding agent. This workflow steers itself
          through its own state files — treat them as its private scratchpad,
          never as project code or documentation. The only state file this
          turn touches is `<%= it.vars.feedbackFile %>`; fix it per its
          contents, or delete it if the feedback turns out to be wrong. Do not
          create other files to hold notes or output.

          Read `<%= it.vars.feedbackFile %>` (the failing test output) and fix the
          code so the suite passes. Keep the change focused — do not refactor
          unrelated code. If the feedback is wrong, empty or delete
          `<%= it.vars.feedbackFile %>` instead of "fixing" a non-issue.

          Leave everything uncommitted and finish your turn — do not commit.
        retry:
          max: 3
          otherwise: health.escalate
        on:
          "* **": health.check

      # Shared health pair: build.health.check/.escalate -> build.review.reviewing
      # (green) or build.fix (red).
      health:
        machine: healthGate
        with:
          onGreen: review
          onRed: fix
          escalateDescribe: >-
            edit the code and/or `.gtd/FEEDBACK.md` yourself
            (**build.health.check**).
          checkLabel: Running checks
          escalateLabel: Escalating to a human

      # The shared review tail, nested HERE (not at the root) so `squashing`
      # stays inside the builder's own scope on sign-off — see the header
      # comment. Sign-off -> squashing; feedback -> $onFeedback, bound at the
      # root's own `build:` reference to `re-unwind` (a root-local, not a
      # descendant of this machine — the review tail's own scope ends here on
      # the actionable path).
      review:
        machine: humanReview
        with:
          onSignoff: squashing
          onFeedback: $onFeedback

  # The root machine — the whole one-flow tree described in this file's
  # header comment. WIRING ONLY: no identity of its own, just the shared
  # entry/exit states and the top-level machine tree.
  unified:
    entry: idle
    states:
      # ── Shared entry ────────────────────────────────────────────────────────
      idle:
        actor: human
        label: Idle
        file: <%= it.vars.todoFile %>
        # Every human-gate `message:` below closes with the same rendered "What
        # each change does next" list, built from `it.edges` (the resting state's
        # own `on` edges — each edge's `describe:` is the single source of truth).
        message: |
          No active gtd process.

          To start one, make ANY change — a hand-edit to real code, a scratch
          note, anything at all. <%= it.vars.todoFile %> is a good default
          place to start sketching. gtd treats it as a SKETCH, not finished
          work: the very next beat unwinds it out of your working tree (its
          intent survives in history, for the triage phase to read), then
          checks the test baseline is green, then triages the reverted diff
          into ordered, classified concerns: product questions, then
          technical questions, then one package per concern, built and
          reviewed in parallel.

          What each change does next (then run `gtd land`):
          <% it.edges.forEach(function (e) { if (e.describe) { %>
          <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
          <% } }) %>
        on:
          "* **":
            to: unwind
            action: Start
            describe: >-
              make any change — gtd unwinds it out of your working tree (its
              intent survives in history) before checking the test baseline is
              green, then triages the reverted diff into ordered, classified
              concerns and resolves product questions, then technical ones,
              before building each concern's package (**unwind** ->
              **start-gate.check**).

      # ── Green-baseline gate: `gtd --entry fix-precheck` entry ─────────────────
      # `gtd --entry fix-precheck` enters HERE: run the suite, then a red run
      # drops straight into the shared `build.fix` loop (-> build.health.check ->
      # review + squash tail); a green run is a no-op back to `idle` (nothing
      # to fix). Aliases the `&suiteCheck` anchor defined on `entryGate.check`'s
      # own `script:` above — the same plain suite check `start-gate`/
      # `review-gate` run.
      fix-precheck:
        actor: check
        label: Checking the baseline
        entry: true
        script: *suiteCheck
        on:
          "A <%= it.vars.feedbackFile %>": build.fix
          "M <%= it.vars.feedbackFile %>": build.fix
          "D <%= it.vars.feedbackFile %>": idle
          "C": idle

      # ── Shared tail: the finale ─────────────────────────────────────────────
      done:
        commit: |
          <%~ it.read(it.vars.commitMsgFile) %>

          Token cost: <%= it.processCost %>
          <% it.processCostByModel.forEach(function(m){ %>
          - <%= m.model %>: <%= m.cost %>
          <% }) %>

      # ── Unwind: revert the entry commit's diff before planning starts ──────
      # Kept a SEPARATE state rather than folded into `start-gate.check`'s own
      # script: the `blocked -> check` retry edge re-runs the gate, so a
      # revert living there would discard the human's own baseline repair and
      # would need an idempotence guard. With exactly one inbound edge (from
      # `idle`), `unwind` is structurally reached once per process and needs
      # no guard at all. Names the reverted commit via `it.currentCommit`
      # (they're the same commit here), NOT a bare `HEAD` — pinning the
      # render-time hash keeps the script correct even if a driver runs it
      # late.
      unwind:
        actor: check
        label: Unwinding your input
        script: |
          #!/usr/bin/env bash
          # gtd check turn — revert the entry commit's diff out of the working
          # tree. Its content survives in history for design.triage to read.
          set +e
          # Hoist the commit hash once, at the TOP: Eta's autoTrim eats the
          # newline after an interpolation tag, so no tag may be the last
          # token on a line.
          commit="<%~ it.currentCommit %>"
          git revert --no-commit "$commit"
        on:
          "* **": start-gate

      # ── Re-unwind: revert an actionable review round's hand-edit before ────
      # re-planning starts. A SECOND unwind-shaped state, not a second inbound
      # edge on `unwind` above: `unwind`'s own doc comment turns on it having
      # exactly one inbound edge (from `idle`), which is why it carries no
      # idempotence guard — adding a second caller there would break that
      # invariant. Names the reverted commit via `it.reviewBase`, never
      # `it.currentCommit` (by now that names the assembly turn's own commit)
      # and never a bare `HEAD`: `reviewBaseFor` walks the process trace
      # backwards for the last commit that ENTERED a `reviewBase: true` state
      # — `build.review.deciding` is the template's only one — which is
      # exactly the human's own `await-review -> deciding` commit, the same
      # hash the next review round's incremental base already uses.
      #
      # SCOPED, not wholesale: `deciding` already `rm -f`'d the review file,
      # so a plain `git revert --no-commit` would resurrect it (and conflict
      # on it). Instead this renders that ONE commit's diff with `stateDir`
      # and `reviewFile` excluded from the pathspec (the review file by exact
      # path, since it is var-configurable and may sit at the repo root —
      # issue #128) and reverse-applies it. The apply is EXPECTED to succeed —
      # nothing between that commit and now touches a code path — but it can
      # still FAIL: a clean-filter round-trip, a drifted worktree, or a binary
      # path can all make `git apply -R` a no-op on an otherwise-clean tree,
      # indistinguishable from a legitimate note-only round. `requireRevert`
      # (below) is what catches that: its step-capture guard
      # (`src/StepGuards.ts`) re-establishes the fact from the tree itself —
      # comparing the human's own commit's paths against the review base's
      # parent — and refuses the step while residue remains, rather than
      # trusting the script's swallowed exit code. A note-only round's patch
      # is EMPTY, and `git apply` on empty input FAILS ("No valid patches in
      # input"), hence the `-s` guard rather than `--allow-empty` (which would
      # impose git >= 2.35). The apply is worktree-only, no `--index`: the
      # emitted step script's own `git add -A && git commit` stages it, and
      # `changedPaths` answers by CONTENT, so an unstaged revert is still the
      # pending diff the pattern matches — one fewer index write in a
      # worktree gtd shares with the editor's SCM. The patch file lives under
      # `stateDir` (excluded from its own pathspec, the same precedent as the
      # check scripts' own `.check-output`) and is removed before the step
      # lands.
      #
      # Both `on` rows target the SAME place (`design`) because either shape
      # is a legitimate outcome here, never a stall: a hand-edited round's
      # patch is non-empty, so the revert leaves a dirty tree (the `"* **"`
      # row); a note-only round's patch is empty, so nothing to apply leaves
      # a CLEAN tree — and a clean tree at a `script` state with no `C` row
      # would otherwise be a silent no-op that never advances. Declaring `C`
      # here makes that the expected, terminating case instead.
      #
      # `file: <%= it.vars.reviewFile %>` + `requireRevert: true` exist ONLY
      # to give the require-revert guard the path it must exempt from residue
      # (the engine blesses no variable names, so the guard reads `Rest.hints.
      # file`, never `it.vars.reviewFile` itself) — the review file is already
      # gone two commits earlier, so this state never renders it. The accepted
      # presentational cost: `gtd next --json`/`gtd status --json` carry that
      # already-deleted path as this state's `file:` hint, and the visualizer
      # labels `re-unwind` with it too. Bounded — `Lsp.ts`'s `buildSteeringMap`
      # skips a mode-less state, so `re-unwind` contributes no path→mode entry
      # and raises no "already mapped by an earlier state" warning against
      # `await-review`/`deciding`, which declare the same rendered path with
      # `mode: review`.
      re-unwind:
        actor: check
        label: Re-unwinding your review edit
        file: <%= it.vars.reviewFile %>
        requireRevert: true
        script: |
          #!/usr/bin/env bash
          # gtd check turn — revert the human's own review edit out of the
          # working tree, scoped to real code: stateDir and reviewFile
          # (var-configurable, may live at the repo root — issue #128) are
          # excluded, because the review file is already gone by this point
          # and reverting it would resurrect it. The human's intent survives
          # in their own commit for the triage phase to read. The apply is
          # EXPECTED to succeed — nothing between that commit and now touches
          # a code path — but it can still fail on a clean-filter round-trip,
          # a drifted worktree, or a binary path: the `requireRevert`
          # step-capture guard (src/StepGuards.ts) catches that by
          # re-checking the tree itself before this step is allowed to land.
          set +e
          commit="<%~ it.reviewBase %>"
          stateDir="<%~ it.vars.stateDir %>"
          reviewFile="<%~ it.vars.reviewFile %>"
          patch="$stateDir/.re-unwind.patch"
          mkdir -p "$stateDir"
          git diff --binary "$commit^" "$commit" -- . \
            ":(exclude)$stateDir" ":(exclude)$reviewFile" > "$patch"
          if [ -s "$patch" ]; then
            git apply -R "$patch" || echo "re-unwind: could not revert $commit" >&2
          fi
          rm -f "$patch"
        on:
          "* **": design # a code hand-edit was reverted
          "C": design # note-only round: nothing to revert

      # ── Green-baseline gate: the single start entry. ───────────────────────
      # Runs on the tree AFTER `unwind`, so this is now just the ordinary
      # green-baseline check `review-gate`/`fix-precheck` also run — no
      # baseline-aware second run, no detached checkout, no HEAD move
      # anywhere in gtd's emitted scripts any more.
      start-gate:
        machine: entryGate
        with:
          onGreen: design
          reviewBase: ""
          blockedMessage: |
            The test baseline is red — gtd will not start new work on a broken suite.
            `<%= it.vars.feedbackFile %>` holds the failing output.

            What each change does next (then run `gtd land`):
            <% it.edges.forEach(function (e) { if (e.describe) { %>
            <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
            <% } }) %>
          blockedDescribe: >-
            edit the code and/or `.gtd/FEEDBACK.md` to fix the failing tests
            (**start-gate.check**). To repair the baseline as its own separate
            reviewed commit instead, abandon this start and run
            `gtd --entry fix-precheck` from a clean `idle`.
          checkLabel: Checking the baseline
          blockedLabel: Baseline is red

      # ── Green-baseline gate: `gtd --entry review-gate.check` entry -> build.review.reviewing. ─
      review-gate:
        machine: entryGate
        with:
          onGreen: build.review
          reviewBase: <%= it.vars.reviewBase %>
          blockedMessage: |
            The test baseline is red — gtd will not start a review on a broken suite.
            `<%= it.vars.feedbackFile %>` holds the failing output.

            What each change does next (then run `gtd land`):
            <% it.edges.forEach(function (e) { if (e.describe) { %>
            <%~ "- " + (e.action ? "**" + e.action + "** — " : "") + e.describe + "\n" %>
            <% } }) %>
          blockedDescribe: >-
            edit the code and/or `.gtd/FEEDBACK.md` to fix the failing tests
            (**review-gate.check**).
          checkLabel: Checking the baseline
          blockedLabel: Baseline is red

      # ── The triage phase (design.triage -> design.gate.check/.answer -> architecture). ──
      design:
        machine: designPlan
        with:
          onArchitecture: architecture

      # ── The technical phase (architecture.author -> architecture.gate.check/.answer ─
      # -> architecture.decompose -> packages). ──────────────────────────────
      architecture:
        machine: archPlan
        with:
          onPackages: packages

      # ── The per-package build queue (packages.* -> build.review). ─────────────
      packages:
        machine: packageLoop
        with:
          onDrained: build.review

      # ── The process's build identity (build.* -> build.review -> done). ───────
      build:
        machine: buildTail
        with:
          onDone: done
          onFeedback: re-unwind
