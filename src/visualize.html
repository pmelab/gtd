<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gtd · workflow visualizer</title>
    <style>
      :root {
        --bg: #f4f6fa;
        --surface: #ffffff;
        --surface-2: #eef1f7;
        --surface-3: #e6ebf3;
        --border: #d9dee8;
        --border-strong: #c2ccdb;
        --text: #1a2233;
        --text-dim: #55607a;
        --text-faint: #8a93a6;
        --accent: #2d6cdf;
        --accent-soft: #e4edfd;
        --human-bg: #fbeccd;
        --human-fg: #7a5310;
        --human-dot: #d99413;
        --agent-bg: #e5e2fb;
        --agent-fg: #463693;
        --agent-dot: #6d5ce0;
        --check-bg: #d3f0ef;
        --check-fg: #0c524f;
        --check-dot: #16a39d;
        --engine-bg: #fbdfe4;
        --engine-fg: #8a1f38;
        --engine-dot: #d84a68;
        --unknown-bg: #eef1f7;
        --unknown-fg: #55607a;
        --unknown-dot: #8a93a6;
        --shadow: 0 1px 2px rgba(20, 30, 50, 0.06), 0 8px 28px rgba(20, 30, 50, 0.1);
        --shadow-sm: 0 1px 2px rgba(20, 30, 50, 0.08);
        --radius: 12px;
        --mono:
          ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
        --sans:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --dia-bg: #f7f9fc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1420;
          --surface: #161d2b;
          --surface-2: #1c2434;
          --surface-3: #232c3e;
          --border: #2b3547;
          --border-strong: #3a465c;
          --text: #e6ebf4;
          --text-dim: #9aa6bd;
          --text-faint: #6b7690;
          --accent: #5b8def;
          --accent-soft: #1b2740;
          --human-bg: #3a2e12;
          --human-fg: #f0c674;
          --human-dot: #e0a83e;
          --agent-bg: #26224a;
          --agent-fg: #b6abf7;
          --agent-dot: #8b7cf0;
          --check-bg: #123433;
          --check-fg: #68dcd4;
          --check-dot: #2dc4bc;
          --engine-bg: #3a1b24;
          --engine-fg: #f2a3b3;
          --engine-dot: #e05f7c;
          --unknown-bg: #1c2434;
          --unknown-fg: #9aa6bd;
          --unknown-dot: #6b7690;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 34px rgba(0, 0, 0, 0.45);
          --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
          --dia-bg: #0b1018;
        }
      }
      :root[data-theme="light"] {
        --bg: #f4f6fa;
        --surface: #ffffff;
        --surface-2: #eef1f7;
        --surface-3: #e6ebf3;
        --border: #d9dee8;
        --border-strong: #c2ccdb;
        --text: #1a2233;
        --text-dim: #55607a;
        --text-faint: #8a93a6;
        --accent: #2d6cdf;
        --accent-soft: #e4edfd;
        --human-bg: #fbeccd;
        --human-fg: #7a5310;
        --human-dot: #d99413;
        --agent-bg: #e5e2fb;
        --agent-fg: #463693;
        --agent-dot: #6d5ce0;
        --check-bg: #d3f0ef;
        --check-fg: #0c524f;
        --check-dot: #16a39d;
        --engine-bg: #fbdfe4;
        --engine-fg: #8a1f38;
        --engine-dot: #d84a68;
        --unknown-bg: #eef1f7;
        --unknown-fg: #55607a;
        --unknown-dot: #8a93a6;
        --shadow: 0 1px 2px rgba(20, 30, 50, 0.06), 0 8px 28px rgba(20, 30, 50, 0.1);
        --shadow-sm: 0 1px 2px rgba(20, 30, 50, 0.08);
        --dia-bg: #f7f9fc;
      }
      :root[data-theme="dark"] {
        --bg: #0e1420;
        --surface: #161d2b;
        --surface-2: #1c2434;
        --surface-3: #232c3e;
        --border: #2b3547;
        --border-strong: #3a465c;
        --text: #e6ebf4;
        --text-dim: #9aa6bd;
        --text-faint: #6b7690;
        --accent: #5b8def;
        --accent-soft: #1b2740;
        --human-bg: #3a2e12;
        --human-fg: #f0c674;
        --human-dot: #e0a83e;
        --agent-bg: #26224a;
        --agent-fg: #b6abf7;
        --agent-dot: #8b7cf0;
        --check-bg: #123433;
        --check-fg: #68dcd4;
        --check-dot: #2dc4bc;
        --engine-bg: #3a1b24;
        --engine-fg: #f2a3b3;
        --engine-dot: #e05f7c;
        --unknown-bg: #1c2434;
        --unknown-fg: #9aa6bd;
        --unknown-dot: #6b7690;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 34px rgba(0, 0, 0, 0.45);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
        --dia-bg: #0b1018;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        max-width: 100%;
        overflow-x: hidden;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: var(--accent);
        color: #fff;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 20px;
      }

      /* header */
      header.top {
        position: sticky;
        top: 0;
        z-index: 40;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
      }
      .top-inner {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 12px 20px;
        max-width: 1180px;
        margin: 0 auto;
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-right: auto;
      }
      .brand .cmd {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 17px;
        letter-spacing: -0.02em;
      }
      .brand .cmd b {
        color: var(--accent);
      }
      .brand .sub {
        font-size: 12px;
        color: var(--text-faint);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .summary {
        font-size: 12.5px;
        color: var(--text-dim);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .summary .s-num {
        font-family: var(--mono);
        font-weight: 700;
        color: var(--text);
      }
      .summary .sep {
        color: var(--border-strong);
      }
      .theme-btn {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-dim);
        border-radius: 8px;
        width: 32px;
        height: 32px;
        cursor: pointer;
        font-size: 14px;
        display: grid;
        place-items: center;
      }
      .theme-btn:hover {
        color: var(--text);
        border-color: var(--border-strong);
      }
      .theme-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* hero */
      .hero {
        padding: 40px 0 4px;
      }
      h1 {
        font-size: clamp(26px, 4vw, 36px);
        line-height: 1.08;
        letter-spacing: -0.025em;
        margin: 0 0 12px;
        font-weight: 780;
      }
      h1 .mono {
        font-family: var(--mono);
        font-weight: 700;
      }
      .lede {
        font-size: 16px;
        color: var(--text-dim);
        max-width: 70ch;
        margin: 0;
      }
      .lede code {
        font-family: var(--mono);
        font-size: 0.88em;
        background: var(--surface-2);
        padding: 1px 6px;
        border-radius: 5px;
        color: var(--text);
      }

      /* section headers */
      .sec-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin: 46px 0 4px;
      }
      .sec-head h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-faint);
        margin: 0;
        font-weight: 700;
      }
      .sec-head .rule {
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      /* diagram */
      .diagram-note {
        font-size: 13px;
        color: var(--text-dim);
        margin: 16px 0 14px;
        max-width: 78ch;
      }
      .diagram-note .mono {
        font-family: var(--mono);
      }
      .dia-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }
      .sm-card summary.h {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        cursor: pointer;
        list-style: none;
      }
      .sm-card summary::-webkit-details-marker {
        display: none;
      }
      .sm-card summary::after {
        content: "▸";
        color: var(--text-dim);
      }
      .sm-card[open] summary::after {
        content: "▾";
      }
      .dia-scroll {
        overflow-x: auto;
        background: var(--dia-bg);
        padding: 18px 16px;
      }
      .dia-scroll .mflow {
        min-width: min-content;
        display: flex;
        justify-content: center;
      }
      .dia-scroll .mflow svg {
        max-width: none;
        height: auto;
      }
      .dia-msg {
        padding: 22px 18px;
        font-size: 13.5px;
        color: var(--text-dim);
      }
      .dia-msg code {
        font-family: var(--mono);
        font-size: 12px;
        background: var(--surface-2);
        padding: 1px 6px;
        border-radius: 5px;
      }
      .dia-src {
        margin: 10px 0 0;
        padding: 12px 14px;
        background: var(--surface-2);
        border-radius: 9px;
        font-family: var(--mono);
        font-size: 11.5px;
        white-space: pre;
        overflow-x: auto;
        color: var(--text-dim);
        max-height: 260px;
      }

      /* sub-machines */
      .sm-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 14px;
        margin-top: 18px;
      }
      .sm-def {
        border: 1.5px dashed var(--border-strong);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }
      .sm-def .h {
        padding: 13px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-2);
      }
      .sm-def .h .nm {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 15px;
      }
      .sm-def .h .pm {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-dim);
        display: block;
        margin-top: 3px;
      }
      .sm-def .h .pm b {
        color: var(--accent);
      }
      .sm-def .body {
        padding: 12px 16px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .muted-note {
        color: var(--text-faint);
        font-style: italic;
        margin-top: 16px;
      }
      .sm-def .h {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .sm-def .h .goto-sm {
        font: inherit;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--accent);
        background: none;
        border: none;
        cursor: pointer;
        text-decoration: underline;
        padding: 0;
      }

      /* current-state panel */
      .current-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        padding: 18px 20px 20px;
        margin: 16px 0 34px;
      }
      .cur-head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        cursor: pointer;
      }
      .cur-name {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.01em;
      }
      .cur-none {
        color: var(--text-faint);
        font-style: italic;
      }
      .edge.cur-matched {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .cur-tag {
        font-family: var(--mono);
        font-size: 10.5px;
        font-weight: 700;
        color: var(--accent);
        background: var(--surface);
        border: 1px solid var(--accent);
        padding: 1px 7px;
        border-radius: 999px;
        margin-left: auto;
      }

      /* mermaid black-box / ghost node labels (rendered inside the SVG via htmlLabels) */
      .sm-hint {
        display: block;
        margin-top: 2px;
        font-size: 10.5px;
        opacity: 0.72;
        font-weight: 500;
      }

      /* the current-state highlight ring on a rendered SVG node/group box */
      g.node.gtd-current {
        filter: drop-shadow(0 0 6px var(--accent));
      }
      g.node.gtd-current > rect,
      g.node.gtd-current > polygon,
      g.node.gtd-current > circle,
      g.node.gtd-current > ellipse,
      g.node.gtd-current > path.basic {
        stroke: var(--accent) !important;
        stroke-width: 3px !important;
      }

      /* toolbar */
      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 18px 0 22px;
        flex-wrap: wrap;
      }
      .search {
        flex: 1;
        min-width: 200px;
        position: relative;
      }
      .search input {
        width: 100%;
        font-family: var(--mono);
        font-size: 14px;
        padding: 10px 12px 10px 34px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
      }
      .search input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .search svg {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-faint);
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip-btn {
        font: inherit;
        font-size: 12.5px;
        padding: 7px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-dim);
        cursor: pointer;
      }
      .chip-btn:hover {
        border-color: var(--border-strong);
        color: var(--text);
      }
      .chip-btn.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .chip-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .legend {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .legend .li {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        color: var(--text-dim);
        cursor: pointer;
        user-select: none;
        padding: 5px 9px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
      }
      .legend .li:hover {
        border-color: var(--border-strong);
      }
      .legend .li.off {
        opacity: 0.4;
      }
      .legend .li:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .legend .li .dot {
        width: 10px;
        height: 10px;
        border-radius: 3px;
      }

      /* groups + cards */
      .group {
        margin-bottom: 30px;
      }
      .group-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 0 0 12px;
      }
      .group-head h3 {
        font-family: var(--mono);
        font-size: 15px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .group-head .flow-tag {
        font-family: var(--mono);
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 6px;
        background: var(--surface-2);
        color: var(--text-dim);
        border: 1px solid var(--border);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 12px;
      }
      .card {
        text-align: left;
        font: inherit;
        color: var(--text);
        cursor: pointer;
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 4px solid var(--card-accent, var(--border));
        border-radius: 10px;
        padding: 13px 15px;
        box-shadow: var(--shadow-sm);
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease,
          border-color 0.12s ease;
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow);
      }
      .card:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .card[data-actor="human"] {
        --card-accent: var(--human-dot);
      }
      .card[data-actor="agent"] {
        --card-accent: var(--agent-dot);
      }
      .card[data-actor="check"] {
        --card-accent: var(--check-dot);
      }
      .card[data-actor="commit"] {
        --card-accent: var(--engine-dot);
      }
      .card[data-actor="unknown"] {
        --card-accent: var(--unknown-dot);
      }
      .card .name {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 14.5px;
        letter-spacing: -0.01em;
        word-break: break-word;
      }
      .card .row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .card .init-tick {
        position: absolute;
        top: 11px;
        right: 12px;
        font-size: 10px;
        font-family: var(--mono);
        color: var(--accent);
        background: var(--accent-soft);
        padding: 1px 6px;
        border-radius: 5px;
        font-weight: 700;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
      }
      .pill.actor-human {
        background: var(--human-bg);
        color: var(--human-fg);
      }
      .pill.actor-agent {
        background: var(--agent-bg);
        color: var(--agent-fg);
      }
      .pill.actor-check {
        background: var(--check-bg);
        color: var(--check-fg);
      }
      .pill.actor-engine {
        background: var(--engine-bg);
        color: var(--engine-fg);
      }
      .pill.actor-unknown {
        background: var(--unknown-bg);
        color: var(--unknown-fg);
      }
      .pill .dot {
        width: 7px;
        height: 7px;
        border-radius: 2px;
      }
      .pill.actor-human .dot {
        background: var(--human-dot);
      }
      .pill.actor-agent .dot {
        background: var(--agent-dot);
      }
      .pill.actor-check .dot {
        background: var(--check-dot);
      }
      .pill.actor-engine .dot {
        background: var(--engine-dot);
      }
      .pill.actor-unknown .dot {
        background: var(--unknown-dot);
      }
      .kind {
        font-family: var(--mono);
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 6px;
        border: 1px solid var(--border-strong);
        color: var(--text-dim);
        background: var(--surface-2);
      }
      .flag {
        font-family: var(--mono);
        font-size: 10.5px;
        padding: 1px 6px;
        border-radius: 5px;
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
        border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      }

      /* drawer */
      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(10, 16, 28, 0.5);
        backdrop-filter: blur(2px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s ease;
        z-index: 90;
      }
      .backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        width: min(560px, 100%);
        background: var(--surface);
        border-left: 1px solid var(--border);
        box-shadow: var(--shadow);
        transform: translateX(100%);
        transition: transform 0.26s cubic-bezier(0.22, 0.61, 0.36, 1);
        z-index: 100;
        display: flex;
        flex-direction: column;
      }
      .drawer.open {
        transform: translateX(0);
      }
      .drawer-head {
        padding: 18px 22px 14px;
        border-bottom: 1px solid var(--border);
        border-top: 4px solid var(--card-accent, var(--accent));
      }
      .drawer-head .top {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .drawer-head h3 {
        font-family: var(--mono);
        font-size: 20px;
        font-weight: 700;
        margin: 0;
        letter-spacing: -0.02em;
        word-break: break-word;
      }
      .drawer-head .meta-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .close-x {
        margin-left: auto;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text-dim);
        border-radius: 8px;

      }
      .close-x:hover {

      }
      .close-x:focus-visible {

      }
      .drawer-body {
        overflow-y: auto;
        padding: 20px 22px 40px;
        flex: 1;
      }
      .field {
        margin-bottom: 18px;
      }
      .field > .k {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.09em;

      .kv {

      .kv dt {

      .kv dd {

      .edges {

      .edge .er {

      .edge .pat {

      .edge .arr {

      .goto {

        cursor: pointer;
        border: 1px solid var(--card-accent, var(--accent));
        background: transparent;
        color: var(--card-accent, var(--accent));

      .goto[data-actor="agent"] {

      .edge .em {

      .incoming {

      .flag-list {

      /* vars */
      .vars-grid {

      .var-chip {

        border: 1px solid var(--border);

        color: var(--accent);

      footer {
        border-top: 1px solid var(--border);
        margin-top: 56px;

      .hidden {
        display: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
      }
      @media (max-width: 640px) {
        .brand .sub {
          display: none;
        }
        .kv {
          grid-template-columns: 74px 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <div class="brand">
          <span class="cmd"><b>gtd</b> · workflow visualizer</span>
          <span class="sub" id="brandSub">read-only view</span>
        </div>
        <div class="summary" id="summary"></div>
        <button
          class="theme-btn"
          id="themeBtn"
          title="Toggle light/dark theme"
          aria-label="Toggle light/dark theme"
        >
          ◐
        </button>
      </div>
    </header>

    <main class="wrap" id="app">
      <section class="hero">
        <h1 id="heroTitle">Loading workflow…</h1>
        <p class="lede" id="heroLede">
          Fetching <code>/workflow.json</code> from the local
          <span class="mono">gtd visualize</span> server.
        </p>
      </section>

      <div id="content" class="hidden">
        <div class="sec-head">
          <h2>Current state</h2>
          <span class="rule"></span>
        </div>
        <div class="current-panel hidden" id="currentPanel"></div>
        <div id="varsSection"></div>

        <div class="sec-head">
          <h2>Main flow</h2>
          <span class="rule"></span>
        </div>
        <p class="diagram-note" id="diaNote"></p>
        <div class="dia-card">
          <div class="dia-scroll" id="diaScroll"><div class="dia-msg">Rendering diagram…</div></div>
        </div>

        <div class="sec-head">
          <h2>Sub-machines</h2>
          <span class="rule"></span>
        </div>
        <div id="smSection"></div>

        <div class="sec-head">
          <h2>State catalogue</h2>
          <span class="rule"></span>
        </div>
        <div class="toolbar">
          <div class="search">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <input
              id="search"
              type="search"
              placeholder="filter by name, actor, kind, file, mode, flag…"
              autocomplete="off"
              spellcheck="false"
              aria-label="Filter states"
            />
          </div>
          <div class="chips" id="kindChips"></div>
          <div class="legend" id="legend"></div>
        </div>
        <div id="groups"></div>
      </div>
    </main>

    <div class="backdrop" id="backdrop"></div>
    <aside
      class="drawer"
      id="drawer"
      role="dialog"
      aria-modal="true"
      aria-label="State detail"
      tabindex="-1"
    ></aside>

    <footer class="wrap" id="footer"></footer>

    <script type="module">
      // ── theme ──────────────────────────────────────────────────────────────
      const root = document.documentElement
      const prefersDark = () => matchMedia("(prefers-color-scheme: dark)").matches
      const isDark = () => {
        const t = root.getAttribute("data-theme")
        return t ? t === "dark" : prefersDark()
      }
      document.getElementById("themeBtn").onclick = () => {
        const next = isDark() ? "light" : "dark"
        root.setAttribute("data-theme", next)
        reinitializeAndRenderAll()
      }

      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        )

      // Actor metadata: color class, css-var prefix, mermaid classDef name, label.
      const ACTOR = {
        human: { cls: "actor-human", dot: "human", label: "human" },
        agent: { cls: "actor-agent", dot: "agent", label: "agent" },
        check: { cls: "actor-check", dot: "check", label: "check" },
        commit: { cls: "actor-engine", dot: "engine", label: "commit" },
        unknown: { cls: "actor-unknown", dot: "unknown", label: "?" },
      }
      // A commit state has no actor — treat it as the engine/commit colour.
      const actorOf = (s) => s.actor || (s.kind === "commit" ? "commit" : "unknown")
      const meta = (a) => ACTOR[a] || ACTOR.unknown

      const FLAGS = {
        initial:
          "The one initial state — an unrecognized HEAD (any non-gtd history) resolves here.",
        reviewEntry:
          "This state is a dedicated CLI entry point (e.g. `gtd review <ref>`) that starts a brand-new process.",
        fixEntry:
          "This state is the `gtd fix` entry point — a red suite drops into the fixing loop, a green suite is a no-op.",
        reviewWindow:
          "While resting here, gtd opens the review checkout window: HEAD is rewound to the review base so the whole diff surfaces as ordinary uncommitted changes.",
        reviewBase:
          "Anchors the incremental review diff base — its most-recent in-process commit is where the next reviewing turn and checkout window start.",
        answerGate:
          "Edge gate: a step is refused while any open question in the steering file is not answered with exactly one tick.",
        requireProgress:
          "Edge gate: refuses a work-free turn that only deletes the instructions file (unless it held a NOTHING ACTIONABLE sentinel).",
      }

      // ── state ──────────────────────────────────────────────────────────────
      let MODEL = null
      let STATES = []
      let byName = {}
      let CURRENT = null
      let lastCurrentSig = undefined
      let mermaidMod = null

      // Fetches `/state.json`, updates `CURRENT`, and reports whether the
      // resolved body actually changed since the last call (compared on the
      // full JSON so an edge's `matched` flag flipping counts as a change too).
      async function refreshCurrent() {
        let next = null
        try {
          const res = await fetch("/state.json")
          const body = res.ok ? await res.json() : {}
          next = body && body.state ? body : null
        } catch (e) {
          next = null
        }
        const sig = JSON.stringify(next)
        if (sig === lastCurrentSig) return false
        lastCurrentSig = sig
        CURRENT = next
        return true
      }

      const actorFilter = new Set(["human", "agent", "check", "commit", "unknown"])
      let kindFilter = "all"

      // ── boot ─────────────────────────────────────────────────────────────
      try {
        const res = await fetch("/workflow.json")
        if (!res.ok) throw new Error("HTTP " + res.status)
        MODEL = await res.json()
      } catch (e) {
        document.getElementById("heroTitle").textContent = "Could not load workflow"
        document.getElementById("heroLede").innerHTML =
          "Fetching <code>/workflow.json</code> failed: " +
          esc(e.message) +
          '. This page must be served by <span class="mono">gtd visualize</span>.'
        throw e
      }

      // Resolved at page load, then re-polled every 3s (see `poll()` below) so
      // advancing the process shows up without a manual refresh. Tolerates a
      // 404/error (an older server) or an empty `{}` (no active process/not a repo).
      await refreshCurrent()

      STATES = MODEL.states || []
      byName = Object.fromEntries(STATES.map((s) => [s.name, s]))

      // ── header summary + hero ───────────────────────────────────────────
      const counts = { human: 0, agent: 0, check: 0, commit: 0, unknown: 0 }
      STATES.forEach((s) => {
        counts[actorOf(s)]++
      })
      const nGroups = (MODEL.groups || []).length
      const cnt = (a) =>
        counts[a] ? `<span><span class="s-num">${counts[a]}</span> ${meta(a).label}</span>` : ""
      document.getElementById("summary").innerHTML = [
        `<span><span class="s-num">${STATES.length}</span> states</span>`,
        `<span><span class="s-num">${nGroups}</span> sub-machine${nGroups === 1 ? "" : "s"}</span>`,
        `<span class="sep">·</span>`,
        cnt("human"),
        cnt("agent"),
        cnt("check"),
        cnt("commit"),
        cnt("unknown"),
      ]
        .filter(Boolean)
        .join(" ")

      document.getElementById("heroTitle").innerHTML =
        `A workflow of <span class="mono">${STATES.length}</span> states`
      document.getElementById("heroLede").innerHTML =
        `Rendered live from <code>/workflow.json</code>. The initial state is ` +
        `<code>${esc(MODEL.initial)}</code>. Click any state — in the diagram, a sub-machine chip, ` +
        `or the catalogue — to open its full definition, walk its outgoing edges, and see what routes into it.`
      document.getElementById("content").classList.remove("hidden")

      document.getElementById("footer").innerHTML =
        `Read-only view served by <code>gtd visualize</code>. Node shape = content kind ` +
        `(<span style="font-family:var(--mono)">([message])</span> · ` +
        `<span style="font-family:var(--mono)">[prompt]</span> · ` +
        `<span style="font-family:var(--mono)">{{script}}</span> · ` +
        `<span style="font-family:var(--mono)">[[commit]]</span>); colour = actor.`

      // ── pill helper ────────────────────────────────────────────────────
      const pill = (a) =>
        `<span class="pill ${meta(a).cls}"><span class="dot"></span>${meta(a).label}</span>`

      // ── mermaid source generation ──────────────────────────────────────
      // Safe, stable node ids (state names can contain hyphens etc.), with a
      // reverse lookup — needed to map a rendered SVG node's id back to its
      // state name when wiring clicks (see `nodeIdOf`/`wire*Clicks` below).
      const idFor = (() => {
        const map = new Map()
        const rev = new Map()
        const fn = (name) => {
          if (!map.has(name)) {
            const id = "n" + map.size
            map.set(name, id)
            rev.set(id, name)
          }
          return map.get(name)
        }
        fn.nameOf = (id) => rev.get(id)
        return fn
      })()
      const groupBoxId = (i) => "g" + i
      const groupIndexOf = (name) => (MODEL.groups || []).findIndex((g) => g.name === name)
      const shapeFor = (kind, label) => {
        const l = `"${label.replace(/"/g, "&quot;")}"`
        switch (kind) {
          case "message":
            return `(["${label.replace(/"/g, "&quot;")}"])`
          case "prompt":
            return `[${l}]`
          case "script":
            return `{{${l}}}`
          case "commit":
            return `[[${l}]]`
          default:
            return `[${l}]`
        }
      }
      const mlabel = (s) => `"${String(s).replace(/"/g, "&quot;").replace(/\|/g, "&#124;")}"`
      const CLASS_DEFS = [
        "classDef human fill:#fbeccd,stroke:#d99413,color:#5a3d0a;",
        "classDef agent fill:#e5e2fb,stroke:#6d5ce0,color:#3a2c85;",
        "classDef check fill:#d3f0ef,stroke:#16a39d,color:#0c524f;",
        "classDef commit fill:#fbdfe4,stroke:#d84a68,color:#8a1f38;",
        "classDef unknown fill:#eef1f7,stroke:#c2ccdb,color:#55607a,stroke-dasharray:4 3;",
        // Black-box sub-machine invocation: a fixed dark/opaque fill + light
        // text so it reads the same in both themes (deliberately theme-invariant
        // — it's meant to look like an opaque box, not follow the page's actor
        // palette).
        "classDef submachine fill:#1c2434,stroke:#4a5875,color:#eef1f7,font-weight:700;",
        // A muted, dashed ghost node standing in for a target OUTSIDE the
        // current diagram (a sub-machine diagram's external edge).
        "classDef external fill:#eef1f7,stroke:#c2ccdb,color:#55607a,stroke-dasharray:5 4;",
      ]

      /**
       * Build one flowchart's mermaid source over `states` (a diagram scope):
       * the whole machine for the main flow (`opts.scope` unset), or one
       * sub-machine's own member states (`opts.scope` = that group's name).
       * A member state whose innermost group differs from `opts.scope`
       * collapses into a black box for ITS group (handles a sub-machine
       * nested inside another); a target outside `states` entirely renders as
       * a muted, dashed ghost node instead (only possible in a sub-machine
       * diagram — the main flow's `states` is every state, so nothing is ever
       * "outside" it).
       */
      function buildFlowSrc(states, opts) {
        const scope = opts && opts.scope
        const inSet = new Set(states.map((s) => s.name))
        const lines = ["flowchart TD"]

        const unitOf = (name) => {
          const s = byName[name]
          if (s && s.group && s.group !== scope) return { kind: "box", group: s.group }
          return { kind: "node", name }
        }
        const unitId = (name) => {
          const u = unitOf(name)
          return u.kind === "box" ? groupBoxId(groupIndexOf(u.group)) : idFor(name)
        }

        const emittedNodes = new Set()
        const emittedBoxes = new Set()
        const emittedGhosts = new Set()
        const nodeLine = (s) => `  ${idFor(s.name)}${shapeFor(s.kind, s.name)}:::${actorOf(s)}`
        const boxLine = (g, i) =>
          `  ${groupBoxId(i)}["${esc(g.name)}<br/><span class='sm-hint'>▸ ${g.states.length} state${
            g.states.length === 1 ? "" : "s"
          }</span>"]:::submachine`
        const ghostLine = (s) => `  e${idFor(s.name)}${shapeFor(s.kind, s.name)}:::external`

        states.forEach((s) => {
          const u = unitOf(s.name)
          if (u.kind === "node") {
            if (emittedNodes.has(s.name)) return
            emittedNodes.add(s.name)
            lines.push(nodeLine(s))
          } else if (!emittedBoxes.has(u.group)) {
            emittedBoxes.add(u.group)
            const i = groupIndexOf(u.group)
            if (i >= 0) lines.push(boxLine(MODEL.groups[i], i))
          }
        })

        // Edges within this diagram's own state set, collapsed through box
        // units, deduped, and label-dropped when several patterns land on the
        // same box-level edge (a black box hides which one specifically).
        const solid = new Map()
        const dashed = new Map()
        const addEdge = (map, from, to, label) => {
          if (from === to) return
          const key = from + " " + to
          if (!map.has(key)) map.set(key, [])
          map.get(key).push(label)
        }
        states.forEach((s) => {
          ;(s.on || []).forEach((e) => {
            if (!inSet.has(e.to) || !byName[e.to]) return
            addEdge(solid, unitId(s.name), unitId(e.to), e.pattern)
          })
          if (s.retry && inSet.has(s.retry.otherwise)) {
            addEdge(dashed, unitId(s.name), unitId(s.retry.otherwise), "retry ×" + s.retry.max)
          }
        })
        // Ghost edges to a target entirely outside this diagram's state set
        // (only fires for a sub-machine diagram — the main flow's set is
        // every state, so nothing is ever "outside" it).
        states.forEach((s) => {
          ;(s.on || []).forEach((e) => {
            if (inSet.has(e.to) || !byName[e.to]) return
            const target = byName[e.to]
            if (!emittedGhosts.has(e.to)) {
              emittedGhosts.add(e.to)
              lines.push(ghostLine(target))
            }
            lines.push(`  ${idFor(s.name)} -->|${mlabel(e.pattern)}| e${idFor(e.to)}`)
          })
          if (s.retry && byName[s.retry.otherwise] && !inSet.has(s.retry.otherwise)) {
            const target = byName[s.retry.otherwise]
            if (!emittedGhosts.has(s.retry.otherwise)) {
              emittedGhosts.add(s.retry.otherwise)
              lines.push(ghostLine(target))
            }
            lines.push(
              `  ${idFor(s.name)} -.->|${mlabel("retry ×" + s.retry.max)}| e${idFor(s.retry.otherwise)}`,
            )
          }
        })

        solid.forEach((labels, key) => {
          const [from, to] = key.split(" ")
          const label = labels.length === 1 ? mlabel(labels[0]) : null
          lines.push(`  ${from} -->${label ? "|" + label + "|" : ""} ${to}`)
        })
        dashed.forEach((labels, key) => {
          const [from, to] = key.split(" ")
          const label = labels.length === 1 ? mlabel(labels[0]) : null
          lines.push(`  ${from} -.->${label ? "|" + label + "|" : ""} ${to}`)
        })

        lines.push(...CLASS_DEFS)
        return lines.join("\n")
      }

      document.getElementById("diaNote").innerHTML =
        `Every state as a node — shape is the content kind, colour is the actor. Each edge is an ` +
        `<span class="mono">on</span> pattern (first match wins); dashed edges are ` +
        `<span class="mono">retry</span> redirects. A sub-machine invocation collapses into a single ` +
        `dark box (click it to jump to its own diagram below); an edge label is dropped when several ` +
        `patterns collapse onto the same box-to-box edge. Scrolls horizontally if wide.`

      // ── diagram render (theme-aware, offline-tolerant) ─────────────────
      async function loadMermaid() {
        if (mermaidMod) return mermaidMod
        const m = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs")
        mermaidMod = m.default
        return mermaidMod
      }

      const renderSeqByBase = new Map()
      const nextSeq = (base) => {
        const n = (renderSeqByBase.get(base) || 0) + 1
        renderSeqByBase.set(base, n)
        return n
      }

      /** Render `src` into `host` via mermaid, guarding against a stale (superseded) render; falls back to a readable error + raw source on failure. Returns the mermaid render id used (so the caller can wire clicks/highlight against ITS OWN node ids), or `null` if nothing rendered. */
      async function renderInto(host, src, renderIdBase) {
        const seq = nextSeq(renderIdBase)
        let mermaid
        try {
          mermaid = await loadMermaid()
        } catch (e) {
          host.innerHTML =
            `<div class="dia-msg">Could not load the Mermaid renderer (offline?). ` +
            `The workflow is still fully browsable below. Diagram source:` +
            `<pre class="dia-src">${esc(src)}</pre></div>`
          return null
        }
        if (seq !== renderSeqByBase.get(renderIdBase)) return null
        const renderId = renderIdBase + seq
        try {
          const { svg } = await mermaid.render(renderId, src)
          if (seq !== renderSeqByBase.get(renderIdBase)) return null
          host.innerHTML = `<div class="mflow">${svg}</div>`
          return renderId
        } catch (e) {
          host.innerHTML =
            `<div class="dia-msg">Diagram render failed: ${esc(e.message)}. ` +
            `Diagram source:<pre class="dia-src">${esc(src)}</pre></div>`
          return null
        }
      }

      // Every live diagram (main + one per sub-machine) — re-rendered as a
      // group on every theme toggle (replaces the old single DIAGRAM_SRC).
      const diagrams = []
      function registerDiagram(host, src, renderIdBase, onRendered, highlight) {
        diagrams.push({ host, src, renderIdBase, onRendered, highlight, lastRenderId: null })
      }
      async function renderAllDiagrams() {
        for (const d of diagrams) {
          const renderId = await renderInto(d.host, d.src, d.renderIdBase)
          if (renderId) d.lastRenderId = renderId
          if (renderId && d.onRendered) d.onRendered(renderId, d.host)
        }
      }
      async function reinitializeAndRenderAll() {
        const mermaid = await loadMermaid().catch(() => null)
        if (mermaid) {
          const dark = isDark()
          mermaid.initialize({
            startOnLoad: false,
            theme: "base",
            securityLevel: "strict",
            flowchart: { useMaxWidth: false, htmlLabels: true },
            themeVariables: {
              fontFamily: "ui-monospace, Menlo, monospace",
              fontSize: "12.5px",
              lineColor: dark ? "#6b7690" : "#8a93a6",
              primaryBorderColor: dark ? "#3a465c" : "#c2ccdb",
              tertiaryColor: dark ? "#1c2434" : "#f0f3f8",
              mainBkg: dark ? "#232c3e" : "#ffffff",
              clusterBkg: dark ? "#1c2434" : "#f0f3f8",
              clusterBorder: dark ? "#3a465c" : "#c2ccdb",
              titleColor: dark ? "#e6ebf4" : "#1a2233",
              nodeTextColor: dark ? "#e6ebf4" : "#1a2233",
              textColor: dark ? "#e6ebf4" : "#1a2233",
              edgeLabelBackground: dark ? "#161d2b" : "#f4f6fa",
            },
          })
        }
        await renderAllDiagrams()
      }

      // ── click wiring + current-state highlight (post-render — mermaid's own
      // `click` callbacks are disabled by securityLevel:"strict") ──────────
      // A rendered node group's `id` is `${renderId}-flowchart-${ourNodeId}-<n>`
      // (verified against mermaid@11's actual output) — strip that wrapper to
      // recover the id we generated the diagram with.
      function nodeIdOf(el, renderId) {
        const prefix = renderId + "-flowchart-"
        if (!el.id || !el.id.startsWith(prefix)) return null
        const m = /^(.+)-\d+$/.exec(el.id.slice(prefix.length))
        return m ? m[1] : null
      }
      const nodeGroupsOf = (host) => [...host.querySelectorAll("g.node")]

      function scrollToSubmachine(i) {
        const el = document.getElementById("sm-" + i)
        if (!el) return
        el.open = true
        el.scrollIntoView({ behavior: "smooth", block: "start" })
      }
      function navigateTo(name) {
        const s = byName[name]
        if (s && s.group) {
          const gi = groupIndexOf(s.group)
          if (gi >= 0) return scrollToSubmachine(gi)
        }
        openDrawer(name)
      }

      function applyCurrentHighlight(renderId, host, mode, gi) {
        if (!CURRENT || !CURRENT.state) return
        const wantId =
          mode === "main"
            ? CURRENT.group
              ? groupBoxId(groupIndexOf(CURRENT.group))
              : idFor(CURRENT.state)
            : CURRENT.group === MODEL.groups[gi].name
              ? idFor(CURRENT.state)
              : null
        if (wantId === null) return
        nodeGroupsOf(host).forEach((el) => {
          if (nodeIdOf(el, renderId) === wantId) el.classList.add("gtd-current")
        })
      }

      // Re-applies the current-state highlight to every already-rendered
      // diagram, without re-running mermaid — used by the poll loop below.
      function repaintHighlights() {
        for (const d of diagrams) {
          nodeGroupsOf(d.host).forEach((el) => el.classList.remove("gtd-current"))
          if (d.lastRenderId && d.highlight) {
            applyCurrentHighlight(d.lastRenderId, d.host, d.highlight.mode, d.highlight.gi)
          }
        }
      }

      function wireMainDiagramClicks(renderId, host) {
        nodeGroupsOf(host).forEach((el) => {
          const rawId = nodeIdOf(el, renderId)
          if (!rawId) return
          el.classList.add("clickable")
          el.style.cursor = "pointer"
          if (rawId[0] === "g") {
            el.onclick = () => scrollToSubmachine(Number(rawId.slice(1)))
          } else {
            const name = idFor.nameOf(rawId)
            if (name) el.onclick = () => openDrawer(name)
          }
        })
        applyCurrentHighlight(renderId, host, "main")
      }

      function wireSubmachineDiagramClicks(renderId, host, gi) {
        nodeGroupsOf(host).forEach((el) => {
          const rawId = nodeIdOf(el, renderId)
          if (!rawId) return
          el.classList.add("clickable")
          el.style.cursor = "pointer"
          if (rawId[0] === "g") {
            el.onclick = () => scrollToSubmachine(Number(rawId.slice(1)))
          } else if (rawId[0] === "e") {
            const name = idFor.nameOf(rawId.slice(1))
            if (name) el.onclick = () => navigateTo(name)
          } else {
            const name = idFor.nameOf(rawId)
            if (name) el.onclick = () => openDrawer(name)
          }
        })
        applyCurrentHighlight(renderId, host, "submachine", gi)
      }

      // ── main flow ────────────────────────────────────────────────────────
      registerDiagram(
        document.getElementById("diaScroll"),
        buildFlowSrc(STATES, {}),
        "gtdmain",
        wireMainDiagramClicks,
        { mode: "main" },
      )

      // ── sub-machines panel — one real mermaid diagram per invocation ─────
      ;(function renderSubmachines() {
        const el = document.getElementById("smSection")
        const groups = MODEL.groups || []
        if (!groups.length) {
          el.innerHTML = `<p class="muted-note">This workflow declares no sub-machines.</p>`
          return
        }
        el.innerHTML = ""
        groups.forEach((g, i) => {
          const card = document.createElement("details")
          card.className = "dia-card sm-card"
          card.id = "sm-" + i
          card.style.marginBottom = "16px"
          if (CURRENT && CURRENT.group === g.name) card.open = true
          card.innerHTML =
            `<summary class="h"><span class="nm">${esc(g.name)} · instantiates <b>${esc(g.submachine)}</b></span></summary>` +
            `<div class="dia-scroll" id="smDia${i}"><div class="dia-msg">Rendering diagram…</div></div>`
          el.appendChild(card)

          const members = (g.states || []).map((n) => byName[n]).filter(Boolean)
          registerDiagram(
            card.querySelector(`#smDia${i}`),
            buildFlowSrc(members, { scope: g.name }),
            "gtdsm" + i + "-",
            (renderId, host) => wireSubmachineDiagramClicks(renderId, host, i),
            { mode: "submachine", gi: i },
          )
        })
      })()

      // ── vars ─────────────────────────────────────────────────────────────
      ;(function renderVars() {
        const vars = MODEL.vars || {}
        const keys = Object.keys(vars)
        if (!keys.length) return
        const el = document.getElementById("varsSection")
        el.innerHTML =
          `<div class="sec-head"><h2>Workflow variables</h2><span class="rule"></span></div>` +
          `<div class="vars-grid">${keys
            .map((k) => `<span class="var-chip"><b>${esc(k)}</b> = ${esc(vars[k])}</span>`)
            .join("")}</div>`
      })()

      // ── current-state panel ─────────────────────────────────────────────
      function renderCurrentPanel() {
        const panel = document.getElementById("currentPanel")
        if (!CURRENT || !CURRENT.state) {
          panel.classList.add("hidden")
          return
        }
        panel.classList.remove("hidden")
        const a = CURRENT.actor
        const edgeRow = (pattern, to, matched, retryOf) => {
          const t = byName[to]
          return (
            `<div class="edge${matched ? " cur-matched" : ""}"><div class="er">` +
            `<span class="pat">${retryOf ? "after " + esc(retryOf) + " tries" : "if " + esc(pattern)}</span>` +
            `<span class="arr">→</span>` +
            `<button class="goto" data-actor="${t ? actorOf(t) : "unknown"}" data-to="${esc(to)}">${esc(to)}</button>` +
            `${matched ? '<span class="cur-tag">current match</span>' : ""}</div></div>`
          )
        }
        const rows = (CURRENT.edges || []).map((e) => edgeRow(e.pattern, e.to, e.matched)).join("")
        const retryRow = CURRENT.retry
          ? edgeRow(null, CURRENT.retry.otherwise, false, CURRENT.retry.max)
          : ""
        panel.innerHTML =
          `<div class="cur-head"><span class="cur-name">${esc(CURRENT.state)}</span>` +
          `${pill(a)}<span class="kind">${esc(CURRENT.kind)}</span>` +
          `${CURRENT.group ? `<span class="flow-tag">${esc(CURRENT.group)}</span>` : ""}</div>` +
          `<div class="edges" style="margin-top:14px">${
            rows || retryRow ? rows + retryRow : '<p class="none">No outgoing edges declared.</p>'
          }</div>`
        panel.querySelector(".cur-head").onclick = () => navigateTo(CURRENT.state)
        panel.querySelectorAll(".goto").forEach((b) => (b.onclick = () => navigateTo(b.dataset.to)))
      }
      renderCurrentPanel()

      reinitializeAndRenderAll()

      // ── live current-state polling ──────────────────────────────────────
      // Keeps the panel + diagram highlight in sync with an in-progress
      // process without a manual page refresh. Skipped while the tab is
      // hidden; becoming visible again triggers an immediate refresh. No
      // in-flight guard — a slow tick just means the next one also awaits.
      async function poll() {
        if (document.hidden) return
        const changed = await refreshCurrent()
        if (changed) {
          renderCurrentPanel()
          repaintHighlights()
        }
      }
      setInterval(poll, 3000)
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) poll()
      })

      // ── kind chips + actor legend ──────────────────────────────────────
      const kindChipsEl = document.getElementById("kindChips")
      const presentKinds = ["all", ...Array.from(new Set(STATES.map((s) => s.kind)))]
      presentKinds.forEach((k) => {
        const b = document.createElement("button")
        b.className = "chip-btn" + (k === "all" ? " on" : "")
        b.textContent = k
        b.dataset.kind = k
        b.onclick = () => {
          kindFilter = k
          ;[...kindChipsEl.children].forEach((c) =>
            c.classList.toggle("on", c.dataset.kind === kindFilter),
          )
          renderCatalogue()
        }
        kindChipsEl.appendChild(b)
      })

      const legendEl = document.getElementById("legend")
      ;["human", "agent", "check", "commit", "unknown"].forEach((a) => {
        if (!counts[a]) return
        const el = document.createElement("button")
        el.className = "li"
        el.dataset.actor = a
        el.setAttribute("aria-pressed", "true")
        el.innerHTML = `<span class="dot" style="background:var(--${meta(a).dot}-dot)"></span>${meta(a).label}`
        el.onclick = () => {
          const on = actorFilter.has(a)
          on ? actorFilter.delete(a) : actorFilter.add(a)
          el.classList.toggle("off", on)
          el.setAttribute("aria-pressed", String(!on))
          renderCatalogue()
        }
        legendEl.appendChild(el)
      })

      // ── catalogue ──────────────────────────────────────────────────────
      const groupsEl = document.getElementById("groups")
      function stateMatches(s, q) {
        if (!actorFilter.has(actorOf(s))) return false
        if (kindFilter !== "all" && s.kind !== kindFilter) return false
        if (!q) return true
        const hay = [
          s.name,
          s.actor,
          s.kind,
          s.file,
          s.mode,
          s.model,
          s.memory,
          (s.flags || []).join(" "),
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase()
        return hay.includes(q)
      }
      function cardFor(s) {
        const a = actorOf(s)
        const card = document.createElement("button")
        card.className = "card"
        card.dataset.actor = a
        const flags = (s.flags || [])
          .filter((f) => f !== "initial")
          .map((f) => `<span class="flag">${esc(f)}</span>`)
          .join("")
        const retry = s.retry ? `<span class="flag">retry ${s.retry.max}</span>` : ""
        const initTick = s.initial ? `<div class="init-tick">initial</div>` : ""
        card.innerHTML =
          `${initTick}<div class="name">${esc(s.name)}</div>` +
          `<div class="row">${pill(a)}<span class="kind">${esc(s.kind)}</span>${retry}${flags}</div>`
        card.onclick = () => openDrawer(s.name)
        return card
      }
      function renderCatalogue() {
        const q = document.getElementById("search").value.trim().toLowerCase()
        groupsEl.innerHTML = ""
        const sections = []
        ;(MODEL.groups || []).forEach((g) => {
          sections.push({
            label: g.name,
            flow: g.submachine,
            items: STATES.filter((s) => s.group === g.name),
          })
        })
        const ungrouped = STATES.filter((s) => !s.group)
        if (ungrouped.length) sections.push({ label: "Ungrouped", flow: "", items: ungrouped })

        let shown = 0
        sections.forEach((sec) => {
          const items = sec.items.filter((s) => stateMatches(s, q))
          if (!items.length) return
          shown += items.length
          const wrap = document.createElement("div")
          wrap.className = "group"
          wrap.innerHTML =
            `<div class="group-head">${sec.flow ? `<span class="flow-tag">${esc(sec.flow)}</span>` : ""}` +
            `<h3>${esc(sec.label)}</h3></div>`
          const grid = document.createElement("div")
          grid.className = "grid"
          items.forEach((s) => grid.appendChild(cardFor(s)))
          wrap.appendChild(grid)
          groupsEl.appendChild(wrap)
        })
        if (!shown)
          groupsEl.innerHTML = `<p class="none" style="padding:20px 0">No states match this filter.</p>`
      }
      document.getElementById("search").addEventListener("input", renderCatalogue)
      renderCatalogue()

      // ── drawer ─────────────────────────────────────────────────────────
      const drawer = document.getElementById("drawer")
      const backdrop = document.getElementById("backdrop")
      let lastFocus = null

      function openDrawer(name) {
        const s = byName[name]
        if (!s) return
        const a = actorOf(s)
        if (!drawer.classList.contains("open")) lastFocus = document.activeElement

        const kv = []
        kv.push(["actor", pill(a)])
        kv.push(["kind", `<span class="kind">${esc(s.kind)}</span>`])
        kv.push(["model", s.model ? esc(s.model) : '<span class="none">—</span>'])
        kv.push(["memory", s.memory ? esc(s.memory) : '<span class="none">—</span>'])
        kv.push(["file", s.file ? esc(s.file) : '<span class="none">—</span>'])
        kv.push(["mode", s.mode ? esc(s.mode) : '<span class="none">—</span>'])
        if (s.retry)
          kv.push([
            "retry",
            `max ${s.retry.max} → <span style="color:var(--accent)">${esc(s.retry.otherwise)}</span>`,
          ])
        if (s.group) kv.push(["group", esc(s.group)])

        const flags = s.flags || []
        const flagBlock = flags.length
          ? `<div class="field"><div class="k">flags & gates</div><div class="flag-list">${flags
              .map(
                (f) =>
                  `<div class="flag-item"><span class="fn">${esc(f)}</span><span class="fd">${esc(FLAGS[f] || "")}</span></div>`,
              )
              .join("")}</div></div>`
          : ""

        const edges = s.on || []
        const edgesBlock = edges.length
          ? `<div class="field"><div class="k">outgoing edges — on (first match wins)</div><div class="edges">${edges
              .map((e) => {
                const t = byName[e.to]
                const ta = t ? actorOf(t) : "unknown"
                return (
                  `<div class="edge"><div class="er"><span class="pat">${esc(e.pattern)}</span><span class="arr">→</span>` +
                  `<button class="goto" data-actor="${ta}" data-to="${esc(e.to)}">${esc(e.to)}</button></div>` +
                  `${e.describe ? `<div class="em">${esc(e.describe)}</div>` : ""}</div>`
                )
              })
              .join("")}</div></div>`
          : `<div class="field"><div class="k">outgoing edges</div><p class="none">${
              s.kind === "commit"
                ? "Commit state — no outgoing edges. Entering it ends the process in one squash."
                : "No outgoing edges declared."
            }</p></div>`

        const retryOut =
          s.retry && byName[s.retry.otherwise]
            ? `<div class="field"><div class="k">retry redirect</div><div class="edge"><div class="er">` +
              `<span class="pat">after ${esc(s.retry.max)} tries</span><span class="arr">→</span>` +
              `<button class="goto" data-actor="${actorOf(byName[s.retry.otherwise])}" data-to="${esc(s.retry.otherwise)}">${esc(s.retry.otherwise)}</button>` +
              `</div></div></div>`
            : ""

        const inc = s.incoming || []
        const incBlock =
          `<div class="field"><div class="k">routes in from (${inc.length})</div>` +
          (inc.length
            ? `<div class="incoming">${inc
                .map((i) => {
                  const f = byName[i.from]
                  return `<button class="goto" data-actor="${f ? actorOf(f) : "unknown"}" data-to="${esc(i.from)}" title="${esc(i.pattern)}">${esc(i.from)}</button>`
                })
                .join("")}</div>`
            : `<p class="none">Reached only as an entry point (a CLI command enters it directly).</p>`) +
          `</div>`

        drawer.style.setProperty("--card-accent", `var(--${meta(a).dot}-dot)`)
        drawer.innerHTML =
          `<div class="drawer-head" style="--card-accent:var(--${meta(a).dot}-dot)">` +
          `<div class="top"><h3>${esc(s.name)}</h3>` +
          `<button class="close-x" id="closeX" aria-label="Close detail">✕</button></div>` +
          `<div class="meta-row">${pill(a)}<span class="kind">${esc(s.kind)}</span>` +
          `${s.initial ? '<span class="flag">initial</span>' : ""}` +
          `${s.retry ? `<span class="flag">retry ${s.retry.max}</span>` : ""}` +
          `${flags
            .filter((f) => f !== "initial")
            .map((f) => `<span class="flag">${esc(f)}</span>`)
            .join("")}</div></div>` +
          `<div class="drawer-body">` +
          `<div class="field"><div class="k">definition</div><dl class="kv">${kv
            .map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`)
            .join("")}</dl></div>` +
          flagBlock +
          edgesBlock +
          retryOut +
          incBlock +
          `</div>`

        drawer
          .querySelectorAll(".goto")
          .forEach((b) => (b.onclick = () => openDrawer(b.dataset.to)))
        drawer.querySelector("#closeX").onclick = closeDrawer

        backdrop.classList.add("open")
        drawer.classList.add("open")
        drawer.querySelector(".drawer-body").scrollTop = 0
        drawer.querySelector("#closeX").focus()
      }
      function closeDrawer() {
        backdrop.classList.remove("open")
        drawer.classList.remove("open")
        if (lastFocus && lastFocus.focus) lastFocus.focus()
      }
      backdrop.onclick = closeDrawer
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && drawer.classList.contains("open")) closeDrawer()
      })

      // expose for interactions
      window.__openState = openDrawer
    </script>
  </body>
</html>
