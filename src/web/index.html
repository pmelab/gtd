<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      interactive-widget=resizes-content: makes the layout viewport (and so
      any `100dvh` container, e.g. NoteSheet.tsx's own sheet) shrink to the
      space actually left by an on-screen keyboard, instead of the keyboard
      simply overlaying fixed page content. Without this, NoteSheet.tsx's
      Save control — a normal-flow last child relying on `dvh` to end up
      above the keyboard — has no way to know the keyboard opened at all.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <title>gtd</title>
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/android-chrome-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="gtd" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4f1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151a1d" />
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
