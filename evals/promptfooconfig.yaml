description: gtd prompt evals — the packages.item.spec.review spec-review case

# One prompt: the fixture variant name, run through the exec: provider below.
# run-turn.mjs builds the fixture, drives one real driver turn, and prints
# the JSON the asserts below inspect.
prompts:
  - "{{variant}}"

# Two providers turn the same run into the comparison matrix: `planner` is
# the tier packages.item.spec.review actually runs under (plannerModel),
# `cheap` is a lower tier — a one-model run couldn't show a tier trade-off.
# The model rides on the provider's own command line, not a `config:` block,
# so run-turn.mjs can inject it as GTD_PLANNERMODEL (never `--var
# plannerModel=`, which an ambient env var would silently outrank).
providers:
  - id: "exec:node run-turn.mjs --model opus"
    label: planner
  - id: "exec:node run-turn.mjs --model haiku"
    label: cheap

# Two-sided by construction: a prompt that always flags fails `clean`, one
# that never flags fails `violation` — see evals/cases/spec-review.mjs.
tests:
  - vars:
      variant: violation
    assert:
      # Tier 1 + 2, deterministic — no model, no cost.
      - type: javascript
        value: file://asserts/spec-review.mjs
      # Tier 3, the rubric judge — only meaningful once tiers 1/2 passed, so
      # a structurally broken turn is graded as "STRUCTURAL FAILURE" rather
      # than spending a judge call scoring garbage feedback. promptfoo has no
      # assert short-circuit, so this still costs one judge call on that
      # ~2-token input — negligible next to a driver turn measured in
      # minutes.
      - type: llm-rubric
        transform: 'JSON.parse(output).structurallyOk ? JSON.parse(output).feedback : "STRUCTURAL FAILURE"'
        value: >-
          The feedback names the concrete defect in the implementation and
          says specifically what to change to fix it. Vague statements like
          "the package has problems" must fail, and so must the literal text
          "STRUCTURAL FAILURE".
        # Pinned and never a model in the matrix above — a model grading its
        # own output is not a grader.
        provider: "anthropic:messages:claude-sonnet-4-5-20250929"
  - vars:
      variant: clean
    assert:
      # clean has no feedback to judge — tiers 1/2 only.
      - type: javascript
        value: file://asserts/spec-review.mjs
